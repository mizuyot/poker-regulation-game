<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー店経営 5年</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#1a1a1a; --soft:#dedede; --soft2:#f1f1f1;
  --wall:#ececec; --wall-dark:#c9c9c9; --shadow:rgba(0,0,0,.13); --panel:#ffffff; --gray:#8a8a8a;
  --danger:#b3261e; --good:#2e6b45;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
    --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
  --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 左上：一時停止と4指標 */
.tl{position:fixed;top:16px;left:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;z-index:2}
.tlrow{display:flex;gap:8px;align-items:center}
.pause{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:13px}
.speed{font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px 8px;cursor:pointer;font-family:var(--mono)}
.ind{display:grid;grid-template-columns:auto 80px 2.2em;gap:3px 8px;font-size:11.5px;align-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:6px 8px;border-radius:10px}
.ind .bar{height:6px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ind .bar i{display:block;height:100%;background:var(--gray);width:0;transition:width .3s}
.ind .v{font-family:var(--mono);text-align:right;color:var(--muted)}

/* 上中央：時間 */
.time{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 600px));min-width:320px;text-align:center;z-index:2;background:color-mix(in srgb,var(--bg) 82%,transparent);border-radius:12px;padding:4px 8px 6px}
.tdate{display:flex;align-items:baseline;justify-content:center;gap:12px}
.tdate b{font-size:22px;font-weight:700}
.tdate .m{font-size:16px}
.tdate .clock{font-family:var(--mono);font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:0 6px}
.tdate .clock.closed{color:var(--muted);border-color:var(--soft)}
.tbar{display:flex;gap:1px;margin-top:6px;height:12px}
.tbar .y{display:flex;gap:1px;flex:1}
.tbar .y + .y{margin-left:5px}
.tbar i{flex:1;background:var(--soft2);border:1px solid var(--soft);border-radius:2px;position:relative;overflow:hidden}
.tbar i.past{background:var(--gray);border-color:var(--gray)}
.tbar i.now{border-color:var(--ink)}
.tbar i.now b{position:absolute;left:0;top:0;bottom:0;background:var(--gray)}
.tbar i.mark::after{content:"";position:absolute;left:50%;bottom:-1px;width:4px;height:4px;transform:translateX(-50%) rotate(45deg);background:var(--danger)}
.tlabels{position:relative;height:16px;font-size:10.5px;color:var(--muted);margin-top:2px}
.tlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tnote{font-size:12px;color:var(--muted)}

/* 右上：お金 */
.hud{position:fixed;top:14px;right:16px;text-align:right;line-height:1.4;pointer-events:none;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:4px 6px;border-radius:10px;z-index:2}
.money{font-size:32px;font-family:var(--mono);display:flex;align-items:center;gap:8px;justify-content:flex-end}
.money.neg{color:var(--danger)}
.money small{font-size:13px;font-family:var(--font)}
.chip{display:inline-block;width:.62em;height:.62em;border-radius:50%;border:.17em solid currentColor;flex:none}
.money .chip{border-color:var(--ink)}
.hud .sub{font-size:13.5px}
.hud .tiny{font-size:12px;color:var(--muted)}
.hud .risk{font-size:12px;color:var(--danger);margin-top:2px}
.pos{color:var(--good)} .negc{color:var(--danger)}

.toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:min(520px,calc(100vw - 32px));z-index:2}
.toast div.bad{border-color:var(--danger);color:var(--danger)}
.toast div.good{border-color:var(--good);color:var(--good)}
.toast div{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px 10px;font-size:13px;animation:fade 4.5s forwards;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.dockwrap{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100vw - 24px);z-index:2}
.tag{border:1.5px solid var(--line);border-radius:9px;padding:1px 9px;font-size:12px;background:var(--bg);min-height:20px}
.tag:empty{visibility:hidden}
.dock{display:flex;gap:12px;border:2px solid var(--line);border-radius:18px;padding:12px 14px 8px;background:var(--bg);overflow-x:auto;max-width:100%}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;position:relative;min-width:58px}
.act .ic{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--bg);box-shadow:3px 4px 0 var(--shadow);font-size:19px;font-weight:700;transition:transform .08s}
.act.on .ic{border-width:4px}
.act.on .c{font-weight:700}
.act:active .ic{transform:translateY(2px)}
.act .k{position:absolute;left:0;top:36px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:10px;display:grid;place-items:center;font-family:var(--mono)}
.act .c{font-size:11.5px;white-space:nowrap}
.act svg{width:23px;height:23px}

/* 画面（モーダル） */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 86%,transparent);display:none;place-items:center;padding:16px;overflow:auto;z-index:10}
.ov.show{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;width:min(740px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:6px 8px 0 var(--shadow)}
.card h1{font-size:23px;font-weight:700;margin:0 0 6px}
.card h2{font-size:13px;font-weight:700;margin:18px 0 8px;letter-spacing:.06em}
.card p{margin:6px 0;font-size:14px;line-height:1.75}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opt{position:relative;border:1.5px solid var(--soft);border-radius:12px;padding:10px 12px;background:var(--bg);text-align:left;cursor:pointer;font-size:13px;line-height:1.55;transition:box-shadow .1s,transform .1s}
.opt:hover{border-color:var(--line)}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt small{color:var(--muted);display:block}
.opt[aria-pressed="true"]{border:2.5px solid var(--ink);box-shadow:4px 5px 0 var(--ink);transform:translate(-2px,-2px)}
.opt[aria-pressed="true"]::before{content:"✓";position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.stylelist{display:flex;flex-direction:column;gap:8px}
.stylelist .opt{display:grid;grid-template-columns:1fr auto 14px;gap:12px;align-items:center;padding-right:0;overflow:visible}
.stylelist .stripe{align-self:stretch;margin:-10px 0 -10px 0;border-radius:0 10px 10px 0}
.stripe.black,.tsw.black{background:#111}
.stripe.gray,.tsw.gray{background:#9a9a9a}
.stripe.clean,.tsw.clean{background:var(--good)}
.tsw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:6px 2px 0;flex-wrap:wrap}
.okc{color:var(--good);font-weight:700}
.riskcol{font-size:11.5px;text-align:right;font-family:var(--mono);white-space:nowrap}
.arrow{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin:4px 2px 0}
.choice{display:block;width:100%;margin:6px 0}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
.stepper output{font-size:28px;min-width:2ch;text-align:center;font-family:var(--mono)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);border-radius:999px;padding:9px 20px;background:var(--bg);cursor:pointer;font-size:14px}
.btn.primary{border-width:3px;font-weight:700;box-shadow:3px 4px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
table.t td,table.t th{border-bottom:1px solid var(--soft);padding:5px 6px;text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td:not(:first-child){font-family:var(--mono)}
table.t tr.total td{font-weight:700;border-top:1.5px solid var(--line)}
details{border-top:1px solid var(--soft);margin-top:10px;padding-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.prov{margin:8px 0;padding:8px 10px;border-left:2px solid var(--line);font-size:12.5px;line-height:1.7}
.prov a{color:inherit}
.big{font-size:42px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono)}
.big small{font-size:15px;font-family:var(--font)}
.timeline{font-size:12.5px;line-height:1.8;max-height:200px;overflow:auto;border:1px solid var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.slider{display:grid;grid-template-columns:4.5em 1fr 4.5em;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.slider input{width:100%;accent-color:var(--gray)}
/* 営業時間ゲージ（1本・つまみ2つ） */
.gauge{position:relative;height:46px;margin:26px 4px 26px;user-select:none;touch-action:none}
.gauge .track{position:absolute;left:0;right:0;top:14px;height:18px;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ink)}
.gauge .range{position:absolute;top:14px;height:18px;border:2.5px solid var(--ink);border-radius:9px;background:color-mix(in srgb,var(--ink) 8%,transparent);pointer-events:none}
.gauge .legal{position:absolute;top:6px;height:34px;border-left:2px dashed var(--danger)}
.gauge .legal span{position:absolute;top:44px;left:-2px;transform:translateX(-50%);font-size:10px;color:var(--danger);white-space:nowrap}
.gauge .h{position:absolute;top:8px;width:22px;height:30px;margin-left:-11px;border:2px solid var(--line);border-radius:7px;background:var(--bg);cursor:grab;box-shadow:2px 3px 0 var(--shadow);display:grid;place-items:center;font-size:9px}
.gauge .h:focus{outline:2px solid var(--ink);outline-offset:2px}
.gauge .tick{position:absolute;top:36px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-family:var(--mono)}
.gauge .lbl{position:absolute;top:-18px;font-size:11px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-weight:500}
.warn{color:var(--danger);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.grid2 span:nth-child(even){text-align:right;font-family:var(--mono)}
.rank{font-size:12.5px;line-height:1.7;margin:0;padding-left:1.4em}
.rank li{font-family:var(--mono)}
.steps{display:flex;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.steps span.on{color:var(--ink);font-weight:700}
@media (max-width:900px){
  .time{top:auto;bottom:150px;width:calc(100vw - 24px);min-width:0}
  .toast{top:100px}
}
@media (max-width:720px){
  .toast{top:190px}
  .money{font-size:24px}.hud{top:10px;right:10px}.tl{top:10px;left:10px}.ind{display:none}
  .act .ic{width:42px;height:42px;font-size:16px}.act{min-width:46px}.act .k{top:28px}.dock{gap:6px;padding:10px 8px 6px}
  .time{bottom:140px}.tdate b{font-size:18px}
}
</style>
</head>

<canvas id="cv"></canvas>

<div class="tl">

</div>

  <div class="risk" id="riskV"></div>
</div>

<div class="toast" id="toast"></div>

<div class="dockwrap">

    <button class="act" data-a="settings"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L14.9 3h-4l-.4 2.7a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.4 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.9h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM12.9 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg></span><span class="k">4</span><span class="c">営業設定</span></button>
    <button class="act" data-a="edu"><span class="ic">育</span><span class="k">5</span><span class="c" id="eduC">教育</span></button>
    <button class="act" data-a="finance"><span class="ic">¥</span><span class="k">6</span><span class="c">借入</span></button>
  </div>
</div>

<div class="ov" id="ov"><div class="card" id="card"></div></div>

<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("shop-data").textContent);
const PROV = JSON.parse(document.getElementById("provisions-data").textContent);
const M = D.meta, L = D.layout, O = D.operations, R = D.risk, V = D.valuation, F = D.finance, IND = D.indicators, ST = D.staff;
const STYLES = D.styles.list;
const $ = (id) => document.getElementById(id);
const byId = (arr, id) => arr.find((x) => x.id === id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const QS = new URLSearchParams(location.search);
const TEST = QS.has("test");
let rand = Math.random;
if (QS.has("seed")) { let s = (+QS.get("seed") >>> 0) || 1; rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

function yen(man, sign){
  const neg = man < 0, v = Math.round(Math.abs(man));
  const oku = Math.floor(v / 10000), rest = v % 10000;
  let s = oku ? `${oku}億${rest ? rest.toLocaleString("ja-JP") + "万" : ""}円` : `${rest.toLocaleString("ja-JP")}万円`;
  if (oku && !rest) s = `${oku}億円`;
  return (neg ? "−" : sign && man > 0 ? "+" : "") + s;
}
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const hhLong = (h) => h >= 24 ? `翌${h - 24}時` : `${h}時`;
const clockStr = (h) => { const hh = Math.floor(h) % 24, mm = Math.floor((h % 1) * 60 / 10) * 10; return `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}`; };
const tierHTML = (st) => `<span class="tsw ${st.tier}" title="${esc(st.tierLabel)}"></span>`;

/* ---------- 店の形 ---------- */
function build(loc, tables){
  const area = tables * L.tsuboPerTable + L.commonTsubo;
  const rent = area * loc.tsuboRent, deposit = rent * L.depositMonths, fitout = area * loc.fitoutPerTsubo, tablesCost = tables * L.tablePrice;
  return { area, rent, deposit, fitout, tablesCost, invest: deposit + fitout + tablesCost + L.openingCost };
}
function bandWeight(open, close){ let w = 0; for (const b of O.bands){ const a = Math.max(open, b.from), z = Math.min(close, b.to); if (z > a) w += (z - a) * b.w; } return w; }
const BASE_W = bandWeight(14, 24);
const turnsFor = (open, close, policy) => bandWeight(open, close) / O.avgStayHours * O.turnsScale * (policy ? policy.turns : 1);

/* ---------- 状態 ---------- */
let S = null;
function gauss(){ let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function newState(cfg){
  const loc = byId(D.locations, cfg.loc), b = build(loc, cfg.tables);
  const hiring = byId(ST.hiring, cfg.hiring), policy = byId(ST.policy, cfg.policy), contact = byId(ST.contact, cfg.contact);
  const ind = { ...IND.start };
  for (const src of [hiring.start, contact.start]) for (const [k, v] of Object.entries(src || {})) ind[k] = clamp(ind[k] + v, 0, 100);
  const st = {
    cfg, loc, hiring, policy, contact, style: byId(STYLES, cfg.style),
    tables: cfg.tables, area: b.area, rent: b.rent, deposit: b.deposit, fitout: b.fitout, tablesValue: b.tablesCost,
    open: cfg.open, close: cfg.close, price: cfg.price, ad: 0,
    cash: M.fund - b.invest - (cfg.unlicensed ? 0 : D.license.fee), debt: 0,
    month: 0, monthT: 0, openedAt: null,
    licensed: false, licenseWait: cfg.unlicensed ? 0 : D.license.waitMonths, unlicensed: !!cfg.unlicensed,
    used: {}, lastUsed: {}, stopUntil: {}, riskMonths: [], orders: 0, rumor: 0, shock: 0,
    ind, share: Math.max(0.3, 1 + gauss() * loc.demandSd), competitors: 0,
    tempDemand: [], pending: [], eventsSeen: new Set(),
    ops: [], last: { guests: 0, occ: 0, rev: 0, net: 0 }, peakMonth: -Infinity,
    year: { rev: 0, op: 0 }, recs: [], q: [], log: [], timeline: [], over: null, paused: false, speed: 1, ddNotified: false,
  };
  st.startCash = st.cash; st.prevCash = st.cash; st.invest = M.fund - st.cash;
  return st;
}
function logEv(type, data){ S.log.push({ t: S.month, type, ...data }); }
function story(text){ S.timeline.push({ t: S.month, text }); }
const monthLabel = (t) => `${Math.floor(t / 12) + 1}年目${(t % 12) + 1}か月`;

/* ---------- 計算 ---------- */
const isOpen = () => S.licensed || S.unlicensed;
const stopped = (id) => (S.stopUntil[id] || 0) > S.month;
function styleNow(){ return stopped(S.style.id) ? byId(STYLES, "deposit") : S.style; }
function demandMult(legalOnly){
  const i = S.ind;
  let m = (0.82 + 0.6 * i.fame / 100) * (0.8 + 0.4 * i.comfort / 100); // 開業時（知名度30・居心地50）で1.0
  m *= Math.pow(S.price, -O.price.elasticity) * S.contact.demand;
  if (!legalOnly) m *= styleNow().effect.demand;
  for (const t of S.tempDemand) m *= t.mult;
  return m;
}
function ramp(){ const t = S.openedAt == null ? 0 : S.month - S.openedAt; return Math.min(1, O.rampStart + (1 - O.rampStart) * t / O.rampMonths); }
const hoursLen = () => S.close - S.open;
function project(legalOnly){
  const seats = S.tables * 9, turns = turnsFor(S.open, S.close, S.policy);
  const hoursF = bandWeight(S.open, S.close) / BASE_W;
  const demand = S.loc.demand * S.share * ramp() * demandMult(legalOnly) * hoursF;
  const occ = seats ? Math.min(S.loc.occCap, demand / (seats * turns)) : 0;
  const guests = seats * occ * turns;
  const spend = S.loc.spend * S.price * (legalOnly ? 1 : styleNow().effect.spend);
  let rev = guests * O.days * spend;
  if (S.rumor > 0) rev *= 1 - R.orderRumor;
  if (S.shock > 0) rev *= 1 - O.trouble.shock;
  const staff = S.loc.staffPerTable * S.hiring.staffMult * S.tables * hoursLen() / O.baseHours;
  const op = rev * (1 - O.variableRate) - S.rent - staff - O.otherFixed - O.ads[S.ad].cost;
  const interest = S.debt * F.rate / 12;
  return { demand, occ, guests, rev, staff, op, interest, net: op - interest };
}
/* リスクの源：営業スタイル（黒・グレー）、深夜営業、無許可 */
function riskSources(){
  if (!isOpen()) return [];
  const out = [], st = styleNow();
  if (st.tier !== "clean") out.push({ id: st.id, short: st.name, tier: st.tier, arrest: st.arrest, growth: st.arrestGrowth, order: st.order, prov: st.provisionIds, style: st });
  if (S.close > O.legalClose){ const a = byId(D.illegal, "latenight"); out.push({ id: "latenight", short: a.short, tier: "black", arrest: a.arrest, growth: 0, order: a.order, prov: a.provisionIds }); }
  if (!S.licensed && S.unlicensed){ const a = byId(D.illegal, "unlicensed"); out.push({ id: "unlicensed", short: a.short, tier: "black", arrest: a.arrest, growth: 0, order: a.order, prov: a.provisionIds }); }
  return out;
}
function risks(){
  let arrest = 0, order = 0;
  const act = riskSources();
  const jumpOf = (tier) => Math.pow(tier === "black" ? R.orderJump : R.orderJumpGray, S.orders); // グレーは是正指摘が中心で、摘発率の上がり方は穏やか
  for (const a of act){ arrest += (a.arrest + a.growth * (S.used[a.id] || 0)) * jumpOf(a.tier); order += a.order; }
  for (const [id, lu] of Object.entries(S.lastUsed)){
    if (act.some((a) => a.id === id)) continue;
    if (S.month - lu <= R.tailMonths){ const base = byId(STYLES, id) || byId(D.illegal, id); arrest += base.arrest * R.tailFactor * jumpOf(base.tier || "black"); }
  }
  return { arrest: Math.min(0.9, arrest), order: Math.min(0.9, order), active: act };
}
function dcfParts(){
  const recent = S.ops.slice(-12);
  const fcfMonth = (recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0) - O.maintenancePerTable * S.tables;
  const i = S.ind;
  const r = V.discountBase + (50 - i.trust) / 100 * V.discountTrust * 2 + V.discountPerOrder * S.orders + (i.slack < 30 ? V.discountLowSlack : 0);
  const g = clamp(V.growthBase + (i.comfort - 50) / 100 * V.growthComfort * 2 + (i.fame - 50) / 100 * V.growthFame * 2, V.growthMin, V.growthMax);
  const rows = []; let fcf = fcfMonth * 12, pv = 0;
  for (let y = 1; y <= V.years; y++){ fcf *= 1 + g; const d = fcf / Math.pow(1 + r, y); pv += d; rows.push({ y, fcf, pv: d }); }
  const tv = fcf * (1 + V.terminalGrowth) / (r - V.terminalGrowth), tvPv = tv / Math.pow(1 + r, V.years);
  return { fcfMonth, r, g, rows, tv, tvPv, ev: Math.max(0, pv + tvPv) };
}
const shellValue = () => S.deposit + S.fitout * L.fitoutResidual + S.tablesValue * L.tableResidual;
const storeValue = () => Math.max(dcfParts().ev + S.deposit, shellValue());

/* ---------- 月次 ---------- */
function monthTick(){
  const wasOpen = isOpen();
  let orderActs = null;
  if (wasOpen && S.openedAt == null){ S.openedAt = S.month; story(S.licensed ? "許可が下り、開業した。" : "許可を待たずに開業した。"); }
  const p = wasOpen ? project() : { demand: 0, occ: 0, guests: 0, rev: 0, op: -S.rent, interest: 0, net: -S.rent };
  S.cash += p.net; S.last = p;
  if (wasOpen){ S.ops.push(p.op); S.year.rev += p.rev; S.year.op += p.op; S.peakMonth = Math.max(S.peakMonth, p.net); }
  logEv("month", { net: Math.round(p.net), guests: Math.round(p.guests), occ: +p.occ.toFixed(3), style: styleNow().id });

  if (wasOpen){
    const rk = risks();
    for (const a of rk.active){ S.used[a.id] = (S.used[a.id] || 0) + 1; S.lastUsed[a.id] = S.month; S.riskMonths.push({ t: S.month, id: a.id, tier: a.tier }); }
    if (rand() < rk.arrest){ logEv("arrest", {}); story("摘発された。"); spawnPolice(); S.month++; rec(p, wasOpen); return finish("arrest"); }
    if (rk.active.length && rand() < rk.order) orderActs = rk.active;
  }
  const i = S.ind;
  if (wasOpen){
    i.fame = clamp(i.fame + O.ads[S.ad].fame + (p.occ > 0.8 ? 0.5 : 0), 0, 100);
    const slackTarget = 85 - 70 * Math.max(0, p.occ - 0.5) / 0.4 - Math.max(0, hoursLen() - 10) * 3;
    i.slack = clamp(i.slack + (slackTarget - i.slack) * 0.2, 0, 100);
    i.comfort = clamp(i.comfort + ((50 + (i.slack - 50) * 0.4 + S.policy.comfortTarget) - i.comfort) * 0.1, 0, 100);
    i.trust = clamp(i.trust + ((50 + S.policy.trustTarget) - i.trust) * 0.04, 0, 100);
  }
  S.tempDemand = S.tempDemand.filter((t) => --t.months > 0);
  if (S.rumor > 0) S.rumor--;
  if (S.shock > 0) S.shock--;
  if (S.licenseWait > 0){ S.licenseWait--; if (S.licenseWait === 0){ S.licensed = true; S.unlicensed = false; note("許可が下りた。", "good"); logEv("licensed", {}); } }

  if (wasOpen && rand() < S.loc.competition.p){ S.competitors++; S.share *= 1 - S.loc.competition.hit; note(`近くに競合店が開業した（需要 −${Math.round(S.loc.competition.hit * 100)}%）`, "bad"); story("近くに競合店が開業した。"); }
  const trP = S.loc.troubleP * S.hiring.trouble * (i.slack < 30 ? 1.5 : 1);
  if (wasOpen && rand() < trP){
    if (rand() < 0.5){ const c = (O.trouble.costMin + rand() * (O.trouble.costMax - O.trouble.costMin)) * (1 + S.tables / 10); S.cash -= c; const t = D.troubleTexts[Math.floor(rand() * D.troubleTexts.length)]; note(`${t}（${yen(-c)}）`, "bad"); story(`${t}。${yen(c)}かかった。`); logEv("trouble", { cost: Math.round(c) }); }
    else { S.shock = O.trouble.shockMonths; const t = D.shockTexts[Math.floor(rand() * D.shockTexts.length)]; note(`${t}（3か月 売上−30%）`, "bad"); story(`${t}。`); logEv("shock", {}); }
  }
  for (const pd of S.pending.filter((x) => x.at <= S.month)){ applyEffects(pd.effects || {}); note(`後日談：${pd.text}`); story(`後日談：${pd.text}`); }
  S.pending = S.pending.filter((x) => x.at > S.month);

  S.month++;
  rec(p, wasOpen);
  if (S.cash < M.bankruptAt){ story("資金が尽きた。"); return finish("bankrupt"); }
  if (orderActs) enqueue(() => order(orderActs));
  if (S.month >= M.months) enqueue(proposal);
  else {
    if (S.month % 12 === 0) enqueue(annual);
    if (S.month >= R.ddStart && !S.ddNotified){ S.ddNotified = true; enqueue(offer); }
    if (wasOpen && !orderActs) maybeEvent();
  }
  if (S.q.length && !ov.classList.contains("show")) S.q.shift()();
}
/* 月ごとの記録（結果画面のシミュレーション表示に使う）。extra＝営業損益以外の出入り（トラブル・事件・増卓・教育・借入・是正対応費など） */
function rec(p, wasOpen){
  const other = wasOpen ? O.otherFixed + O.ads[S.ad].cost : 0;
  S.recs.push({ t: S.month - 1, open: wasOpen, guests: p.guests || 0, occ: p.occ || 0, rev: p.rev || 0, rent: S.rent, staff: wasOpen ? p.staff : 0, other,
    interest: p.interest || 0, net: p.net, extra: S.cash - S.prevCash - p.net, cash: S.cash, share: S.share, tables: S.tables });
  S.prevCash = S.cash;
}
function enqueue(fn){ S.q.push(fn); S.paused = true; }
function applyEffects(e){
  const i = S.ind;
  for (const k of ["fame", "trust", "comfort", "slack"]) if (e[k]) i[k] = clamp(i[k] + e[k], 0, 100);
  if (e.cash) S.cash += e.cash;
  if (e.demand) S.tempDemand.push({ mult: e.demand.mult, months: e.demand.months });
  if (e.closeDelta) S.close = clamp(S.close + e.closeDelta, S.open + 4, O.closeMax);
  if (e.contactBan) S.contact = byId(ST.contact, "ban");
}

/* ---------- 是正指摘 ---------- */
function order(acts){
  S.orders++;
  const cost = Math.max(R.orderCostMin, Math.max(0, project(true).op) * R.orderCostMonths);
  S.cash -= cost; S.ind.trust = clamp(S.ind.trust + R.orderTrust, 0, 100); S.rumor = R.orderRumorMonths;
  for (const a of acts){
    if (a.id === "latenight") S.close = O.legalClose;
    else if (a.style) S.stopUntil[a.id] = S.month + R.orderStopMonths;
  }
  logEv("order", { acts: acts.map((a) => a.id), cost: Math.round(cost) });
  story(`${R.labels.order}を受けた（${acts.map((a) => a.short).join("・")}）。${R.labels.orderCost} ${yen(cost)}。`);
  spawnPolice();
  pauseWith(() => show(`
    <div class="kicker">${monthLabel(S.month - 1)}</div><h1>${esc(R.labels.order)}</h1>
    <p>${acts.map((a) => esc(a.short)).join("、")}について指摘を受けた。</p>
    <table class="t"><tr><td>${esc(R.labels.orderCost)}</td><td>${yen(cost)}</td></tr>
      <tr><td>信頼</td><td>${R.orderTrust}</td></tr>
      <tr><td>営業スタイル</td><td>${acts.some((a) => a.style) ? `${R.orderStopMonths}か月「預入のみ」になる` : "そのまま"}</td></tr>
      <tr><td>風評（売上）</td><td>${R.orderRumorMonths}か月 −${Math.round(R.orderRumor * 100)}%</td></tr>
      <tr><td>以後の摘発率</td><td>${acts.some((a) => a.tier === "black") ? "×" + Math.pow(R.orderJump, S.orders) : "×" + Math.pow(R.orderJumpGray, S.orders).toFixed(2)}</td></tr>
      <tr><td>店の値段（DCFの割引率）</td><td>+${Math.round(V.discountPerOrder * 100)}%</td></tr></table>
    <p class="muted" style="font-size:12px">${esc(R.note)}</p>
    <details><summary>参考：実際の条文（このゲームの処分モデルの根拠ではない）</summary>${provHTML([...new Set(acts.flatMap((a) => a.prov))])}</details>
    <div class="row"><button class="btn primary" id="okBtn">営業を続ける</button></div>`, () => { $("okBtn").onclick = resume; }));
}

/* ---------- 事件 ---------- */
function eligible(ev){
  const w = ev.when || {};
  if (S.eventsSeen.has(ev.id)) return false;
  if (w.minMonth && S.month < w.minMonth) return false;
  if (w.minFame && S.ind.fame < w.minFame) return false;
  if (w.maxSlack && S.ind.slack > w.maxSlack) return false;
  if (w.minOcc && S.last.occ < w.minOcc) return false;
  if (w.minClose && S.close < w.minClose) return false;

function decide(ev, c){
  if (c.effects) applyEffects(c.effects);
  let text = c.text || "", later = c.later;
  if (c.outcomes){
    let r = rand(), o = c.outcomes.at(-1);
    for (const x of c.outcomes){ if (r < x.p){ o = x; break; } r -= x.p; }
    if (o.effects) applyEffects(o.effects);
    text = (text ? text + " " : "") + o.text; if (o.later) later = o.later;
  }
  if (later) S.pending.push({ at: S.month + later.months, text: later.text, effects: later.effects });
  logEv("event", { id: ev.id, choice: c.label });
  story(`${ev.title} → 「${c.label}」。${text}`);

function ddCheck(){
  // 黒（換金・深夜営業・無許可）と、グレーを別々に判定する
  const black = S.riskMonths.filter((x) => x.tier === "black");
  const bEarly = black.filter((x) => x.t < R.ddStart).length, bLate = black.filter((x) => x.t >= R.ddStart).length;
  const pBlack = 1 - Math.pow(1 - R.ddEarlyQ, bEarly) * Math.pow(1 - R.ddLateQ, bLate);
  if (black.length && rand() < pBlack) return { kind: "shell", late: bLate, p: pBlack, months: black.length };
  let worst = null;
  for (const st of STYLES.filter((s) => s.tier === "gray")){
    const ms = S.riskMonths.filter((x) => x.id === st.id); if (!ms.length) continue;
    const e = ms.filter((x) => x.t < R.ddStart).length, l = ms.length - e;
    const p = 1 - Math.pow(1 - st.dd.q, e) * Math.pow(1 - st.dd.lateQ, l);
    if (rand() < p && (!worst || st.dd.cut < worst.cut)) worst = { kind: "cut", cut: st.dd.cut, name: st.name, p, months: ms.length };
  }
  return worst || { kind: "none" };
}

/* この物件（実際の客数）で、卓数ごとに60か月を素直に回した試算。トラブル・事件は入れない */
function planFor(tables){
  const loc = S.loc, b = build(loc, tables), fee = S.cfg.unlicensed ? 0 : D.license.fee;
  let cash = M.fund - b.invest - fee, minCash = cash, ops = [];
  const seats = tables * 9, turns = turnsFor(S.open, S.close, S.policy), hoursF = bandWeight(S.open, S.close) / BASE_W;
  const share = S.recs.length ? S.recs.at(-1).share : S.share;
  const dm = (0.82 + 0.6 * IND.start.fame / 100) * (0.8 + 0.4 * 50 / 100) * Math.pow(S.price, -O.price.elasticity) * S.contact.demand;
  const staff = loc.staffPerTable * S.hiring.staffMult * tables * hoursLen() / O.baseHours;
  const wait = S.cfg.unlicensed ? 0 : D.license.waitMonths;
  for (let t = 0; t < M.months; t++){
    if (t < wait){ cash -= b.rent; continue; }
    const rampF = Math.min(1, O.rampStart + (1 - O.rampStart) * (t - wait) / O.rampMonths);
    const occ = Math.min(loc.occCap, loc.demand * share * rampF * dm * hoursF / (seats * turns));
    const op = seats * occ * turns * O.days * loc.spend * S.price * (1 - O.variableRate) - b.rent - staff - O.otherFixed;
    cash += op; ops.push(op); minCash = Math.min(minCash, cash);
  }
  const fcf = ops.slice(-12).reduce((a, x) => a + x, 0) / 12 - O.maintenancePerTable * tables;
  let f = fcf * 12, pv = 0; for (let y = 1; y <= V.years; y++){ f *= 1 + V.growthBase; pv += f / Math.pow(1 + V.discountBase, y); }
  const ev = Math.max(0, pv + f * (1 + V.terminalGrowth) / (V.discountBase - V.terminalGrowth) / Math.pow(1 + V.discountBase, V.years));
  return { tables, invest: b.invest + fee, minCash, final: minCash < 0 ? 0 : cash + Math.max(ev + b.deposit, b.deposit + b.fitout * L.fitoutResidual) };
}
function diagnoseHTML(kind){

  const occ = avg((r) => r.occ), rev = avg((r) => r.rev), rent = avg((r) => r.rent), staff = avg((r) => r.staff), other = avg((r) => r.other);
  const seats = S.tables * 9, turns = turnsFor(S.open, S.close, S.policy);
  const perOcc = seats * turns * O.days * S.loc.spend * S.price * styleNow().effect.spend * (1 - O.variableRate);
  const be = perOcc ? (rent + staff + other) / perOcc : 1;
  const plans = []; for (let t = L.minTables; t <= L.maxTables; t++) plans.push(planFor(t));
  const best = plans.reduce((a, x) => x.final > a.final ? x : a, plans[0]), mine = plans.find((x) => x.tables === S.cfg.tables);
  const share = S.recs.length ? S.recs.at(-1).share : S.share;
  const lossRamp = open.filter((r) => r.t < (S.openedAt || 0) + O.rampMonths).reduce((a, r) => a + Math.min(0, r.net), 0);
  const trouble = S.log.filter((x) => x.type === "trouble").reduce((a, x) => a + x.cost, 0);
  if (kind === "bankrupt" && S.openedAt != null && S.month <= S.openedAt + O.rampMonths)
    items.push([5, "立ち上がりの赤字に耐えられなかった", `開業直後の客は見込みの${Math.round(O.rampStart * 100)}%から始まり、${O.rampMonths}か月かけて増える。その途中の${S.month - S.openedAt}か月で営業赤字が${yen(-lossRamp)}積み上がり、開業時の手元資金 ${yen(S.startCash)} を使い切った。`]);
  if (open.length && occ < be)
    items.push([5, "卓が多すぎて、満席率が損益分岐に届いていない", `直近の満席率は${Math.round(occ * 100)}%、この卓数・営業時間・料金での損益分岐は${be > 1 ? "100%超" : Math.round(be * 100) + "%"}。空いた卓のぶんも家賃と人件費がかかっている。営業中なら「減卓」（3）で固定費を下げられた。`]);
  if (S.invest > 2500 || S.startCash < 2000)
    items.push([4, "初期投資が大きく、手元資金が薄かった", `初期投資 ${yen(S.invest)}、開業時の手元資金 ${yen(S.startCash)}。立ち上がりの赤字とトラブルに備えて、手元に2,000万円以上残すのが目安（初期投資は1,500〜2,000万円が目安）。`]);
  if (best && mine && best.tables !== mine.tables && best.final > mine.final * 1.05)
    items.push([4, `この物件なら${best.tables}卓が良かった（試算）`, `実際の客数で60か月を回し直すと、${mine.tables}卓は${mine.final > 0 ? "手取り " + yen(mine.final) : "途中で資金が尽きる"}、${best.tables}卓（初期投資 ${yen(best.invest)}）は手取り ${yen(best.final)}。トラブルと事件を除いた試算。`]);
  if (share < 0.85)
    items.push([3, "物件が外れた（客数が見込みより少ない）", `実際の客数は見込みの${Math.round(share * 100)}%（物件の当たり外れ${S.competitors ? `と競合${S.competitors}店の出店` : ""}）。${S.loc.name}は読みにくさ ±${Math.round(S.loc.demandSd * 100)}%。最初の数か月で客足が鈍いと分かった時点で、減卓や営業時間の短縮で守りに入れた。`]);
  if (rev > 0 && rent / rev > 0.3) items.push([3, "家賃が重い", `家賃が売上の${Math.round(rent / rev * 100)}%。${S.loc.name}は坪${S.loc.tsuboRent}万円。卓を絞って面積を小さくするか、家賃の安い立地を選ぶ。`]);
  if (rev > 0 && staff / rev > 0.5) items.push([3, "人件費が重い", `人件費が売上の${Math.round(staff / rev * 100)}%（${S.hiring.name}、${hoursLen()}時間営業）。客入りの薄い昼の時間を削る、採用方針を見直す。`]);
  if (hoursLen() > 12) items.push([2, "営業時間が長い", `${hhLong(S.open)}〜${hhLong(S.close)}の${hoursLen()}時間。昼（12〜17時）の客入りは夜の約3分の1で、人件費は時間に比例する。`]);
  if (trouble > 0) items.push([2, "トラブルの出費", `トラブルで合計 ${yen(trouble)}。スタッフの余力が30を切るとトラブルは1.5倍起きやすい。教育（5）で余力を保つ。`]);
  if (S.orders) items.push([4, `${R.labels.order}を${S.orders}回受けた`, `是正対応費・風評（売上−25%）・店の値段の割引率+10%が重なった。営業スタイルを「預入のみ」に戻すと止まる。`]);
  if (S.dd && S.dd.kind === "cut") items.push([4, "グレーの営業で売却額が減った", `買収前調査で「${S.dd.name}」が見つかり、売却額が${Math.round(S.dd.cut * 100)}%になった。`]);
  if (S.dd && S.dd.kind === "shell") items.push([5, "黒の営業で売却額がハコの価値だけになった", "継続的なキャッシュフローと認められなかった。"]);
  if (kind === "arrest") items.push([5, "摘発エンド", "黒の営業や違法営業は、続けるほど摘発の確率が上がる。瞬間収益は大きいが、最終手取り額のランキングには残らない。"]);
  if (S.ind.slack < 35) items.push([2, "スタッフが疲れていた", `余力 ${Math.round(S.ind.slack)}。満席が続くと余力は落ち、居心地とトラブルに響く。`]);
  if (S.ind.comfort < 40) items.push([2, "初心者が定着しなかった", `初心者の居心地 ${Math.round(S.ind.comfort)}。成長率（店の値段）と客数に効く。教育方針「おもてなし」や事件での判断で上げられる。`]);
  if (kind === "complete" && items.length < 2){
    if (!S.debt && canBorrow().ok) items.push([1, "借入を使っていない", "健全営業で黒字なら借りられる。満席が続くなら、借りて増卓すれば店の値段も上がる。"]);
    if (S.ad === 0 && S.ind.fame < 45) items.push([1, "知名度が低いまま", `知名度 ${Math.round(S.ind.fame)}。広告（1）で上がり、店の値段の成長率にも効く。`]);
  }
  items.sort((a, b) => b[0] - a[0]);
  if (!items.length) return `<p>大きな問題はなかった。</p>`;
  return `<ol style="padding-left:1.3em;margin:4px 0">${items.slice(0, 5).map(([, t, d]) => `<li style="margin:6px 0"><b>${esc(t)}</b><br><span style="font-size:13px">${esc(d)}</span></li>`).join("")}</ol>`;
}
const RANK_KEY = "poker-shop-v07-rank";
function loadRank(){ try { return JSON.parse(localStorage.getItem(RANK_KEY)) || { final: [], peak: [] }; } catch { return { final: [], peak: [] }; } }
function saveRank(kind, amount){

    const base = { loc: S.loc.name, tables: S.tables, tier: S.style.tier, date: new Date().toISOString().slice(0, 10) };
    r.final.push({ ...base, amount: Math.round(amount), mine: true });

  const out = { final: r.final.slice(0, 10), peak: r.peak.slice(0, 10) };
  try { localStorage.setItem(RANK_KEY, JSON.stringify({ final: out.final.map(({ mine, ...x }) => x), peak: out.peak.map(({ mine, ...x }) => x) })); } catch {}
  return out;
}

function gaugeHTML(){
  const ticks = []; for (let h = O.openMin; h <= O.closeMax; h += 2) ticks.push(h);
  return `<div class="gauge" id="gauge" role="group" aria-label="営業時間">
    <div class="track">${O.bands.map((b) => `<div class="band" data-from="${b.from}" data-to="${b.to}" style="opacity:${(b.w * 0.09).toFixed(2)}"></div>`).join("")}</div>

    <button class="h" data-h="open" aria-label="開店時刻">開</button><button class="h" data-h="close" aria-label="閉店時刻">閉</button>
    <span class="lbl" data-l="open"></span><span class="lbl" data-l="close"></span>
    ${ticks.map((h) => `<span class="tick" data-t="${h}">${h % 24}</span>`).join("")}</div>`;
}
function wireGauge(cfg, onChange){
  const g = $("gauge"), span = O.closeMax - O.openMin;
  const x = (h) => ((h - O.openMin) / span * 100) + "%";
  const place = () => {
    g.querySelectorAll(".band").forEach((b) => { const f = Math.max(+b.dataset.from, O.openMin), t = Math.min(+b.dataset.to, O.closeMax); b.style.left = x(f); b.style.width = `calc(${x(t)} - ${x(f)})`; });
    g.querySelectorAll(".tick").forEach((t) => t.style.left = x(+t.dataset.t));
    g.querySelector(".legal").style.left = x(O.legalClose);
    const rg = g.querySelector(".range"); rg.style.left = x(cfg.open); rg.style.width = `calc(${x(cfg.close)} - ${x(cfg.open)})`;
    rg.style.borderColor = cfg.close > O.legalClose ? "var(--danger)" : "var(--good)";
    g.querySelector('[data-h="open"]').style.left = x(cfg.open); g.querySelector('[data-h="close"]').style.left = x(cfg.close);
    const lo = g.querySelector('[data-l="open"]'), lc = g.querySelector('[data-l="close"]');
    lo.style.left = x(cfg.open); lo.textContent = hhLong(cfg.open); lc.style.left = x(cfg.close); lc.textContent = hhLong(cfg.close);
  };
  const set = (which, h) => {
    if (which === "open") cfg.open = clamp(h, O.openMin, cfg.close - 4); else cfg.close = clamp(h, cfg.open + 4, O.closeMax);
    place(); onChange();
  };
  g.querySelectorAll(".h").forEach((hd) => {
    hd.onpointerdown = (e) => { hd.setPointerCapture(e.pointerId); hd.style.cursor = "grabbing"; };
    hd.onpointermove = (e) => { if (!hd.hasPointerCapture(e.pointerId)) return; const r = g.getBoundingClientRect(); set(hd.dataset.h, Math.round(O.openMin + clamp((e.clientX - r.left) / r.width, 0, 1) * span)); };
    hd.onpointerup = (e) => { hd.releasePointerCapture(e.pointerId); hd.style.cursor = ""; };
    hd.onkeydown = (e) => { const d = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key]; if (d){ e.preventDefault(); set(hd.dataset.h, cfg[hd.dataset.h] + d); } };
  });
  place();
}

function buildCalc(loc){
  const b = build(loc, CFG.tables), lic = !CFG.unlicensed, hiring = byId(ST.hiring, CFG.hiring), policy = byId(ST.policy, CFG.policy), contact = byId(ST.contact, CFG.contact), style = byId(STYLES, CFG.style);

  if (S.riskMonths.some((x) => x.t >= S.month - F.unlockMonths)) return { ok: false, why: `直近${F.unlockMonths}か月に黒・グレーの営業がある` };

function resetScene(){ people = []; pops = []; police = []; bubbles = []; staffBots = []; layoutRoom(); readColors(); }
const STREET_Y = () => room.d + 2.6;
function spawnPasser(){ const dir = Math.random() < 0.5 ? 1 : -1, y = STREET_Y() + (Math.random() - 0.5) * 1.6; people.push({ x: dir > 0 ? -12 : room.w + 12, y, tx: dir > 0 ? room.w + 12 : -12, ty: y, kind: "guest", ph: Math.random() * 6, sp: 1.6 + Math.random(), state: "pass" }); }
function spawnGuest(){
  const dir = Math.random() < 0.5 ? 1 : -1, y = STREET_Y();
  const newbie = Math.random() < 0.35, turnBack = newbie && S && Math.random() < (60 - S.ind.comfort) / 100;
  const t = room.tables[Math.floor(Math.random() * room.tables.length)] || { x: 2, y: 2 }, a = Math.random() * Math.PI * 2;
  people.push({ x: dir > 0 ? -12 : room.w + 12, y, kind: newbie ? "newbie" : "guest", ph: Math.random() * 6, sp: 1.8 + Math.random() * 0.8, state: "toDoor", turnBack,
    seat: { x: t.x + Math.cos(a) * 1.45, y: t.y + Math.sin(a) * 0.95 }, tx: room.door.x, ty: room.d + 0.6 });
}
function spawnPolice(){ police.push({ x: -10, y: STREET_Y(), tx: room.door.x, ty: room.d + 0.8, ph: 0, t: 0 }); }
function stepToward(p, dt, speed){ const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy); if (d < 0.08) return true; const s = Math.min(d, p.sp * dt * speed); p.x += dx / d * s; p.y += dy / d * s; p.ph += dt * 9 * speed; return false; }
function draw(dt){
  cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
  const running = S && !S.paused && !S.over, sp = S ? S.speed : 1, lit = shopLit();
  // 通り（立地の格で太さが変わる）
  const sy = STREET_Y(), half = 1.1 + (S ? S.loc.tsuboRent : 1.5) * 0.25;
  poly([iso(-30, sy - half), iso(room.w + 30, sy - half), iso(room.w + 30, sy + half), iso(-30, sy + half)], C.soft2);
  for (const e of [sy - half, sy + half]){ const a = iso(-30, e), b = iso(room.w + 30, e); cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.strokeStyle = C.ink; cx.lineWidth = 1.3; cx.stroke(); }
  if (S){ const p = iso(-6, sy + half + 0.7); cx.save(); cx.translate(p[0], p[1]); cx.rotate(Math.atan2(TW / 4, TW / 2)); cx.fillStyle = C.muted; cx.font = `500 12px ${C.font}`; cx.fillText(`${S.loc.name}の通り`, 0, 0); cx.restore(); }
  // 競合店（通りの向かい）
  if (S) for (let i = 0; i < S.competitors; i++){
    const bx = (i % 2 ? room.w + 2 + Math.floor(i / 2) * 4 : -5 - Math.floor(i / 2) * 4), by = sy + half + 1, w = 2.6, d = 2, h = TW * 0.9;
    poly([iso(bx, by, h), iso(bx + w, by, h), iso(bx + w, by + d, h), iso(bx, by + d, h)], C.wallD, C.ink, 1);
    poly([iso(bx, by + d), iso(bx + w, by + d), iso(bx + w, by + d, h), iso(bx, by + d, h)], C.wall, C.ink, 1);
    poly([iso(bx + w, by), iso(bx + w, by + d), iso(bx + w, by + d, h), iso(bx + w, by, h)], C.soft, C.ink, 1);
    const p = iso(bx + w / 2, by + d / 2, h); cx.fillStyle = C.muted; cx.font = `500 10px ${C.font}`; cx.textAlign = "center"; cx.fillText("競合", p[0], p[1] + 4); cx.textAlign = "start";
  }
  // 床と奥の壁
  const WH = TW * 1.1;
  const floor = [iso(0, 0), iso(room.w, 0), iso(room.w, room.d), iso(0, room.d)];
  poly(floor.map((p) => [p[0] + 8, p[1] + 8]), C.sh);
  poly(floor, lit ? C.bg : C.soft2, C.ink, 1.2);
  cx.strokeStyle = C.soft; cx.lineWidth = 0.8;
  for (let x = 1; x < room.w; x++){ const a = iso(x, 0), b = iso(x, room.d); cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); }
  for (let y = 1; y < room.d; y++){ const a = iso(0, y), b = iso(room.w, y); cx.beginPath(); cx.moveTo(a[0], a[1]); cx.lineTo(b[0], b[1]); cx.stroke(); }
  wall(0, 0, room.w, 0, WH, C.wall); wall(0, 0, 0, room.d, WH, C.wallD);
  // バーカウンター（奥の壁沿い）
  poly([iso(room.w - 2.6, 0.2, 14), iso(room.w - 0.3, 0.2, 14), iso(room.w - 0.3, 0.8, 14), iso(room.w - 2.6, 0.8, 14)], C.ink);
  poly([iso(room.w - 2.6, 0.8), iso(room.w - 0.3, 0.8), iso(room.w - 0.3, 0.8, 14), iso(room.w - 2.6, 0.8, 14)], C.wallD, C.ink, 1);
  // 人と卓を奥から順に描く
  if (running && isOpen()){
    if (lit){ const rate = (S.last.guests || S.tables * 5) / Math.max(4, hoursLen()) / 2.2; if (Math.random() < dt * rate * sp) spawnGuest(); }
    if (Math.random() < dt * (0.25 + S.loc.tsuboRent * 0.12) * Math.sqrt(sp)) spawnPasser();
    const tension = lit ? Math.max(0, 45 - Math.min(S.ind.trust, S.ind.comfort)) / 45 : 0;
    if (room.tables.length && Math.random() < dt * tension * 0.8 * sp){ const t = room.tables[Math.floor(Math.random() * room.tables.length)]; bubbles.push({ x: t.x, y: t.y, z: 34, t: 0 }); }
  }
  if (S && isOpen()){
    const want = lit ? Math.max(1, Math.round(S.tables * 0.6 * (S.hiring.id === "lean" ? 0.6 : 1))) : 0;
    while (staffBots.length < want) staffBots.push({ x: room.w - 1.5, y: 1.2, tx: 2, ty: 2, ph: 0, sp: 1.4 });
    staffBots.length = Math.min(staffBots.length, want);
  } else staffBots.length = 0;
  const hurry = S ? 1 + (100 - S.ind.slack) / 45 : 1;
  for (const s of staffBots){ if (running && stepToward(s, dt, sp * hurry)){ const t = room.tables[Math.floor(Math.random() * room.tables.length)] || { x: 2, y: 2 }; s.tx = t.x + (Math.random() - 0.5) * 2.6; s.ty = t.y + 0.9; } }
  for (const p of people){
    if (!running) continue;
    if (p.state === "pass"){ if (stepToward(p, dt, sp)) p.dead = true; }
    else if (p.state === "toDoor"){ if (stepToward(p, dt, sp)){ if (p.turnBack){ p.state = "pass"; p.tx = Math.random() < 0.5 ? -12 : room.w + 12; p.ty = STREET_Y(); bubbles.push({ x: p.x, y: p.y, z: 40, t: 0, text: "…" }); } else { p.state = "toSeat"; p.tx = p.seat.x; p.ty = p.seat.y; } } }
    else if (p.state === "toSeat"){ if (stepToward(p, dt, sp)){ p.state = "sit"; p.t = 0; pops.push({ x: p.x, y: p.y, t: 0, v: Math.round(S.loc.spend * S.price * styleNow().effect.spend * 10000) }); } }
    else if (p.state === "sit"){ p.t += dt * sp; if (p.t > 6 || !lit){ p.state = "leave"; p.tx = room.door.x; p.ty = room.d + 0.6; } }
    else if (p.state === "leave"){ if (stepToward(p, dt, sp)){ p.state = "pass"; p.tx = Math.random() < 0.5 ? -12 : room.w + 12; p.ty = STREET_Y(); } }
  }
  people = people.filter((p) => !p.dead).slice(-180);
  const items = [];
  for (const t of room.tables) items.push({ d: t.x + t.y, f: () => tableShape(t, lit) });
  for (const p of people){ if (p.state === "pass" && p.y < room.d) continue; items.push({ d: p.x + p.y + 0.3, f: () => { const q = iso(p.x, p.y); figure(q[0], q[1], TW / 44, p.ph, p.state !== "sit", p.kind); } }); }
  for (const s of staffBots) items.push({ d: s.x + s.y + 0.3, f: () => { const q = iso(s.x, s.y); figure(q[0], q[1], TW / 44, s.ph, true, "staff"); } });
  for (const q of police){ if (stepToward(q, 1 / 60, 1.6)) q.t += 1 / 60; items.push({ d: q.x + q.y + 0.3, f: () => { const z = iso(q.x, q.y); figure(z[0], z[1], TW / 40, q.ph, q.t === 0, "police"); } }); }
  police = police.filter((q) => q.t < 3);
  const inside = items.filter((it) => it.d < room.w + room.d), outside = items.filter((it) => it.d >= room.w + room.d);
  inside.sort((a, b) => a.d - b.d).forEach((it) => it.f());
  // 手前の低い壁（入口は左手前）
  const lowH = TW * 0.28;
  wall(room.door.x + 1.4, room.d, room.w, room.d, lowH, C.wall); wall(0, room.d, room.door.x - 0.9, room.d, lowH, C.wall); wall(room.w, 0, room.w, room.d, lowH, C.wallD);
  outside.sort((a, b) => a.d - b.d).forEach((it) => it.f());
  // 状態ピル
  if (S){
    const label = !isOpen() ? `許可待ち あと${S.licenseWait}か月` : !lit ? `営業時間外（${hhLong(S.open)}から）` : `${S.tables}卓 ・ 満席率 ${Math.round((S.last.occ || 0) * 100)}%`;
    const p = iso(room.w / 2, 0, WH + 26); cx.font = `700 14px ${C.font}`; const tw = cx.measureText(label).width + 26;
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 2; cx.beginPath(); cx.roundRect(p[0] - tw / 2, p[1] - 15, tw, 30, 9); cx.fill(); cx.stroke();
    cx.fillStyle = C.ink; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(label, p[0], p[1] + 1); cx.textAlign = "start"; cx.textBaseline = "alphabetic";
    const rk = risks();
    if (rk.arrest + rk.order > 0){ const q = iso(room.w / 2, 0, WH + 50); cx.font = `500 12px ${C.font}`; cx.fillStyle = C.danger; cx.textAlign = "center"; cx.fillText(`摘発 ${pct(rk.arrest)} ・ ${R.labels.order} ${pct(rk.order, 0)}（今月）`, q[0], q[1]); cx.textAlign = "start"; }
  }
  for (const b of bubbles){
    b.t += dt; const a = Math.max(0, 1 - b.t / 1.5); cx.globalAlpha = a; const q = iso(b.x, b.y, b.z + b.t * 10);
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(q[0], q[1], 10, 0, Math.PI * 2); cx.fill(); cx.stroke();
    cx.fillStyle = b.text ? C.ink : C.danger; cx.font = `700 13px ${C.font}`; cx.textAlign = "center"; cx.fillText(b.text || "!", q[0], q[1] + 5); cx.textAlign = "start"; cx.globalAlpha = 1;
  }
  bubbles = bubbles.filter((b) => b.t < 1.5);
  for (const p of pops){
    p.t += dt; const a = Math.max(0, 1 - p.t / 1.6); if (!a) continue;
    cx.globalAlpha = a; const txt = `+${p.v.toLocaleString("ja-JP")}円`, q = iso(p.x, p.y, 44 + p.t * 18);
    cx.font = `500 12px ${C.mono}`; const w = cx.measureText(txt).width + 28;
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.roundRect(q[0] - w / 2, q[1] - 11, w, 22, 7); cx.fill(); cx.stroke();
    cx.beginPath(); cx.arc(q[0] - w / 2 + 11, q[1], 3.5, 0, Math.PI * 2); cx.lineWidth = 2.4; cx.stroke();
    cx.fillStyle = C.ink; cx.fillText(txt, q[0] - w / 2 + 19, q[1] + 4); cx.globalAlpha = 1;
  }
  pops = pops.filter((p) => p.t < 1.6);
}

/* ---------- ループ ---------- */
let lastT = performance.now(), hudT = 0;
const SPM = TEST ? 0.02 : M.secondsPerMonth;
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (S && !S.paused && !S.over){
    S.monthT += dt * S.speed / SPM;
    while (S.monthT >= 1 && !S.over && !S.paused){ S.monthT -= 1; monthTick(); }
  }
  draw(dt);
  hudT += dt; if (hudT > 0.1){ hudT = 0; syncHUD(); }
  requestAnimationFrame(frame);
}
window.__shop = { state: () => S, cfg: CFG, start: (cfg) => startGame({ ...CFG, ...cfg }) };
readColors(); buildTimeBar(); resize(); syncHUD(); openTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(readColors);
requestAnimationFrame(frame);
})();
</script>
