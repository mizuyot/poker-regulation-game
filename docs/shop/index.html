/* 物件と競合による最終需要倍率を固定し、預入スタイルで卓数を比較する簡易試算 */
function planFor(tables){
  const loc = S.loc, interior = S.interior || "simple", b = build(loc, tables, interior), fee = S.cfg.unlicensed ? 0 : D.license.fee;
  let cash = M.fund - b.invest - fee, minCash = cash, ops = [];
  const style = DEPOSIT_STYLE, fx = FX(S.fac, interior), edu = EDU(S.edu || "10");
  const manager = currentManager();
  const seats = tables * SEATS_PER_TABLE - fx.seatsLoss, turns = turnsFor(S.open, S.close, S.policy) * manager.turns;
  const share = S.recs.length ? S.recs.at(-1).share : S.share;
  const demand = regionalDemand(loc, tables, S.price, style, fx, edu, D.mixStart.regular, S.open, S.close) * share * manager.demand;
  const occCap = occupancyCapFor(loc, S.price, fx);
  const staff = estimatedWages(loc, tables, S.open, S.close, S.hiring);
  const fixed = b.rent + staff + O.otherFixed + utilityOf(tables, S.open, S.close) + edu.cost + fx.opsCost + manager.monthlyCost;
  const grossPerGuest = customerSpend(style, S.price) * (1 - sellingCostRates(style, fx).total);
  const wait = S.cfg.unlicensed ? 0 : D.license.waitMonths;
  for (let t = 0; t < M.months; t++){
    if (t < wait){ cash -= b.rent; minCash = Math.min(minCash, cash); continue; }
    const { guests } = serviceCapacity(demand * openingDemandFactor(loc, tables, t - wait), seats, turns, occCap);
    const op = guests * O.days * grossPerGuest - fixed;
    cash += op; ops.push(op); minCash = Math.min(minCash, cash);
  }
  const fcf = ops.slice(-12).reduce((a, x) => a + x, 0) / 12 - O.maintenancePerTable * tables;
  let f = fcf * 12, pv = 0; for (let y = 1; y <= V.years; y++){ f *= 1 + V.growthBase; pv += f / Math.pow(1 + V.discountBase, y); }
  const ev = Math.max(0, pv + f * (1 + V.terminalGrowth) / (V.discountBase - V.terminalGrowth) / Math.pow(1 + V.discountBase, V.years));
  return { tables, invest: b.invest + fee, minCash, final: minCash < 0 ? 0 : cash + Math.max(ev + b.deposit, liquidationRecovery(b).liquid) };
}

      status.hidden = false;

  }
  if (!preview?.isConnected) return;

  let shareData;
  if (typeof navigator.share === "function" && typeof navigator.canShare === "function"){
    try {

    } catch {}

        if (error?.name === "AbortError") return;
      }
    }
    const link = document.createElement("a");

    document.body.append(link);
    link.click();
    link.remove();
  };

/* ---------- 営業中の「判断→結果」：先月と比べて、何が利益を動かしたか ---------- */
function explainMonth(){
  const open = S.recs.filter((r) => r.open); if (open.length < 2) return;
  const a = open.at(-2), b = open.at(-1);
  const hasBreakdown = [a, b].every((r) => Number.isFinite(r.spend) && Number.isFinite(r.days));
  const dNet = b.net - a.net;
  if (Math.abs(dNet) < Math.max(30, Math.abs(a.net) * 0.25)) return;
  const visitsA = a.guests * a.days, visitsB = b.guests * b.days;
  const grossProfit = (r) => r.net + r.rent + r.staff + r.other + r.interest;
  const revenueParts = hasBreakdown ? [
    ["本店の客数", (visitsB - visitsA) * a.spend],
    ["本店の客単価", visitsB * (b.spend - a.spend)],
    ["2号店売上", b.branchRev - a.branchRev], ["FCロイヤリティ", b.fcRoy - a.fcRoy],
    ["原価・決済", -(b.varCost - a.varCost)],
  ] : [["粗利", grossProfit(b) - grossProfit(a)]];
  const [top] = [...revenueParts, ["人件費", a.staff - b.staff], ["家賃", a.rent - b.rent],
    ["その他費用", a.other - b.other], ["借入利息", a.interest - b.interest],
  ].filter((x) => Math.abs(x[1]) >= 3).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
  if (!top) return;
  const causes = [], mo = b.t;
  for (const e of S.log.filter((x) => x.t === mo || x.t === mo - 1)){
    if (e.type === "settings") causes.push("設定の変更");
    if (e.type === "manager_change") causes.push("店長の交代");
    if (e.type === "interior_upgrade") causes.push("内装の改装");
    if (e.type === "tables") causes.push(`卓数${e.n}`);
    if (e.type === "edu") causes.push("教育");
    if (e.type === "shock") causes.push("客足が落ちる出来事");
    if (e.type === "order") causes.push(R.labels.order);
  }
  if (b.share < a.share - 0.001) causes.push("競合の出店");
  if (isRamping(b.t, b.tables ?? S.tables)) causes.push("立ち上がり中（客が増えていく時期）");
  if (S.rumor > 0) causes.push("風評");
  note(`先月より${dNet >= 0 ? "+" : "−"}${Math.round(Math.abs(dNet))}万円。主に${top[0]}${top[1] >= 0 ? "が効いた" : "が響いた"}${causes.length ? `（${causes[0]}）` : ""}`, dNet >= 0 ? "good" : "bad");
}

async function startConfiguredGame(button){
  const cfg = { ...CFG };
  if (!MINIMAL_NATIONAL_RANKING || TEST || QS.has("seed") || !RANKED_RULESET || !navigator.onLine){
    startGame(cfg);
    return;
  }
  button.disabled = true;
  const label = button.textContent;
  button.textContent = "開業中…";
  let rankedRun;
  try {
    const { loc, tables, interior, style, open, close, price, edu, unlicensed, manager } = cfg;
    const response = await fetch("/api/shop/play", {
      method: "POST", credentials: "omit",
      headers: { "Content-Type": "application/json", "If-Match": JSON.stringify(RANKED_RULESET) },
      body: JSON.stringify({ setup: { loc, tables, interior, style, open, close, pricePercent: Math.round(price * 100), edu, unlicensed, manager } }),
      signal: AbortSignal.timeout?.(3000),
    });
    if (response.ok){
      const ticket = await response.json();
      if (ticket.ok && /^[0-9a-f-]{36}$/.test(ticket.runId) && /^[A-F0-9]{12}$/.test(ticket.seed)) rankedRun = ticket;
    }
  } catch {}
  if (!button.isConnected) return;
  button.disabled = false;
  button.textContent = label;
  startGame(cfg, rankedRun);
}
function startGame(cfg, rankedRun){
  cfg = { ...cfg, seed: (rankedRun?.seed || cfg.seed || newCode()).toUpperCase() };
  if (!QS.has("seed")) rand = mulberry(hashStr(cfg.seed + ":internal"));
  clearInterval(titleTimer); card.classList.remove("titlecard");
  S = newState(cfg);
  S.rankedRunId = rankedRun?.runId ?? null;
  S.rankActions = [];
  hide(); resetScene();
  logEv("open", { ...S.cfg });
  story(`${S.loc.name}に${cfg.tables}卓の店をつくった${S.fac.length ? `（${S.fac.map((id) => byId(FAC, id).name).join("・")}）` : ""}。営業スタイルは「${S.style.name}」。店長は${currentManager().personName}。初期投資 ${yen(M.fund - S.cash)}。`);
  note(S.licenseWait ? `許可申請中。開業まで${S.licenseWait}か月。` : "開業した。");
  saveGame();
}

const FLOW_EXPENSES = [["varCost", "原価・決済"], ["rent", "家賃"], ["staff", "人件費"], ["other", "その他・利息"]];
const FLOW_SERIES = [["sales", "売上"], ...FLOW_EXPENSES, ["net", "税引前利益"]];
const flowTrack = $("flowTrack"), flowLegend = $("flowLegend"), flowTrend = $("flowTrend");
let flowRecords, flowRecordCount = 0, flowMonths = [], selectedFlowMonth = -1;
let flowNetPositions = [];
const flowAmount = (n) => {
  if (!Number.isFinite(n)) return "—";
  const rounded = Math.round(Math.abs(n));
  return (rounded ? (n < 0 ? "−" : "+") : "") + rounded.toLocaleString("ja-JP");
};
function monthlyAmounts(r){
  const recurringOther = r.other + (r.interest ?? 0);
  const adjustment = r.adjustment ?? 0;
  // 古い保存データでは原価が記録されていない場合がある。
  const varCost = r.varCost ?? Math.max(0, r.rev - r.rent - r.staff - recurringOther - r.net);
  return { month: r.t, sales: r.rev, varCost: -varCost, rent: -r.rent, staff: -r.staff, other: -recurringOther + Math.min(0, adjustment), net: r.net + adjustment, hasAdjustment: Number.isFinite(r.adjustment) };
}
function selectFlowMonth(index){
  const values = flowMonths[index];
  const previous = flowTrack.querySelector('[aria-pressed="true"]');
  if (previous){ previous.setAttribute("aria-pressed", "false"); previous.tabIndex = -1; }
  const bar = flowTrack.querySelector(`[data-month="${index}"]`);
  if (bar){ bar.setAttribute("aria-pressed", "true"); bar.tabIndex = 0; }
  selectedFlowMonth = index;
  $("flowMonth").textContent = values ? monthLabel(values.month) : "";
  $("flowLegacy").hidden = !values || values.hasAdjustment;
  flowLegend.innerHTML = FLOW_SERIES.map(([key, label]) => `<div class="flow-${key}"><dt>${label}</dt><dd class="num${key === "net" && values?.net < 0 ? " neg" : ""}">${flowAmount(values?.[key])}</dd></div>`).join("");
  drawFlowTrend();
}
function drawFlowTrend(){
  if (!flowNetPositions.length) return;
  const { width, height } = flowTrend.getBoundingClientRect();
  if (!width || !height) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  flowTrend.width = Math.round(width * dpr);
  flowTrend.height = Math.round(height * dpr);
  const ctx = flowTrend.getContext("2d");
  ctx.setTransform(flowTrend.width / width, 0, 0, flowTrend.height / height, 0, 0);

  const pad = parseFloat(getComputedStyle(flowTrend).getPropertyValue("--trend-padding"));
  const points = flowNetPositions.map((y, i) => ({
    x: (i + 0.5) * width / 12,
    y: pad + y * (height - pad * 2),
  }));
  const ink = css("--ink"), background = css("--bg");
  ctx.lineJoin = "round";
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (const point of points.slice(1)) ctx.lineTo(point.x, point.y);
  ctx.strokeStyle = background;
  ctx.lineWidth = 4.5;
  ctx.stroke();
  ctx.strokeStyle = ink;
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.fillStyle = ink;
  ctx.strokeStyle = background;
  ctx.lineWidth = 1.5;
  points.forEach(({ x, y }, i) => {
    ctx.beginPath();
    ctx.arc(x, y, i === selectedFlowMonth ? 4 : 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
  });
}
function syncMonthlyChart(){
  const records = S?.recs ?? null;
  const count = records?.length || 0;
  if (flowRecords === records && flowRecordCount === count) return;
  const follow = flowRecords !== records || selectedFlowMonth === flowMonths.length - 1;
  const previousMonth = flowMonths[selectedFlowMonth]?.month;
  const hadFocus = flowTrack.contains(document.activeElement);
  flowRecords = records;
  flowRecordCount = count;
  flowMonths = records?.slice(-12).map(monthlyAmounts) ?? [];
  $("flowChart").classList.toggle("empty", !count);
  $("flowEmpty").hidden = !!count;

  const totals = flowMonths.map((r) => FLOW_EXPENSES.reduce((sum, [key]) => sum - (r[key] || 0), 0));
  const maxIn = Math.max(0, ...flowMonths.map((r) => Math.max(r.sales, r.net)));
  const maxOut = Math.max(0, ...totals, ...flowMonths.map((r) => -r.net));
  const largest = Math.max(1, maxIn, maxOut);
  const step = Math.max(1, 10 ** Math.floor(Math.log10(largest / 2)));
  const roundAxis = (extent) => Math.ceil(Math.max(extent, largest / 4) / step) * step;
  const above = roundAxis(maxIn), below = roundAxis(maxOut);
  const y = (value) => (above - value) * 100 / (above + below);
  flowNetPositions = flowMonths.map((r) => y(r.net) / 100);
  const rect = (key, from, to) => {
    const height = Math.abs(y(to) - y(from));
    if (!height) return "";
    return `<span aria-hidden="true" class="flow-${key}" style="top:${y(Math.max(from, to))}%;height:${height}%"></span>`;
  };

  $("flowChart").style.setProperty("--zero", y(0) / 100);
  $("flowTop").textContent = flowAmount(above);
  $("flowBottom").textContent = flowAmount(-below);
  flowTrack.innerHTML = flowMonths.map((r, index) => {
    const t = r.month;
    const label = `${monthLabel(t)}、売上 ${flowAmount(r.sales)}万円、税引前利益 ${flowAmount(r.net)}万円`;
    let cursor = 0;
    const expenses = FLOW_EXPENSES.map(([key]) => {
      const next = cursor + (r[key] || 0);
      const segment = rect(key, cursor, next);
      cursor = next;
      return segment;
    }).join("");
    const month = t % 12;
    const tick = month === 0 ? `${Math.floor(t / 12) + 1}年目` : month % 3 === 0 ? `${month + 1}か月` : "";
    return `<div class="flow-slot"><button type="button" class="flow-bar" data-month="${index}" tabindex="-1" aria-pressed="false" aria-label="${label}" title="${label}">${rect("sales", 0, r.sales)}${expenses}</button><span class="flow-tick" aria-hidden="true">${tick ? `<span>${tick}</span>` : ""}</span></div>`;
  }).join("");
  selectFlowMonth(follow ? flowMonths.length - 1 : Math.max(0, flowMonths.findIndex((r) => r.month === previousMonth)));
  if (hadFocus) flowTrack.querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
}
flowTrack.addEventListener("click", (event) => {
  const bar = event.target.closest("[data-month]");

});
flowTrack.addEventListener("keydown", (event) => {
  const index = Number(event.target.dataset.month);
  if (!Number.isInteger(index)) return;
  const last = flowMonths.length - 1;
  let next;
  switch (event.key){
    case "ArrowLeft": next = Math.max(0, index - 1); break;
    case "ArrowRight": next = Math.min(last, index + 1); break;
    case "Home": next = 0; break;
    case "End": next = last; break;
    default: return;
  }

  selectFlowMonth(next);
  flowTrack.querySelector('[aria-pressed="true"]').focus();
});

    const seats = S.tables * 9, seated = people.filter((p) => p.sit).length;
    const label = raidScene
      ? (raidScene.arrest ? "機動隊が店内に踏み込んだ" : "警察官5人が命令書を持って立ち入り")
      : !isOpen() ? `許可待ち あと${S.licenseWait}か月` : !lit ? `営業時間外（${hhLong(S.open)}から）` : `${lay.tsubo}坪 ・ ${S.tables}卓 ・ ${seated}/${seats}席`;
    if (shopPair){
      drawStoreCaption(cx, "本店", label, shopPair.mainX, shopPair.y);
      paintBranch(tier, lit);
    } else {
      const labelColor = raidScene ? C.danger : C.ink;
      const p = PHONE.matches ? [W / 2, 20] : [VIEW.ox + (lay.w - lay.d) * VIEW.tw / 4, VIEW.oy - VIEW.wall - 20]; cx.font = `700 14px ${C.font}`; const tw = cx.measureText(label).width + 26;
      cx.fillStyle = C.bg; cx.strokeStyle = labelColor; cx.lineWidth = 2; cx.beginPath(); cx.roundRect(p[0] - tw / 2, p[1] - 15, tw, 30, 9); cx.fill(); cx.stroke();
      cx.fillStyle = labelColor; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(label, p[0], p[1] + 1); cx.textAlign = "start"; cx.textBaseline = "alphabetic";
    }
  }
  for (const b of bubbles){
    b.t += dt; const a = Math.max(0, 1 - b.t / 1.5); cx.globalAlpha = a; const q = iso(b.x, b.y, b.z + b.t * 10);
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(q[0], q[1], 10, 0, Math.PI * 2); cx.fill(); cx.stroke();
    cx.fillStyle = C.ink; cx.font = `700 13px ${C.font}`; cx.textAlign = "center"; cx.fillText("…", q[0], q[1] + 5); cx.textAlign = "start"; cx.globalAlpha = 1;
  }
  bubbles = bubbles.filter((b) => b.t < 1.5);
  for (const p of pops){
    p.t += dt; const a = Math.max(0, 1 - p.t / 1.4); if (!a) continue;
    cx.globalAlpha = a; const txt = `+${p.v.toLocaleString("ja-JP")}円`, q = iso(p.x, p.y, 44 + p.t * 18);
    cx.font = `500 12px ${C.mono}`; const w = cx.measureText(txt).width + 14;
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.roundRect(q[0] - w / 2, q[1] - 11, w, 22, 7); cx.fill(); cx.stroke();
    cx.fillStyle = C.ink; cx.fillText(txt, q[0] - w / 2 + 7, q[1] + 4); cx.globalAlpha = 1;
  }
  pops = pops.filter((p) => p.t < 1.4).slice(-30);
}
/* 店舗イメージ図（開業前の確認用）。卓数ごとのレイアウトをそのまま描く */
function drawPreview(canvas, n, seed0, caption = true, fill = 0.62, tier, it){
  const dpr = Math.min(2, devicePixelRatio || 1), w = canvas.clientWidth || 640, h = canvas.clientHeight || 300;
  canvas.width = w * dpr; canvas.height = h * dpr; const g = canvas.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  const lay = layoutFor(n, it), v = makeView(lay, w, h, caption ? 28 : 8, 8);
  let seed = seed0 != null ? seed0 : n * 97; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const ppl = [], stf = [];
  if (fill > 0){
    lay.tables.forEach((t) => { stf.push({ ...dealerPos(t), sit: true }); for (let k = 0; k < 9; k++) if (rnd() < fill){ const s = seatPos(t, k); ppl.push({ ...s, sit: true, kind: rnd() < 0.25 ? "newbie" : "guest" }); } });
    if (lay.bar) stf.push({ x: lay.bar.serving.x0 - 0.36, y: lay.bar.serving.y0 + 0.1 });
  }
  drawShopG(g, v, { lay, tier: tier || (byId(STYLES, CFG.style) || STYLES[0]).tier, lit: true, people: ppl, staff: stf, elev: 0.6 });
  if (caption){ g.fillStyle = C.muted; g.font = `500 12px ${C.font}`; { const ly = layoutFor(n, it); g.fillText(`${n}卓（${n * 9}席）・ ${ly.tsubo}坪 ${ly.m2}㎡ ・ 内装「${IV(ly.interior).name}」`, 8, 18); } }
}

/* ---------- ループ ---------- */
let lastT = performance.now(), hudT = 0;
const SPM = TEST ? 0.02 : M.secondsPerMonth;
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (S && !S.paused && !S.over){
    S.monthT += dt * playbackSpeed() / SPM;
    while (S.monthT >= 1 && !S.over && !S.paused){ S.monthT -= 1; monthTick(); }
  }
  draw(dt);
  hudT += dt; if (hudT > 0.1){ hudT = 0; syncHUD(); }
  requestAnimationFrame(frame);
}
window.__dbg = () => ({ n: people.length, states: people.reduce((a, p) => (a[p.state] = (a[p.state] || 0) + 1, a), {}), sample: people.slice(0, 3).map((p) => [p.x.toFixed(2), p.y.toFixed(2), p.tx && p.tx.toFixed(2), p.ty && p.ty.toFixed(2), p.state]), lit: shopLit(), want: targetSeated() });
if (TEST) window.__shop = { state: () => S, cfg: CFG, project: () => project(),
  // 検証用：その時点での売却額と、営業スタイルの切り替え
  sellNow: () => { const dd = ddCheck(), v = valuation(dd); return { month: S.month, dd: dd.kind, sale: v.adopted, dcf: v.dcf.point, comps: v.comps.point, liq: v.liq.point, cash: S.cash, debt: S.debt, amount: S.cash + v.adopted - S.debt }; },
  setStyle: (id) => { S.style = byId(STYLES, id); }, preview: (c, n) => drawPreview(c, n), previewIt: (c, n, it) => drawPreview(c, n, undefined, true, 0.62, "clean", it), start: (cfg) => startGame({ ...CFG, ...cfg }) };
readColors(); buildTimeBar(); resize(); syncHUD(); openTitle();
addEventListener("online", flushPendingScores);
flushPendingScores();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(readColors);
requestAnimationFrame(frame);
})();
