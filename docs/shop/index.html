<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー店経営 5年</title>
<style>
:root{
  --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#1a1a1a; --soft:#d9d9d9;
  --wall:#e6e6e6; --wall-dark:#c4c4c4; --shadow:rgba(0,0,0,.14); --panel:#ffffff;
  --warn:#111; --danger:#b3261e;
  --font: "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a;
    --wall:#2c2c2c; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --danger:#ff8a80;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a;
  --wall:#2c2c2c; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --danger:#ff8a80;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;color:inherit}

/* HUD */
.pause{position:fixed;top:20px;left:20px;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:14px;letter-spacing:1px}
.speed{position:fixed;top:72px;left:20px;font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px 8px;cursor:pointer}
.hud{position:fixed;top:18px;right:20px;text-align:right;line-height:1.35;pointer-events:none}
.money{font-size:40px;font-weight:300;display:flex;align-items:center;gap:10px;justify-content:flex-end;font-variant-numeric:tabular-nums}
.money.neg{color:var(--danger)}
.chip{display:inline-block;width:.62em;height:.62em;border-radius:50%;border:.17em solid currentColor;flex:none}
.money .chip{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 .12em var(--bg)}
.hud .sub{font-size:15px;color:var(--ink)}
.hud .tiny{font-size:12px;color:var(--muted)}
.heat{display:inline-flex;gap:6px;align-items:center;font-size:12px;margin-top:4px}
.heat .bar{width:90px;height:6px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.heat .bar i{display:block;height:100%;background:var(--ink);width:0}

.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:min(560px,calc(100vw - 180px))}
.toast div{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px 10px;font-size:13px;animation:fade 4s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.dockwrap{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100vw - 32px)}
.tag{border:1.5px solid var(--line);border-radius:9px;padding:1px 9px;font-size:12px;background:var(--bg);min-height:20px}
.tag:empty{visibility:hidden}
.dock{display:flex;gap:14px;border:2px solid var(--line);border-radius:18px;padding:12px 16px 8px;background:var(--bg);overflow-x:auto;max-width:100%}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;position:relative;min-width:62px}
.act .ic{width:58px;height:58px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--bg);box-shadow:3px 4px 0 var(--shadow);font-size:22px;transition:transform .08s}
.act.on .ic{background:var(--ink);color:var(--bg)}
.act:active .ic{transform:translateY(2px)}
.act .k{position:absolute;left:2px;top:40px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:10px;display:grid;place-items:center}
.act .c{font-size:12px;display:flex;gap:4px;align-items:center;white-space:nowrap}
.act .c .chip{width:9px;height:9px;border-width:2.5px}
.act[disabled]{opacity:.35;cursor:default}
.act svg{width:26px;height:26px}

/* overlay */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 86%,transparent);display:none;place-items:center;padding:16px;overflow:auto;z-index:10}
.ov.show{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:6px 8px 0 var(--shadow)}
.card h1{font-size:22px;font-weight:600;margin:0 0 4px}
.card h2{font-size:13px;font-weight:600;margin:18px 0 8px;letter-spacing:.06em}
.card p{margin:6px 0;font-size:14px;line-height:1.7}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);text-align:left;cursor:pointer;font-size:13px;line-height:1.5}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt small{color:var(--muted);display:block}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
.stepper output{font-size:28px;font-weight:300;min-width:2ch;text-align:center}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.btn{border:2px solid var(--line);border-radius:999px;padding:9px 20px;background:var(--bg);cursor:pointer;font-size:14px}
.btn.primary{background:var(--ink);color:var(--bg)}
details{border-top:1px solid var(--soft);margin-top:10px;padding-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.prov{margin:8px 0;padding:8px 10px;border-left:2px solid var(--line);font-size:12.5px;line-height:1.7}
.prov a{color:inherit}
.big{font-size:44px;font-weight:300;display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.timeline{font-size:12.5px;line-height:1.8;max-height:180px;overflow:auto;border:1px solid var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
@media (max-width:640px){
  .money{font-size:28px}.hud{top:14px;right:14px}.pause{top:14px;left:14px}.speed{top:64px;left:14px}
  .act .ic{width:48px;height:48px;font-size:18px}.act{min-width:52px}.act .k{top:32px}.dock{gap:8px;padding:10px 10px 6px}
  .toast{top:110px;max-width:calc(100vw - 32px)}
}
</style>
</head>

<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("shop-data").textContent);
const PROV = JSON.parse(document.getElementById("provisions-data").textContent);
const E = D.economy, R = D.risk, M = D.meta;
const $ = (id) => document.getElementById(id);
const byId = (arr, id) => arr.find((x) => x.id === id);
const fmt = (n) => Math.round(n).toLocaleString("ja-JP");

/* ---------- state ---------- */
let S = null;
function newState(cfg){
  return {
    cfg, loc: byId(D.locations, cfg.loc), rule: byId(D.rules, cfg.rule), lic: byId(D.licenses, cfg.lic),
    cash: M.startCash - cfg.tables * E.tablePrice - (byId(D.licenses, cfg.lic).fee),
    tables: cfg.tables, ad: 0, rep: E.reputation.start, heat: 0,
    month: 0, monthT: 0, profit: -(cfg.tables * E.tablePrice) - byId(D.licenses, cfg.lic).fee,
    waitMonths: byId(D.licenses, cfg.lic).waitMonths, suspend: 0, strikes: 0,
    last: { demand: 0, served: 0, rev: 0, cost: 0 },
    log: [], lastCashout: null, over: null, paused: false, speed: 1,
  };
}

/* ---------- rules & risk ---------- */
function violations(){
  const v = [];
  if (S.rule.violation) v.push({ kind: S.rule.violation, src: S.rule });
  if (S.lic.violation) v.push({ kind: S.lic.violation, src: S.lic });
  const tail = R.cashoutTail;
  if (S.rule.id !== "cashout" && S.lastCashout != null && S.month - S.lastCashout <= tail.months)
    v.push({ kind: "criminal", src: byId(D.rules, "cashout"), weight: tail.factor, tail: true });
  // ゲーム上：許可営業で景品を出すと23条2項の論点。無許可でも景品は論点として残す。
  return v;
}
function hazard(){
  const v = violations();
  if (!v.length) return 0;
  const ad = E.ads[S.ad];
  let base = v.reduce((s, x) => s + R.base[x.kind] * (x.weight ?? 1), 0);
  return Math.min(0.6, base * S.loc.visibility * (1 + R.adFactor * ad.level) * (1 + S.tables / R.tablesDivisor) * (1 + S.heat));
}
function heatNorm(){ const h = hazard(); return Math.min(1, h / 0.15); }

/* ---------- monthly tick ---------- */
function monthTick(){
  S.month++;
  const ad = E.ads[S.ad];
  const waiting = S.waitMonths > 0;
  const rent = S.loc.rent, staff = waiting ? 0 : S.tables * E.dealerPerTable, adCost = waiting ? 0 : ad.cost; // 許可待ちはディーラー未雇用・広告なし。営業停止中は人件費が出ていく
  let demand = 0, served = 0, rev = 0;
  const open = S.waitMonths <= 0 && S.suspend <= 0;
  if (open){
    demand = E.baseVisitors * S.loc.traffic * S.rule.demand * ad.mult * S.rep;
    const cap = S.tables * E.tableCapacity;
    served = Math.min(demand, cap);
    rev = served * (S.rule.spend - S.rule.prizeCost);
    const fill = cap ? served / cap : 0;
    const er = E.reputation;
    if (demand >= cap * 0.95) S.rep = Math.min(er.max, S.rep + er.gainWhenFull);
    else if (fill < 0.5) S.rep = Math.max(er.min, S.rep - er.lossWhenIdle);
    else S.rep = Math.min(er.max, S.rep + er.gainWhenFull / 3);
  } else {
    if (S.waitMonths > 0){ S.waitMonths--; if (S.waitMonths === 0) note("許可が下りた。開店。"); }
    if (S.suspend > 0){ S.suspend--; if (S.suspend === 0) note("営業停止が明けた。"); }
  }
  const cost = rent + staff + adCost;
  const net = rev - cost;
  S.cash += net; S.profit += net;
  S.last = { demand, served, rev, cost, net, open };
  logEv("month", { net: Math.round(net), served: Math.round(served), demand: Math.round(demand) });

  // heat
  const h = R.heat;
  if (S.rule.id === "cashout" && open) S.lastCashout = S.month;
  if (S.rule.id === "cashout" && open) S.heat = Math.min(h.max, S.heat + h.cashoutPerMonth);
  else S.heat = Math.max(0, S.heat - h.decay);

  // inspection
  if (open && Math.random() < hazard()) { inspection(); }
  if (S.over) return;
  if (S.cash < M.bankruptAt) return finish("bankrupt");
  if (S.month >= M.months) return finish("complete");
}

function inspection(){
  spawnPolice();
  const v = violations();
  if (v.some((x) => x.kind === "criminal")){ logEv("arrest", {}); return finish("arrest"); }
  S.strikes++;
  const step = R.ladder[Math.min(S.strikes, R.ladder.length) - 1];
  logEv("strike", { step: step.id });
  if (step.end){ S.cash -= step.fine; S.profit -= step.fine; return finish("closed"); }
  if (step.suspendMonths){ S.suspend = step.suspendMonths; S.heat += R.heat.afterWarning; note(`${step.name}：${step.suspendMonths}か月`); return; }
  S.heat += R.heat.afterWarning;
  S.paused = true;
  openStrike(step, v);
}

function finish(kind){
  S.over = kind; S.paused = true;
  const score = kind === "arrest" ? 0 : Math.round(S.profit);
  logEv("end", { kind, score });
  openEnd(kind, score);
}

/* ---------- log (for local RAG/analysis; never sent) ---------- */
function logEv(type, data){ S.log.push({ t: S.month, type, ...data }); }
function exportLog(){
  const meta = { type: "run", game: "poker-shop", version: M.version, cfg: S.cfg, outcome: S.over, profit: Math.round(S.profit), at: new Date().toISOString(), note: "ゲームの架空パラメータによるプレイログ。実データではない。" };
  const lines = [meta, ...S.log.map((x) => ({ type: "event", ...x }))].map((x) => JSON.stringify(x)).join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines], { type: "application/jsonl" }));
  a.download = `poker-shop-run-${Date.now()}.jsonl`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- UI: notes ---------- */
function note(text){
  const d = document.createElement("div"); d.textContent = text; $("toast").prepend(d);
  setTimeout(() => d.remove(), 4000);
  while ($("toast").children.length > 3) $("toast").lastChild.remove();
}

function provHTML(ids){
  return (ids || []).map((id) => {
    const p = PROV[id]; if (!p) return "";
    const body = p.verified && p.text ? `「${esc(p.text)}」` : `<span class="muted">逐語は未確認（正本で確認中）</span>`;
    const n = p.note ? `<br><span class="muted">${esc(p.note)}</span>` : "";
    return `<div class="prov"><b>${esc(p.name)}</b><br>${body}${n}<br><a href="${esc(p.url)}" target="_blank" rel="noopener">一次ソース</a></div>`;
  }).join("");
}
function esc(s){ return String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

/* ---------- dock ---------- */
function act(a){
  if (!S || S.over || ov.classList.contains("show")) { if (a === "rules") openRules(); return; }
  if (a === "ad"){ S.ad = (S.ad + 1) % E.ads.length; note(S.ad ? `広告 Lv${S.ad}（${E.ads[S.ad].cost}/月）` : "広告を止めた"); logEv("ad", { level: S.ad }); }
  if (a === "tableAdd"){
    if (S.tables >= E.maxTables) return note("これ以上は置けない");
    S.tables++; S.cash -= E.tablePrice; S.profit -= E.tablePrice; logEv("tables", { n: S.tables }); placeTables();
  }
  if (a === "tableSub"){
    if (S.tables <= 1) return;
    S.tables--; S.cash += E.tableResale; S.profit += E.tableResale; logEv("tables", { n: S.tables }); placeTables();
  }
  if (a === "rules") openRules();
  syncHUD();
}
$("dock").addEventListener("click", (e) => { const b = e.target.closest(".act"); if (b) act(b.dataset.a); });
addEventListener("keydown", (e) => {
  const m = { "1": "ad", "2": "tableAdd", "3": "tableSub", "4": "rules" }[e.key];
  if (m) act(m);
  if (e.key === " " && S && !S.over && !ov.classList.contains("show")) { e.preventDefault(); togglePause(); }
  if (e.key === "Escape" && ov.classList.contains("show") && S && !S.over && $("cancel")) $("cancel").click();
});
function togglePause(){ if (!S || S.over) return; S.paused = !S.paused; $("pauseBtn").textContent = S.paused ? "▶" : "II"; }
$("pauseBtn").onclick = togglePause;
$("speedBtn").onclick = () => { if (!S) return; S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 4 : 1; $("speedBtn").textContent = "×" + S.speed; };

/* ---------- scene (canvas) ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, U = 1; // U: unit length
function resize(){
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR;
  cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H) / 1000;
  placeTables();
}
addEventListener("resize", resize);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C = {};
function readColors(){ C = { ink: css("--ink"), bg: css("--bg"), wall: css("--wall"), wallD: css("--wall-dark"), sh: css("--shadow"), muted: css("--muted"), soft: css("--soft"), danger: css("--danger") }; }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);

let people = [], tables = [], pops = [], police = [];
const center = () => ({ x: W / 2, y: H * 0.47 });
const shopR = () => 150 * U * (S ? 1 + Math.min(S.tables, 12) * 0.035 : 1);
const reachR = () => Math.min(W, H) * 0.62 * (S ? E.ads[S.ad].reach : 0.55);

function resetScene(){ people = []; pops = []; police = []; placeTables(); readColors(); }
function placeTables(){
  tables = [];
  if (!S) return;
  const n = S.tables, r = shopR() * 0.58;
  for (let i = 0; i < n; i++){
    const ring = n > 6 && i >= 6 ? 1 : 0;
    const k = ring ? n - 6 : Math.min(n, 6), j = ring ? i - 6 : i;
    const a = (j / k) * Math.PI * 2 + (ring ? Math.PI / k : 0) - Math.PI / 2;
    const rr = ring ? r * 0.35 : (n === 1 ? 0 : r);
    tables.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr * 0.62, seats: 0 });
  }
}

function spawnPerson(toShop){
  const c = center(), R0 = reachR() * (1.05 + Math.random() * 0.3), a = Math.random() * Math.PI * 2;
  const p = { x: c.x + Math.cos(a) * R0, y: c.y + Math.sin(a) * R0 * 0.62, toShop, ph: Math.random() * 6, sp: (28 + Math.random() * 18) * U * 1.6, state: "walk", t: 0 };
  if (toShop){ const tb = tables[Math.floor(Math.random() * tables.length)] || { x: 0, y: 0 }; p.tx = c.x + tb.x + (Math.random() - .5) * 40 * U; p.ty = c.y + tb.y + (Math.random() - .5) * 26 * U; }
  else { const b = a + Math.PI + (Math.random() - .5); p.tx = c.x + Math.cos(b) * R0 * 1.4; p.ty = c.y + Math.sin(b) * R0 * 0.62 * 1.4; }
  people.push(p);
}
function spawnPolice(){ const c = center(); police.push({ x: c.x - reachR() * 1.1, y: c.y + reachR() * 0.3, tx: c.x - shopR() * 0.9, ty: c.y + shopR() * 0.25, t: 0, ph: 0 }); }

function figure(x, y, s, ph, moving, outline){
  // shadow
  cx.fillStyle = C.sh; cx.beginPath(); cx.ellipse(x + 6 * s, y + 2 * s, 9 * s, 3.5 * s, 0, 0, Math.PI * 2); cx.fill();
  const bob = moving ? Math.sin(ph) * 1.2 * s : 0, leg = moving ? Math.sin(ph) * 3 * s : 0;
  cx.fillStyle = outline ? C.bg : C.ink; cx.strokeStyle = C.ink; cx.lineWidth = 1.6 * s;
  // legs
  cx.beginPath(); cx.roundRect(x - 5 * s + leg * .3, y - 10 * s, 4 * s, 10 * s, 2 * s); cx.roundRect(x + 1 * s - leg * .3, y - 10 * s, 4 * s, 10 * s, 2 * s); cx.fill(); if (outline) cx.stroke();
  // body
  cx.beginPath(); cx.roundRect(x - 6.5 * s, y - 24 * s + bob, 13 * s, 16 * s, 5 * s); cx.fill(); if (outline) cx.stroke();
  // head
  cx.beginPath(); cx.arc(x, y - 30 * s + bob, 6.5 * s, 0, Math.PI * 2); cx.fill(); if (outline) cx.stroke();
  if (outline){ cx.fillStyle = C.ink; cx.fillRect(x - 7 * s, y - 37 * s + bob, 14 * s, 3.5 * s); }
}

function wallArc(c, r, a0, a1, h){
  // extruded elliptical wall (oblique view)
  const k = 0.62, steps = 40;
  cx.beginPath();
  for (let i = 0; i <= steps; i++){ const a = a0 + (a1 - a0) * i / steps; const X = c.x + Math.cos(a) * r, Y = c.y + Math.sin(a) * r * k; i ? cx.lineTo(X, Y) : cx.moveTo(X, Y); }
  for (let i = steps; i >= 0; i--){ const a = a0 + (a1 - a0) * i / steps; cx.lineTo(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r * k - h); }
  cx.closePath(); cx.fillStyle = C.wall; cx.fill(); cx.strokeStyle = C.ink; cx.lineWidth = 1.4; cx.stroke();
  cx.beginPath();
  for (let i = 0; i <= steps; i++){ const a = a0 + (a1 - a0) * i / steps; const X = c.x + Math.cos(a) * r, Y = c.y + Math.sin(a) * r * k - h; i ? cx.lineTo(X, Y) : cx.moveTo(X, Y); }
  cx.lineWidth = 2.2; cx.stroke();
}

function draw(dt){
  const c = center();
  cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);

  // road (立地) — wider/busier by traffic
  const tr = S ? S.loc.traffic : 1, ang = -0.36, len = Math.hypot(W, H);
  const ux = Math.cos(ang), uy = Math.sin(ang) * -1, nx = -uy, ny = ux;
  const rw = (14 + tr * 10) * U;
  cx.save();
  cx.beginPath(); cx.moveTo(c.x - ux * len + nx * rw, c.y + uy * len + ny * rw); cx.lineTo(c.x + ux * len + nx * rw, c.y - uy * len + ny * rw);
  cx.lineTo(c.x + ux * len + nx * (rw + 26 * U), c.y - uy * len + ny * (rw + 26 * U)); cx.lineTo(c.x - ux * len + nx * (rw + 26 * U), c.y + uy * len + ny * (rw + 26 * U)); cx.closePath();
  const g = cx.createLinearGradient(c.x + nx * rw, c.y + ny * rw, c.x + nx * (rw + 26 * U), c.y + ny * (rw + 26 * U)); g.addColorStop(0, C.wallD); g.addColorStop(1, C.bg);
  cx.fillStyle = g; cx.fill();
  cx.strokeStyle = C.ink; cx.lineWidth = 1.5;
  for (const s of [-rw, rw]){ cx.beginPath(); cx.moveTo(c.x - ux * len + nx * s, c.y + uy * len + ny * s); cx.lineTo(c.x + ux * len + nx * s, c.y - uy * len + ny * s); cx.stroke(); }
  if (S){ cx.fillStyle = C.muted; cx.font = `${12}px ${css("--font")}`; cx.save(); cx.translate(c.x - ux * W * 0.36, c.y + uy * W * 0.36 - rw - 8); cx.rotate(-Math.atan2(uy, ux)); cx.fillText(S.loc.name, 0, 0); cx.restore(); }
  cx.restore();

  // reach circle (広告の届く範囲)
  const RR = reachR();
  cx.strokeStyle = C.ink; cx.globalAlpha = .55; cx.lineWidth = 1;
  cx.beginPath(); cx.ellipse(c.x, c.y, RR, RR * 0.62 * 1.25, 0, 0, Math.PI * 2); cx.stroke();
  for (let i = 0; i < 8; i++){ const a = i / 8 * Math.PI * 2, x = c.x + Math.cos(a) * RR, y = c.y + Math.sin(a) * RR * 0.775; cx.beginPath(); cx.moveTo(x - Math.cos(a) * 6, y - Math.sin(a) * 6); cx.lineTo(x + Math.cos(a) * 6, y + Math.sin(a) * 6); cx.stroke(); }
  cx.globalAlpha = 1;
  // month marker on the reach ring (like the compass dot)
  if (S){ const a = (S.month + S.monthT) / M.months * Math.PI * 2 - Math.PI / 2, x = c.x + Math.cos(a) * RR, y = c.y + Math.sin(a) * RR * 0.775;
    cx.fillStyle = C.bg; cx.beginPath(); cx.arc(x, y, 8, 0, Math.PI * 2); cx.fill(); cx.stroke(); cx.fillStyle = C.ink; cx.beginPath(); cx.arc(x, y, 2.5, 0, Math.PI * 2); cx.fill(); }

  // shop
  const r = shopR(), h = 34 * U, k = 0.62;
  cx.fillStyle = C.sh; cx.beginPath(); cx.ellipse(c.x + 10, c.y + 10, r + 6, (r + 6) * k, 0, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = C.bg; cx.beginPath(); cx.ellipse(c.x, c.y, r, r * k, 0, 0, Math.PI * 2); cx.fill();
  // back walls (behind tables)
  const closed = S && (S.waitMonths > 0 || S.suspend > 0);
  wallArc(c, r, Math.PI * 1.05, Math.PI * 1.65, h);
  wallArc(c, r, Math.PI * 1.78, Math.PI * 2.0, h);
  // tables
  for (const t of tables){
    const x = c.x + t.x, y = c.y + t.y, tw = 46 * U, th = 24 * U;
    cx.fillStyle = C.sh; cx.beginPath(); cx.ellipse(x + 5, y + 6, tw, th, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = C.ink; cx.beginPath(); cx.ellipse(x, y + 5 * U, tw, th, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = closed ? C.wallD : C.ink; cx.strokeStyle = C.bg; cx.lineWidth = 1.2;
    cx.beginPath(); cx.ellipse(x, y, tw, th, 0, 0, Math.PI * 2); cx.fill();
    cx.beginPath(); cx.ellipse(x, y, tw * .78, th * .7, 0, 0, Math.PI * 2); cx.stroke();
  }
  // seated people drawn with others below; front walls drawn after people

  // people
  if (S && !S.paused && !S.over){
    const open = !closed;
    const visitRate = open ? (S.last.served || S.tables * E.tableCapacity * 0.3) / 110 : 0; // per second-ish
    const walkRate = 0.6 + S.loc.traffic * 1.2;
    if (Math.random() < dt * visitRate * 0.9 * S.speed) spawnPerson(true);
    if (Math.random() < dt * walkRate * S.speed) spawnPerson(false);
  }
  people.sort((a, b) => a.y - b.y);
  for (const p of people){
    if (!S.paused && !S.over){
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (p.state === "walk"){
        if (d < 3){ if (p.toShop){ p.state = "sit"; p.t = 0; pops.push({ x: p.x, y: p.y - 50 * U, t: 0, v: S.rule.spend - S.rule.prizeCost }); } else p.dead = true; }
        else { const s = p.sp * dt * S.speed; p.x += dx / d * s; p.y += dy / d * s; p.ph += dt * 10 * S.speed; }
      } else { p.t += dt * S.speed; if (p.t > 5){ p.dead = true; } }
    }
    figure(p.x, p.y, U * 1.15, p.ph, p.state === "walk", false);
  }
  people = people.filter((p) => !p.dead).slice(-160);
  // police
  for (const q of police){
    const dx = q.tx - q.x, dy = q.ty - q.y, d = Math.hypot(dx, dy);
    if (d > 3){ const s = 80 * U * (1 / 60) * 2; q.x += dx / d * s; q.y += dy / d * s; q.ph += .2; } else q.t += 1 / 60;
    figure(q.x, q.y, U * 1.25, q.ph, d > 3, true);
  }
  police = police.filter((q) => q.t < 3);

  // front walls (open entrance at bottom-left like the reference)
  wallArc(c, r, Math.PI * 0.05, Math.PI * 0.42, h);
  wallArc(c, r, Math.PI * 0.62, Math.PI * 0.95, h);

  // risk gauge: dashed arc around shop (fills with hazard)
  if (S){
    const hz = heatNorm();
    cx.save(); cx.setLineDash([4, 4]); cx.strokeStyle = C.ink; cx.lineWidth = 2;
    cx.beginPath(); cx.ellipse(c.x, c.y - h, r * 0.92, r * 0.92 * k, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, hz)); cx.stroke(); cx.restore();
    // label pill
    const cap = S.tables * E.tableCapacity, fill = cap ? Math.min(999, Math.round((S.last.served || 0) / cap * 100)) : 0;
    const label = closed ? (S.waitMonths > 0 ? "許可待ち" : "営業停止") : `${S.tables}卓 : ${fill}%`;
    cx.font = `600 ${15}px ${css("--font")}`; const tw = cx.measureText(label).width + 26;
    const ly = c.y - r * k - h - 18;
    cx.fillStyle = C.ink; cx.beginPath(); cx.roundRect(c.x - tw / 2, ly - 15, tw, 30, 9); cx.fill();
    cx.fillStyle = C.bg; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(label, c.x, ly + 1); cx.textAlign = "start"; cx.textBaseline = "alphabetic";
  }

  // pops (+売上)
  for (const p of pops){
    p.t += dt; const a = Math.max(0, 1 - p.t / 1.6); if (!a) continue;
    cx.globalAlpha = a; const txt = `+${(p.v * 10000).toLocaleString("ja-JP")}円`;
    cx.font = `${13}px ${css("--font")}`; const w = cx.measureText(txt).width + 30, y = p.y - p.t * 20;
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.roundRect(p.x - w / 2, y - 12, w, 24, 8); cx.fill(); cx.stroke();
    cx.beginPath(); cx.arc(p.x - w / 2 + 12, y, 4, 0, Math.PI * 2); cx.lineWidth = 2.5; cx.stroke();
    cx.fillStyle = C.ink; cx.fillText(txt, p.x - w / 2 + 20, y + 4.5); cx.globalAlpha = 1;
  }
  pops = pops.filter((p) => p.t < 1.6);
}

/* ---------- loop ---------- */
let lastT = performance.now(), hudT = 0;
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (S && !S.paused && !S.over){
    S.monthT += dt * S.speed / M.secondsPerMonth;
    while (S.monthT >= 1 && !S.over && !S.paused){ S.monthT -= 1; monthTick(); }
  }
  draw(dt);
  hudT += dt; if (hudT > 0.15){ hudT = 0; syncHUD(); }
  requestAnimationFrame(frame);
}

readColors(); resize(); openSetup(); requestAnimationFrame(frame);
})();
</script>
