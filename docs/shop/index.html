<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー屋をつくろう！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#1a1a1a; --soft:#dedede; --soft2:#f1f1f1;
  --wall:#ececec; --wall-dark:#c9c9c9; --shadow:rgba(0,0,0,.13); --panel:#ffffff; --gray:#8a8a8a;
  --danger:#b3261e; --good:#2e6b45;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
    --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
  --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#branchCount{position:fixed;z-index:1;transform:translate(-100%,-100%);padding:5px 10px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:700;line-height:1.25;white-space:nowrap;pointer-events:none}
/* 左上：4指標 */
.tl{position:fixed;top:16px;left:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;z-index:2}
.ind{display:grid;grid-template-columns:auto 80px 2.2em;gap:3px 8px;font-size:11.5px;align-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:6px 8px;border-radius:10px}
.ind .bar{height:6px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ind .bar i{display:block;height:100%;background:var(--gray);width:0;transition:width .3s}
.ind .v{font-family:var(--mono);text-align:right;color:var(--muted)}
.ind .short{display:none}

/* 上中央：時間 */
.time{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 600px));min-width:320px;text-align:center;z-index:2;background:color-mix(in srgb,var(--bg) 82%,transparent);border-radius:12px;padding:4px 8px 6px}
.tdate{display:flex;align-items:baseline;justify-content:center;gap:12px}
.tdate b{font-size:22px;font-weight:700}
.tdate .m{font-size:16px}
.tdate .clock{font-family:var(--mono);font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:0 6px}
.tdate .clock.closed{color:var(--muted);border-color:var(--soft)}
.tbar{display:flex;gap:1px;margin-top:6px;height:12px}
.tbar .y{display:flex;gap:1px;flex:1}
.tbar .y + .y{margin-left:5px}
.tbar i{flex:1;background:var(--soft2);border:1px solid var(--soft);border-radius:2px;position:relative;overflow:hidden}
.tbar i.past{background:var(--gray);border-color:var(--gray)}
.tbar i.now{border-color:var(--ink)}
.tbar i.now b{position:absolute;left:0;top:0;bottom:0;background:var(--gray)}
.tbar i.mark::after{content:"";position:absolute;left:50%;bottom:-1px;width:4px;height:4px;transform:translateX(-50%) rotate(45deg);background:var(--danger)}
.tlabels{position:relative;height:16px;font-size:10.5px;color:var(--muted);margin-top:2px}
.tlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tnote{font-size:12px;color:var(--muted)}

/* 右上：手元資金と事業価値 */
.hud{position:fixed;top:16px;right:max(24px,4vw);margin:0;z-index:2;text-align:right;line-height:1.45;font-size:12px}
.hud dt{color:var(--muted)}
.hud dd{margin:0;white-space:nowrap}
.money{font-size:32px;line-height:1.2}
.money small{font-size:12px}
.money.neg,.flow-legend dd.neg{color:var(--danger)}
.hud-secondary{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.hud-secondary[hidden]{display:none}

/* 月別収支：売上・経費の棒に税引前利益の折れ線を重ねる */
.flow{--plot-height:112px;position:fixed;inset:auto max(24px,4vw) 16px;margin-inline:auto;max-width:1440px;background:var(--bg);border-top:1px solid var(--soft);padding-top:8px;z-index:2}
.flow-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.flow-head h2{margin:0;font-size:18px;color:var(--ink)}
.flow-month{margin-left:auto;color:var(--ink);white-space:nowrap}
.flow-chart{--zero:.5;display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.flow-axis{position:relative;height:var(--plot-height);font-size:11px;text-align:right;color:var(--muted)}
.flow-axis span{position:absolute;right:0;transform:translateY(-50%)}
.flow-axis .top{top:0;transform:none}
.flow-axis .zero{top:calc(var(--plot-height) * var(--zero))}
.flow-axis .bottom{bottom:0;transform:none}
.flow-plot{position:relative;min-width:0;--trend-padding:5px}
.flow-trend{position:absolute;top:calc(1px - var(--trend-padding));left:0;width:100%;height:calc(var(--plot-height) + 2 * var(--trend-padding));z-index:2;pointer-events:none}
.flow-track{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-top:1px solid var(--soft)}
.flow-track::before{content:"";position:absolute;z-index:1;top:calc(var(--plot-height) * var(--zero));left:0;right:0;border-top:1px solid var(--muted);pointer-events:none}
.flow-slot{position:relative;min-width:0}
.flow-bar{display:block;position:relative;width:100%;height:var(--plot-height);padding:0;border:0;background:transparent;cursor:pointer}
.flow-bar[aria-pressed="true"]{background:var(--soft2)}
.flow-bar:focus-visible{outline:1px solid var(--ink);outline-offset:-2px}
.flow-bar span{position:absolute;left:18%;width:64%;background:var(--series)}
.flow-sales{--series:var(--good)}
.flow-varCost{--series:color-mix(in srgb,var(--ink) 26%,var(--bg))}
.flow-rent{--series:color-mix(in srgb,var(--ink) 46%,var(--bg))}
.flow-staff{--series:color-mix(in srgb,var(--ink) 68%,var(--bg))}
.flow-other{--series:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.flow-net{--series:var(--ink)}
.flow-tick{display:block;height:17px;font-size:11px;line-height:17px;color:var(--muted);white-space:nowrap}
.flow-tick span{position:absolute;left:3px}
.flow-slot:nth-child(12) .flow-tick span{left:auto;right:0}
.flow-empty{grid-column:1/-1;display:grid;place-items:center;height:calc(var(--plot-height) + 18px);margin:0;background:var(--soft2);font-size:13px;color:var(--muted)}
.flow-chart.empty .flow-axis,.flow-chart.empty .flow-plot,.flow-empty[hidden]{display:none}
.flow-legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px 8px;min-height:40px;margin:4px 0 0;padding-top:4px;border-top:1px solid var(--soft);font-size:12px}
.flow-legend dt{display:flex;align-items:center;gap:4px;color:var(--muted)}
.flow-legend dt::before{content:"";flex:none;width:8px;height:8px;background:var(--series)}
.flow-legend .flow-net dt{color:var(--ink);font-weight:700}
.flow-legend .flow-net dt::before{height:2px}
.flow-legend dd{margin:0 0 0 12px;white-space:nowrap}
.flow-legend .flow-net dd{font-weight:700}
.toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:min(520px,calc(100vw - 32px));z-index:2}
.toast div.bad{border-color:var(--danger);color:var(--danger)}
.toast div.good{border-color:var(--good);color:var(--good)}
.toast div{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px 10px;font-size:13px;animation:fade 4.5s forwards;text-align:center}
.enforcement-frame{
  --warning-red:#ff645b;position:fixed;inset:0;z-index:20;pointer-events:none;
  display:grid;place-items:center;padding:16px;
  border:clamp(8px,1.8vw,18px) solid var(--warning-red);background:rgba(15,9,9,.78);color:#fff;
}
.enforcement-frame[hidden]{display:none}
.enforcement-headline{
  display:grid;gap:12px;width:min(640px,100%);padding:clamp(20px,5vw,40px) 4px;
  border-block:1px solid var(--warning-red);text-align:center;
  animation:enforcement-appear .3s ease-out both;
}
.enforcement-headline strong{color:var(--warning-red);font-size:clamp(46px,13vw,112px);line-height:1.08;letter-spacing:.05em}
.enforcement-headline span{font-size:clamp(14px,2.6vw,20px);line-height:1.6}
.enforcement-announcement{position:absolute;inset:0 auto auto 0;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes enforcement-appear{from{opacity:.5;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enforcement-headline{animation:none}}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* 画面（モーダル） */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 86%,transparent);display:none;place-items:center;padding:16px;overflow:auto;z-index:10}
.ov.show{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;width:min(740px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:6px 8px 0 var(--shadow)}
/* 長いカードでも、先へ進むボタンは常に見えるようにする */
.card .row.stick{position:sticky;bottom:-18px;margin:12px -22px -18px;padding:10px 22px 14px;background:var(--panel);border-top:1.5px solid var(--line);z-index:2}
.card h1{font-size:23px;font-weight:700;margin:0 0 6px}
.card h2{font-size:13px;font-weight:700;margin:18px 0 8px;letter-spacing:.06em}
.card p{margin:6px 0;font-size:14px;line-height:1.75}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opt small,.opt b{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
/* 内装は配置図の横幅で3段階を比較する */
.opts[data-k="interior"]{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.opts[data-k="interior"] .opt{min-height:48px;padding:6px 2px;border:1px solid #e0e0e0;border-radius:0;text-align:center;transition:none}
.opts[data-k="interior"] .opt[aria-pressed="true"]{box-shadow:inset 0 -2px var(--ink);transform:none;border-color:var(--ink)}
.opts[data-k="interior"] .opt[aria-pressed="true"]::before{content:none}
.opts[data-k="interior"] .opt small{font-size:12px}
.opts[data-k="edu"]{grid-template-columns:1fr}
.opts[data-k="edu"] .opt{display:grid;grid-template-columns:8.5em 1fr;column-gap:14px;align-items:center;padding:10px 14px}
.opts[data-k="edu"] .opt b{margin:0;font-size:15px}
.roomPreview{margin:8px 0 0;border-bottom:1px solid var(--soft)}
.roomPreview canvas{display:block;width:100%;height:clamp(152px,46vw,310px)}
.roomPreview figcaption{padding:0 0 8px;color:var(--muted);font-size:12px;line-height:1.6}
.setup-disclosure summary{padding:4px 0}
.property-basis{display:flex;flex-wrap:wrap;gap:4px 24px;margin-top:12px;padding:8px 12px;background:var(--soft2)}
.property-basis p{margin:0}
.setup-finances{display:grid;gap:16px;margin-top:24px;min-width:0}
.setup-finance,.setup-outlook{min-width:0;padding:12px;border:1px solid var(--soft)}
.setup-finances h2{margin:0 0 8px;font-size:18px;letter-spacing:.02em}
.setup-outlook{background:var(--soft2)}
.setup-outlook dl{margin:0;font-size:13px}
.setup-outlook dl div{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;padding:8px 0;border-top:1px solid var(--soft)}
.setup-outlook dd{margin:0;white-space:nowrap}
@media (max-width:520px){.opts[data-k="edu"] .opt{grid-template-columns:1fr}}
.opt{position:relative;border:1.5px solid var(--soft);border-radius:12px;padding:10px 12px;background:var(--bg);text-align:left;cursor:pointer;font-size:13px;line-height:1.55;transition:box-shadow .1s,transform .1s}
.opt:hover{border-color:var(--line)}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt small{color:var(--muted);display:block}
.opt[aria-pressed="true"]{border:2.5px solid var(--ink);box-shadow:4px 5px 0 var(--ink);transform:translate(-2px,-2px)}
.opt[aria-pressed="true"]::before{content:"✓";position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.stylelist{display:flex;flex-direction:column;gap:8px}
.style-rules{margin:8px 0 16px;padding-inline-start:1.25em;font-size:13px;line-height:1.65;color:var(--muted)}
.style-rules > li + li{margin-top:4px}
.style-rules ul{margin:4px 0;padding-inline-start:1.25em}
.stylelist .opt{display:grid;grid-template-columns:1fr auto 14px;gap:12px;align-items:center;padding-right:0;overflow:visible}
.stylelist .stripe{align-self:stretch;margin:-10px 0 -10px 0;border-radius:0 10px 10px 0}
:is(.stripe,.tsw,.route).black{--style-color:#111}
:is(.stripe,.tsw,.route).gray{--style-color:#9a9a9a}
:is(.stripe,.tsw,.route).clean{--style-color:var(--good)}
.stripe,.tsw{background:var(--style-color)}
.tsw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:6px 2px 0;flex-wrap:wrap}
.okc{color:var(--good);font-weight:700}
.riskcol{font-size:11.5px;text-align:right;font-family:var(--mono);white-space:nowrap}
.arrow{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin:4px 2px 0}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
.stepper output{font-size:28px;min-width:2ch;text-align:center;font-family:var(--mono)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);border-radius:999px;padding:9px 20px;background:var(--bg);cursor:pointer;font-size:14px}
.btn.primary{border-width:3px;font-weight:700;box-shadow:3px 4px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
table.t td,table.t th{border-bottom:1px solid var(--soft);padding:5px 6px;text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td:not(:first-child){font-family:var(--mono)}
table.t tr.total td{font-weight:700;border-top:1.5px solid var(--line)}
details{border-top:1px solid var(--soft);margin-top:10px;padding-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.prov{margin:8px 0;padding:8px 10px;border-left:2px solid var(--line);font-size:12.5px;line-height:1.7}
.prov a{color:inherit}
.big{font-size:42px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono)}
.big small{font-size:15px;font-family:var(--font)}
.timeline{font-size:12.5px;line-height:1.8;max-height:200px;overflow:auto;border:1px solid var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.slider{display:grid;grid-template-columns:4.5em 1fr 4.5em;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.slider input{width:100%;accent-color:var(--gray)}
.slider.price{grid-template-columns:4.2em 1fr 4.2em;line-height:1.25;font-size:12px}
.fineBox{border:3px solid var(--danger);border-radius:14px;padding:12px 14px;margin:12px 0 4px;background:color-mix(in srgb,var(--danger) 7%,transparent)}
.fineAmt{font-family:var(--mono);font-size:clamp(30px,5vw,44px);font-weight:700;color:var(--danger);line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media (max-width:720px){.grid3{grid-template-columns:1fr}}
.rec{display:inline-block;background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:700;padding:0 6px;border-radius:4px;vertical-align:1px}
.pcbox{border:1.5px solid var(--soft);border-radius:12px;padding:8px 10px 6px;margin:6px 0 4px}
.pchart{width:100%;height:auto;display:block;overflow:visible}
.pchart .pc-t{font-size:12px;fill:var(--ink);font-weight:700}.pchart .pc-a{font-size:10.5px;fill:var(--muted)}
.pchart .pc-g{stroke:var(--soft);stroke-width:1}.pchart .pc-z{stroke:var(--muted);stroke-width:1}
.pchart .pc-r{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}.pchart .pc-c{stroke:var(--ink);stroke-width:1}
.pchart .pc-l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.pchart .pc-d{fill:var(--ink);stroke:var(--panel);stroke-width:2}
.pc-x{display:grid;grid-template-columns:1fr auto 1fr;font-size:11px;color:var(--muted);padding-left:54px}.pc-x span:last-child{text-align:right}
.pc-read{font-size:12.5px;margin:4px 0 2px;font-family:var(--mono)}
.pticks{display:grid;grid-template-columns:1fr auto 1fr;font-size:11px;color:var(--muted);margin:-2px 4.6em 4px}.pticks span:nth-child(2){color:var(--ink);font-weight:700}.pticks span:last-child{text-align:right}
/* 営業時間ゲージ（1本・つまみ2つ） */
.gauge{position:relative;height:46px;margin:26px 4px 26px;user-select:none;touch-action:none}
.gauge .track{position:absolute;left:0;right:0;top:14px;height:18px;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ink)}
.gauge .range{position:absolute;top:14px;height:18px;border:2.5px solid var(--ink);border-radius:9px;background:color-mix(in srgb,var(--ink) 8%,transparent);pointer-events:none}
.gauge .legal{position:absolute;top:6px;height:34px;border-left:2px dashed var(--danger)}
.gauge .legal span{position:absolute;top:44px;left:-2px;transform:translateX(-50%);font-size:10px;color:var(--danger);white-space:nowrap}
.gauge .h{position:absolute;top:8px;width:22px;height:30px;margin-left:-11px;border:2px solid var(--line);border-radius:7px;background:var(--bg);cursor:grab;box-shadow:2px 3px 0 var(--shadow);display:grid;place-items:center;font-size:9px}
.gauge .h:focus{outline:2px solid var(--ink);outline-offset:2px}
.gauge .tick{position:absolute;top:36px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-family:var(--mono)}
.gauge .lbl{position:absolute;top:-18px;font-size:11px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-weight:500}
.warn{color:var(--danger);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.grid2 span:nth-child(even){text-align:right;font-family:var(--mono)}
.rank{font-size:12.5px;line-height:1.7;margin:0;padding-left:1.4em}
.rank li{font-family:var(--mono)}
.score-report{margin-top:24px;padding-top:8px;border-top:1px solid var(--soft)}
.score-report h2,.score-rank h2{font-size:18px;letter-spacing:.02em}
.score-total{display:flex;gap:16px;align-items:baseline}
.score-total strong{font-size:36px}
.score-total span{font-size:15px}
.score-breakdown{margin:8px 0 16px}
.score-breakdown div{display:flex;gap:16px;justify-content:space-between;border-top:1px solid var(--soft);padding:8px 0;font-size:15px}
.score-breakdown dd{margin:0;white-space:nowrap}
.score-rank{margin-bottom:24px}
.score-rank h3{font-size:15px;margin:12px 0 4px}
.score-rank li{overflow-wrap:anywhere}
.score-rank li span{font-family:var(--font)}
.score-rank summary{min-height:32px}
.rank-current{font-weight:700}
.rank-submit{display:flex;align-items:flex-end;flex-wrap:wrap;gap:8px 16px;margin:16px 0 8px}
.rank-submit label{display:grid;gap:4px;font-size:12px}
.rank-submit input,.rank-submit button{min-height:48px;padding:8px 16px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.rank-submit button{border-radius:0;cursor:pointer}
.rank-submit button:disabled{opacity:.4;cursor:default}
.card.titlecard{width:min(900px,100%);padding:28px clamp(16px,4vw,30px) 22px}
/* タイトル画面 */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:center}
.heroIntro{container-type:inline-size}
.hero .ttl{font-size:clamp(20px,3.6vw,38px);font-size:clamp(20px,8.5cqi,38px);line-height:1.35;margin:8px 0 12px;white-space:nowrap}
.hero .hook{font-size:15px;line-height:1.8}
.hero canvas{width:100%;height:280px;display:block}
.heroCap{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-top:4px}
.heroCap .n{font-family:var(--mono);font-size:22px;font-weight:700}
.routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.route{display:flex;min-width:0;flex-direction:column;gap:4px;text-align:left;
  background:#fff;color:#111;
  border:3px solid var(--style-color);padding:6px 14px}
.title-rank-link:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.route .who{margin:0;font-size:18px;font-weight:700;line-height:1.45;letter-spacing:normal}
.route .ds{margin:0;font-size:14px}
.title-flow{margin-top:32px}
.annual-news{margin:16px 0;padding:12px 16px;background:var(--soft2);border-top:2px solid var(--line)}
.annual-news h2{margin:4px 0;font-size:17px;letter-spacing:0}
.annual-news p{margin:0}
.title-flow h2{font-size:18px;margin:0 0 12px;letter-spacing:.02em}
.title-flow ol{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:0;padding:0;list-style-position:inside}
.title-flow li{padding:8px 0;border-top:1px solid var(--soft);font-size:14px;line-height:1.6}
.title-flow li::marker{font-weight:700;color:var(--muted)}
.title-flow li span{display:block;color:var(--muted);font-size:13px}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:16px;margin-top:24px;padding-top:16px;border-top:1px solid var(--soft)}
.feat{font-size:13px;line-height:1.6;color:var(--muted)}.feat b{display:block;color:var(--ink);font-size:14px}
.title-rank-link{padding:0;border:0;background:none;color:var(--ink);text-align:left;font:inherit;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:.24em;cursor:pointer}
@media (max-width:720px){
  .hero,.routes,.title-flow ol{grid-template-columns:1fr}
  .hero{gap:12px}
  .hero canvas{height:170px}
  .title-flow ol{gap:0}
  .title-flow li span{padding-left:1.3em}
  .feats{grid-template-columns:1fr 1fr}
  .title-rank-link{grid-column:1/-1;justify-self:start}
}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{border:1.5px solid var(--soft);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:22px;margin:2px 0}
.tile .s{font-size:12px;color:var(--muted);line-height:1.5}
.traps{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.traps li{font-size:13px;line-height:1.6;padding-left:22px;position:relative}
.traps li::before{content:"!";position:absolute;left:0;top:1px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--danger);color:var(--danger);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.best{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1.5px solid var(--line);margin-top:18px;padding:12px 0 6px;flex-wrap:wrap;position:sticky;bottom:-22px;background:var(--panel)}
.best .amt{font-family:var(--mono);font-size:28px}
.start{font-size:17px;padding:12px 34px}
@media (max-width:720px){.tiles{grid-template-columns:1fr}}
.steps{display:flex;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.steps span.on{color:var(--ink);font-weight:700}
@media (max-width:900px), (max-height:560px){
  /* 進行と月別収支を店の上下に表示する */
  html,body{height:auto;overflow-x:hidden;overflow-y:auto}
  body{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"time time" "tl hud" "cv cv" "flow flow";align-content:start;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .tl{position:static;grid-area:tl;margin:10px 0 0 10px}
  .hud{position:static;grid-area:hud;justify-self:end;margin:10px 24px 0 0}
  #cv{position:static;grid-area:cv;width:100vw;height:clamp(250px,72vw,440px)} #branchCount{position:relative;grid-area:cv;align-self:start;justify-self:start}
  .time{position:static;grid-area:time;transform:none;width:auto;min-width:0;margin:8px 12px 0}
  .flow{position:static;grid-area:flow;margin:8px 24px 0;min-width:0}
  /* 通知は店の絵の枠に重ねる */
  .toast{position:relative;grid-area:cv;align-self:start;justify-self:center;top:auto;left:auto;transform:none;margin-top:40px;max-width:calc(100vw - 24px);gap:4px}
  .toast div{font-size:12px;padding:2px 8px}
  .money{font-size:24px}
  .ind{grid-template-columns:repeat(4,auto auto);gap:2px 4px;font-size:11px;padding:4px 6px}.ind .bar{display:none}.ind .full{display:none}.ind .short{display:inline}.ind .v{color:var(--ink)}
  .tdate b{font-size:18px}
}
@media (max-width:540px){
  .flow-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>

<canvas id="cv"></canvas>
<span id="branchCount" hidden>×2店舗</span>
<div class="tl">
  <div class="ind" id="ind"></div>
</div>

<div class="time" id="timeBox">
  <div class="tdate"><b id="tYear">開業前</b><span class="m" id="tMonth"></span><span class="clock" id="tClock">--:--</span></div>
  <div class="tbar" id="tbar"></div>
  <div class="tlabels" id="tlabels"></div>
  <div class="tnote" id="tNote"></div>
</div>

<dl class="hud">
  <div><dt>手元資金</dt><dd class="money" id="money"><span class="num" id="moneyV">—</span> <small>万円</small></dd></div>
  <div class="hud-secondary"><dt>事業価値</dt><dd class="num" id="valueV">—</dd></div>
  <div class="hud-secondary" id="debt" hidden><dt>借入残高</dt><dd class="num" id="debtV"></dd></div>
</dl>

<section class="flow" id="flow" aria-labelledby="flowTitle">

  <div class="flow-chart empty" id="flowChart">
    <div class="flow-axis num" aria-hidden="true"><span class="top" id="flowTop"></span><span class="zero">0</span><span class="bottom" id="flowBottom"></span></div>
    <div class="flow-plot">
      <div class="flow-track" id="flowTrack" role="group" aria-label="直近12か月の収支。月を選んで内訳を表示"></div>
      <canvas class="flow-trend" id="flowTrend" aria-hidden="true"></canvas>
    </div>
    <p class="flow-empty" id="flowEmpty">1か月経過すると表示されます</p>
  </div>
  <dl class="flow-legend" id="flowLegend"></dl>
</section>
<div class="toast" id="toast"></div>
<div class="enforcement-frame" id="enforcementFrame" aria-hidden="true" hidden>
  <div class="enforcement-headline">
    <strong id="enforcementTitle"></strong>
    <span id="enforcementMessage"></span>
  </div>
</div>
<div class="enforcement-announcement" id="enforcementAnnouncement" role="alert"></div>

const shellValue = () => S.deposit + S.fitout * L.fitoutResidual + S.tablesValue * L.tableResidual + (S.branch ? S.branch.deposit + S.branch.fitout * L.fitoutResidual + S.branch.tablesValue * L.tableResidual : 0);

/* ---------- 月次 ---------- */
function monthTick(){
  const wasOpen = isOpen();
  let orderActs = null;
  if (wasOpen && S.openedAt == null){ S.openedAt = S.month; story(S.licensed ? "許可が下り、開業した。" : "許可を待たずに開業した。"); }
  const rentBeforeOpening = wasOpen ? 0 : monthlyRent();
  const p = wasOpen ? project() : { demand: 0, occ: 0, guests: 0, rev: 0, op: -rentBeforeOpening, interest: 0, net: -rentBeforeOpening, rent: rentBeforeOpening, varCost: 0, other: 0, staff: 0 };
  expansionTick(wasOpen);
  S.cash += p.net; S.last = p; S.year.net = (S.year.net || 0) + p.net;
  if (wasOpen && riskSources().some((a) => a.tier === "black")) S.blackNet = (S.blackNet || 0) + p.net; // 追徴の対象（黒の営業中の利益）
  if (wasOpen){ S.ops.push(p.op); S.year.rev += p.rev; S.year.op += p.op; S.peakMonth = Math.max(S.peakMonth, p.net); }
  logEv("month", { net: Math.round(p.net), guests: Math.round(p.guests), occ: +p.occ.toFixed(3), style: styleNow().id });

  if (wasOpen){
    const rk = risks();
    for (const a of rk.active){ S.used[a.id] = (S.used[a.id] || 0) + 1; S.lastUsed[a.id] = S.month; S.riskMonths.push({ t: S.month, id: a.id, tier: a.tier }); }
    if (hr("arrest") < rk.arrest){
      S.arrestCause = rk.active.some((a) => a.tier === "black") ? "black" : "gray";
      logEv("arrest", {});
      story("摘発された。");
      S.month++;
      rec(p, wasOpen);
      return pauseForEnforcement({ kind: "arrest" });
    }
    // 予兆：摘発の確率が高い月は、赤いアラートで先に知らせる（6か月に1回まで）
    if (rk.arrest >= R.heatWarn && S.month - (S.heatWarnAt ?? -99) >= 6){ S.heatWarnAt = S.month; story("店の前に、見慣れない車が何日も停まっている。"); note(`捜査の気配。今月の摘発率 ${pct(rk.arrest)}`, "bad"); }
    if (rk.active.length && hr("order") < rk.order) orderActs = rk.active;
  }
  const i = S.ind;
  if (wasOpen){
    i.fame = clamp(i.fame + O.ads[S.ad].fame + FX().fameGain * 0.5 + (p.occ > 0.8 ? 0.5 : 0), 0, 100);
    // 採用方式（経験者＋10／未経験−5、教育で育つ）を毎月の余力の戻り先に入れる
    const ssx = staffStats(), fill = ssx.need ? ssx.count / ssx.need : 1;
    const slackTarget = 85 + clamp((fill - 1) * 60, -30, 15) + (ssx.skill - 3) * 5 + (ssx.manager ? 5 : 0) + FX().slackTarget + EDU().slackTarget - 70 * Math.max(0, p.occ - 0.5) / 0.4 - Math.max(0, hoursLen() - 10) * 3;
    i.slack = clamp(i.slack + (slackTarget - i.slack) * 0.2, 0, 100);
    i.comfort = clamp(i.comfort + ((50 + (i.slack - 50) * 0.4 + S.policy.comfortTarget + FX().comfortTarget + EDU().comfortTarget + (staffStats().host - 3) * 4 - S.mix.tourney * 10) - i.comfort) * 0.1, 0, 100);
    i.trust = clamp(i.trust + ((50 + S.policy.trustTarget + FX().trustTarget + EDU().trustTarget) - i.trust) * 0.04, 0, 100);
    updateMix();
    staffMonthly();
  }
  S.tempDemand = S.tempDemand.filter((t) => --t.months > 0);
  if (S.rumor > 0) S.rumor--;
  if (S.shock > 0) S.shock--;
  if (S.licenseWait > 0){ S.licenseWait--; if (S.licenseWait === 0){ S.licensed = true; S.unlicensed = false; note("許可が下りた。", "good"); logEv("licensed", {}); } }

  if (S.month === MK.shakeStart && wasOpen){ note("業界の淘汰が始まった。弱い店が撤退し、残った店に客が集まる", "good"); story("5年目に入り、業界の淘汰が始まった。"); }
  const trP = S.loc.troubleP * S.hiring.trouble * EDU().trouble * (i.slack < 30 ? 1.5 : 1);
  if (wasOpen && hr("trouble") < trP){
    if (hr("trouble", 1) < 0.5){ const c = (O.trouble.costMin + hr("trouble", 2) * (O.trouble.costMax - O.trouble.costMin)) * (1 + S.tables / 10); S.cash -= c; taxAdj(-c); const t = D.troubleTexts[Math.floor(hr("trouble", 3) * D.troubleTexts.length)]; note(`${t}（${yen(-c)}）`, "bad"); story(`${t}。${yen(c)}かかった。`); logEv("trouble", { cost: Math.round(c) }); }
    else { S.shock = O.trouble.shockMonths; const t = D.shockTexts[Math.floor(hr("trouble", 3) * D.shockTexts.length)]; note(`${t}（${O.trouble.shockMonths}か月 来店需要−${pct(O.trouble.shock, 0)}）`, "bad"); story(`${t}。`); logEv("shock", {}); }
  }
  S.month++;
  const orderNotice = orderActs ? order(orderActs) : null;
  if (S.month % 12 === 0) payTax(`${S.month / 12}年目`);
  if (TEST && window.__onMonth) window.__onMonth(S); // 検証用：月末のフック（scripts/sim_annual.js）
  if (wasOpen) judgeChoke(p);
  rec(p, wasOpen);
  explainMonth();
  if (orderNotice) return pauseForEnforcement(orderNotice);
  finishMonth();
}
function finishMonth(){
  if (S.cash < M.bankruptAt){ story("資金が尽きた。"); return finish("bankrupt"); }
  if (S.month >= M.months) return completeSale();
  if (S.month % 12 === 0){
    S.annualReport = { rev: S.year.rev, op: S.year.op, recorded: false };
    return annual();
  }
  if (S.month === R.ddStart){ note("買収前調査が始まった。"); story("買収前調査が始まった。5年目の終わりに売却する。"); }
  saveGame();
}
/* 月ごとの記録（進行・結果画面用）。extra＝営業損益以外の出入り（トラブル・増卓・借入・是正対応費など） */
function rec(p, wasOpen){
  const other = wasOpen ? p.other : 0;
  S.recs.push({ t: S.month - 1, open: wasOpen, guests: p.guests || 0, occ: p.occ || 0, rev: p.rev || 0, rent: p.rent || S.rent, staff: wasOpen ? p.staff : 0, other,
    days: O.days, spend: p.spend, lostRevenue: wasOpen ? p.lostSeat * O.days * p.spend : 0,
    branchRev: p.branchRev || 0, fcRoy: p.fcRoy || 0, varCost: p.varCost || 0,

/* 客層の動き：初心者は居心地しだいで常連に育ち、常連は居心地・信頼が低いと離れる。大会客はコンセプトと知名度で決まる */
function normMix(){ const t = S.mix.regular + S.mix.newbie + S.mix.tourney; for (const k of ["regular", "newbie", "tourney"]) S.mix[k] /= t; }
function updateMix(){
  const i = S.ind, m = S.mix;
  const conv = SEG.baseConvert * FX().convert * (1 + (staffStats().teach - 3) * 0.15) * (i.comfort / 50) * m.newbie;
  const churn = SEG.baseChurn * (1 + Math.max(0, 50 - i.comfort) / 50 + Math.max(0, 50 - i.trust) / 50) * m.regular;
  m.regular += conv - churn; m.newbie += churn - conv;
  const tt = FX().tourney + (i.fame - 30) / 100 * SEG.tourneyFameBonus;
  m.tourney += (tt - m.tourney) * SEG.tourneyAdjust;
  for (const k of ["regular", "newbie", "tourney"]) m[k] = Math.max(0.02, m[k]);
  normMix();
}

function order(acts){
  S.orders++;

  const trustBefore = S.ind.trust;
  S.cash -= cost; taxAdj(-cost); S.ind.trust = clamp(S.ind.trust + R.orderTrust, 0, 100); S.rumor = R.orderRumorMonths;
  for (const a of acts){

  const subjects = acts.map((a) => a.short);
  logEv("order", { acts: acts.map((a) => a.id), cost: Math.round(cost) });
  story(`${R.labels.order}を受けた（${subjects.join("・")}）。${R.labels.orderCost} ${yen(cost)}。`);

/* ---------- バリュエーション：DCF・類似取引比較・清算価値 → 中央値（清算価値が下限） ---------- */
const CP = D.comps, LQ = D.liquidation;
const pctile = (arr, q) => { const a = [...arr].sort((x, y) => x - y), i = (a.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return a[lo] + (a[hi] - a[lo]) * (i - lo); };

function valuation(dd){
  const dep = deposits(), months = S.openedAt == null ? 0 : S.month - S.openedAt;
  // DCF と感応度
  const d = dcfParts(), sens = [];
  for (const dr of [-V.sensR, 0, V.sensR]){ const row = []; for (const dg of [-V.sensG, 0, V.sensG]) row.push(dcfParts(d.r + dr, clamp(d.g + dg, -0.1, 0.2)).ev + dep); sens.push(row); }
  const flat = sens.flat(), dcf = { point: d.ev + dep, lo: Math.min(...flat), hi: Math.max(...flat), d, sens };
  // 類似取引比較
  const L12 = ltm(), seats = (S.tables + (S.branch ? S.branch.tables : 0)) * 9 + (S.fc ? S.fc.count * 18 : 0);
  const m = { ebitda: CP.deals.map((x) => x.ev / x.ebitda), sales: CP.deals.map((x) => x.ev / x.sales), seat: CP.deals.map((x) => x.ev / (x.tables * 9)) };
  const A = CP.adjust, mgr = d.mgr;
  const adj = clamp(1 + (S.ind.trust - 50) / A.trust + (S.mix.regular - 0.4) * A.regular + (mgr ? 0 : A.noManager), A.min, A.max);
  const distress = L12.ebitda <= 0 ? A.distress : 1;
  const implied = (q) => {
    const v = [];
    if (L12.ebitda > 0) v.push(pctile(m.ebitda, q) * L12.ebitda);
    if (L12.sales > 0) v.push(pctile(m.sales, q) * L12.sales * distress);
    v.push(pctile(m.seat, q) * seats * distress * (L12.months >= 6 ? 1 : 0.5));
    return Math.max(0, pctile(v, 0.5) * adj) + dep;
  };
  const comps = { point: implied(0.5), lo: implied(0.25), hi: implied(0.75), adj, distress, L12, seats, mult: { ebitda: pctile(m.ebitda, 0.5), sales: pctile(m.sales, 0.5), seat: pctile(m.seat, 0.5) } };
  // 清算価値（帳簿の純資産と、急いで売る清算価値）
  const fitBook = (S.fitout + (S.branch ? S.branch.fitout : 0)) * Math.max(0, 1 - months / LQ.fitoutLifeMonths);
  const tabBook = (S.tablesValue + (S.branch ? S.branch.tablesValue : 0)) * Math.max(0, 1 - months / LQ.tableLifeMonths);
  const area = S.area + (S.branch ? (S.branch.tables * L.tsuboPerTable + L.commonTsubo) : 0), restore = area * LQ.restorePerTsubo;

  else if (dd && dd.kind === "cut"){ use = { dcf: dcf.point * dd.cut, comps: comps.point * dd.cut }; note = `グレーの営業（${dd.name}）が見つかり、DCFと類似取引比較を${Math.round(dd.cut * 100)}%に減額した。`; }
  const median = use ? pctile([use.dcf, use.comps, liq.point], 0.5) : liq.point;
  const adopted = Math.max(median, liq.point);

function annual(){

    <section class="annual-news" aria-labelledby="annualNewsTitle">

    ${S.branch ? `<p class="muted">2号店 ・ ${esc(S.branch.loc.name)} ・ ${S.branch.tables}卓 ${S.branch.openedAt == null ? `（開業まであと${S.branch.wait}か月）` : "（営業中）"}</p>` : ""}
    <div class="row stick"><button class="btn" id="sellBtn">事業を売却する</button><button class="btn primary" id="okBtn">${y + 1}年目へ</button></div>`, () => {

}
/* 決算での早期売却。買収前調査はこれまでの営業履歴を評価額に反映する。 */
function sellConfirm(onCancel){
  const dd = ddCheck(), v = valuation(dd), amount = S.cash + v.adopted - S.debt;
  show(`<div class="kicker">${S.month / 12}年目の決算</div><h1>いま店を売る？</h1>
    <p>売却を確定すると、ゲームはここで終了し、手取り額がスコアになる。</p>
    <table class="t"><tr><td>手元資金</td><td>${yen(S.cash)}</td></tr><tr><td>売却額（評価額）</td><td>${yen(v.adopted)}</td></tr>${S.debt ? `<tr><td>借入の返済</td><td>${yen(-S.debt)}</td></tr>` : ""}<tr class="total"><td>手取り額</td><td>${yen(amount)}</td></tr></table>
    ${dd.kind === "shell" ? `<p>${dd.gray ? `グレーの営業歴（${esc(dd.name)}）` : "黒の営業歴"}があるため、ハコの価値で売却し、「売り抜け成功」で終了する。</p>` : ""}
    <div class="row stick"><button class="btn" id="backBtn">決算に戻る</button><button class="btn primary" id="doSell">売却を確定する</button></div>`);
  $("backBtn").onclick = onCancel;
  $("doSell").onclick = () => { logEv("sellEarly", { month: S.month }); completeSale(); };
}
function ddCheck(){
  if (S.riskMonths.some(({ tier }) => tier === "black")) return { kind: "shell" };
  const gray = S.riskMonths.find(({ tier }) => tier === "gray");
  return gray ? { kind: "shell", gray: true, name: byId(STYLES, gray.id)?.name || "グレーの営業" } : { kind: "none" };
}
function completeSale(){
  if (S.over) return;
  const dd = ddCheck();
  const v = valuation(dd), sale = v.adopted;
  logEv("proposal", { dd: dd.kind, sale: Math.round(sale), dcf: Math.round(v.dcf.point), comps: Math.round(v.comps.point), liq: Math.round(v.liq.point) });
  S.sale = sale; S.dd = dd; S.val = v; S.soldAt = S.month;
  story(dd.kind === "shell" ? "ハコの価値で売却が成立し、売り抜けた。" : "店の売却が成立した。");
  finish("complete");
}

/* ---------- 摘発の罰則（v1.4.2）：罰金・追徴と拘禁刑（旧・懲役）。値は shop.json の penalty、根拠は条文の正本 ---------- */
const PN = D.penalty;
function penaltyOf(){
  // v1.8.1（ユーザー指定で元の式に戻す）：黒の営業中に得た利益の一定割合を追徴、無許可営業・グレーは罰金、黒は拘禁刑
  const blackMonths = S.riskMonths.filter((x) => x.tier === "black").length, unl = S.riskMonths.some((x) => x.id === "unlicensed");
  const out = { fine: 0, forfeit: 0, prisonMonths: 0, items: [], provisionIds: [] };
  if (S.arrestCause !== "gray" && blackMonths){
    const b = PN.black;
    out.prisonMonths = clamp(Math.round(b.prisonBaseMonths + b.prisonPerBlackYearMonths * blackMonths / 12), b.prisonMinMonths, b.prisonMaxMonths);
    out.forfeit = Math.max(0, (S.blackNet || 0) * b.forfeitRate);
    out.items.push([`追徴金（黒の営業で得た利益の${Math.round(b.forfeitRate * 100)}%）`, out.forfeit]);
    out.provisionIds.push(...b.provisionIds);
  }
  if (unl){ out.fine += PN.unlicensed.fine; out.items.push(["罰金（無許可営業）", PN.unlicensed.fine]); out.provisionIds.push(...PN.unlicensed.provisionIds); }
  if (S.arrestCause === "gray"){ out.fine += PN.gray.fine; out.items.push(["罰金（グレーの営業）", PN.gray.fine]); out.missing = PN.gray.missingSource; }
  out.total = out.fine + out.forfeit;
  return out;
}
const prisonText = (m) => m >= 12 ? `${Math.floor(m / 12)}年${m % 12 ? `${m % 12}か月` : ""}` : `${m}か月`;

/* ---------- 税金（法人の税、v1.4）----------
   税率は docs/questions.json の条文（e-Gov 法令APIから取得）にもとづく標準税率。shop.json の tax に値と条文IDを置く。
   課税所得＝その事業年度の月々の利益（営業利益−利息）＋臨時の損益（トラブル・是正対応費・採用・許可申請・FC加盟金）。
   設備・卓・内装などの投資は損金に入れない（減価償却は省略）。欠損金は翌年以降に繰り越して控除する */
const TX = D.tax;
function taxAdj(x){ if (S && S.year) S.year.adj = (S.year.adj || 0) + x; }
function corpTax(income, staffN){
  const b = { income, carried: 0, taxable: 0, hojin: 0, chihohojin: 0, boei: 0, juminWari: 0, kintou: TX.perCapitaPref + (staffN > TX.perCapitaMuniStaff ? TX.perCapitaMuniOver : TX.perCapitaMuni), jigyo: 0, tokubetsu: 0 };
  if (income <= 0){ S.taxLoss = (S.taxLoss || 0) - income; }
  else { b.carried = Math.min(S.taxLoss || 0, income); S.taxLoss = (S.taxLoss || 0) - b.carried; b.taxable = income - b.carried; }
  const T = b.taxable, br = (lo, hi) => Math.max(0, Math.min(T, hi) - lo);
  b.hojin = TX.corpSmallRate * br(0, TX.corpSmallLimit) + TX.corpRate * br(TX.corpSmallLimit, Infinity);
  b.chihohojin = b.hojin * TX.localCorpRate;
  b.boei = Math.max(0, b.hojin - TX.defenseDeduction) * TX.defenseRate;
  b.juminWari = b.hojin * (TX.residentPrefRate + TX.residentMuniRate);
  b.jigyo = TX.enterprise.reduce((a, [lo, hi, r]) => a + br(lo, hi == null ? Infinity : hi) * r, 0);
  b.tokubetsu = b.jigyo * TX.specialEnterpriseRate;
  b.total = b.hojin + b.chihohojin + b.boei + b.juminWari + b.kintou + b.jigyo + b.tokubetsu;
  return b;
}
function payTax(label){
  const y = S.year || {}, income = (y.net || 0) + (y.adj || 0), b = corpTax(income, S.staffList ? S.staffList.length : 0);
  S.cash -= b.total; S.taxPaid = (S.taxPaid || 0) + b.total; S.lastTax = b;
  y.net = 0; y.adj = 0;
  story(`${label}の税金（法人税など）${yen(b.total)}を納めた（課税所得 ${yen(b.taxable)}${b.carried ? `・繰越欠損金 ${yen(b.carried)}を控除` : ""}）。`);
  logEv("tax", { income: Math.round(income), taxable: Math.round(b.taxable), total: Math.round(b.total) });
  return b;
}
function taxHTML(b){
  const r = (n, v) => v ? `<tr><td style="text-align:left">${n}</td><td>${yen(v)}</td></tr>` : "";
  return `<table class="t"><tr><td style="text-align:left">その年の所得</td><td>${yen(b.income)}</td></tr>${b.carried ? `<tr><td style="text-align:left">繰越欠損金の控除</td><td>${yen(-b.carried)}</td></tr>` : ""}<tr><td style="text-align:left">課税所得</td><td>${yen(b.taxable)}</td></tr>
    ${r("法人税", b.hojin)}${r("地方法人税", b.chihohojin)}${r("防衛特別法人税", b.boei)}${r("法人住民税（法人税割）", b.juminWari)}${r("法人住民税（均等割）", b.kintou)}${r("事業税", b.jigyo)}${r("特別法人事業税", b.tokubetsu)}
    <tr class="total"><td style="text-align:left">税金の合計</td><td>${yen(b.total)}</td></tr></table>
    <details><summary>税率と条文</summary><p class="muted" style="font-size:12px">${esc(TX.note)}</p>${provHTML(TX.provisionIds)}</details>`;
}

/* ---------- 終了 ---------- */
function evaluationGrade(score){
  return score >= 90 ? "S" : score >= 80 ? "A" : score >= 65 ? "B" : score >= 50 ? "C" : "D";
}
function evaluateShop(kind, amount, indicators){
  if (kind !== "complete") return null;
  const cash = Math.round(50 * clamp(amount / (2 * M.fund), 0, 1));
  const comfort = Math.round(clamp(indicators.comfort, 0, 100) / 4);
  const trust = Math.round(clamp(indicators.trust, 0, 100) / 4);
  return { cash, comfort, trust, score: cash + comfort + trust };
}
function evaluationRulesHTML(){
  return `<details><summary>経営評価の採点基準</summary>
    <p>売却時の手取り額は50点満点。元手と同額で25点、元手の2倍以上で50点。初心者の居心地と店への信頼は、ゲーム終了時の各指標（100点満点）をそれぞれ25点に換算する。</p>
    <p>Sは90点以上、Aは80点以上、Bは65点以上、Cは50点以上、Dは49点以下。売却した店が対象で、同点の場合は手取り額が多い順に並ぶ。</p></details>`;
}
function evaluationHTML(evaluation, rank, kind){
  if (!evaluation) return `<section class="score-report"><h2>経営評価</h2><p>${kind === "arrest" ? "摘発により営業終了" : "資金不足により営業終了"}。経営評価ランキングの対象は売却した店。</p></section>`;
  const pos = rank.evaluation.findIndex((x) => x.mine) + 1;
  return `<section class="score-report"><h2>経営評価</h2>
    <div class="score-total"><strong class="num">${evaluationGrade(evaluation.score)}</strong><span class="num">${evaluation.score} / 100点</span></div>
    <p>経営評価ランキング（この端末） ${pos ? `${pos}位` : "上位10件の圏外"}</p>
    <dl class="score-breakdown">
      <div><dt>最終手取り額</dt><dd class="num">${evaluation.cash} / 50点</dd></div>
      <div><dt>初心者の居心地</dt><dd class="num">${evaluation.comfort} / 25点</dd></div>
      <div><dt>${esc(IND.names.trust)}</dt><dd class="num">${evaluation.trust} / 25点</dd></div>
    </dl>${evaluationRulesHTML()}</section>`;
}
function finish(kind){
  S.over = kind; S.paused = true; clearSave();
  if (kind === "arrest" && ((S.year.net || 0) + (S.year.adj || 0)) !== 0) payTax("摘発までの期間");
  const sale = kind === "complete" ? S.sale : 0;
  // 摘発：店は失い、罰金・追徴を払うが、残りの手元資金は残る（借入は返す）。倒産は0
  const pen = kind === "arrest" ? penaltyOf() : null; S.penalty = pen;
  const amount = kind === "complete" ? S.cash + sale - S.debt : kind === "arrest" ? Math.max(0, S.cash - S.debt - pen.total) : 0;
  S.finalAmount = amount;
  logEv("end", { kind, amount: Math.round(amount), sale: Math.round(sale), peak: Math.round(S.peakMonth) });
  const evaluation = evaluateShop(kind, amount, S.ind);
  const rank = saveRank(kind, amount, evaluation);
  const title = { complete: S.dd?.kind === "shell" ? "売り抜け成功" : "結果発表", arrest: R.labels.arrest, bankrupt: "資金が尽きた" }[kind];
  const ddWord = S.dd && S.dd.kind === "shell" ? "（ハコの価値）" : S.dd && S.dd.kind === "cut" ? "（グレーで減額）" : "（3つの評価の中央値）";
  const lead = { complete: S.dd?.kind === "shell" ? `${S.soldAt / 12}年で経営を終え、${S.dd.gray ? "グレー" : "黒"}の営業歴がある店をハコの価値で売却した。` : S.soldAt && S.soldAt < M.months ? `${S.soldAt / 12}年で店を売却した。` : "5年の経営を終え、店を売却した。", arrest: "営業中に摘発され、閉店した。手元資金から罰金・追徴や借入残高を差し引いた額が残る。", bankrupt: `${monthLabel(Math.max(0, S.month - 1))}に資金が尽きた。` }[kind];
  show(`
    <div class="kicker">${esc(S.loc.name)} ・ ${S.tables}卓${S.branch ? ` ・ 2号店 ${esc(S.branch.loc.name)}` : ""}${S.fc && S.fc.count ? ` ・ FC${S.fc.count}店` : ""} ・ ${esc(S.style.name)} ・ ${S.month}か月</div><h1>${esc(title)}</h1><p>${esc(lead)}</p>
    ${kind === "arrest" ? `<div class="fineBox"><div class="kicker">罰金・追徴</div><div class="fineAmt">${yen(-pen.total)}</div>
      <p style="margin:2px 0 8px;font-size:13.5px">${pen.items.map(([n, v]) => `${n} <b>${yen(v)}</b>`).join("、")}。${pen.prisonMonths ? `<br><span class="muted" style="font-size:12.5px">ほかに 拘禁刑（旧・懲役）${prisonText(pen.prisonMonths)}（ゲーム上の扱い）</span>` : ""}</p>
      <table class="t"><tr><td style="text-align:left">摘発時の手元資金</td><td>${yen(S.cash)}</td></tr>${S.debt ? `<tr><td style="text-align:left">借入の返済</td><td>${yen(-S.debt)}</td></tr>` : ""}${pen.items.map(([n, v]) => `<tr><td style="text-align:left">${n}</td><td>${yen(-v)}</td></tr>`).join("")}<tr class="total"><td style="text-align:left">残った手元資金</td><td>${yen(amount)}</td></tr></table>
      <details><summary>罰金・追徴と刑の根拠</summary><p class="muted" style="font-size:12px">${esc(PN.note)}</p>${provHTML([...new Set(pen.provisionIds)])}</details></div>` : ""}
    <div class="kicker" style="margin-top:12px">${kind === "arrest" ? "残った手元資金" : "最終手取り額"}</div>
    <div class="big">${yen(amount)}<small class="${amount - M.fund >= 0 ? "pos" : "negc"}">元手${yen(M.fund)}から ${yen(amount - M.fund, true)}</small></div>
    ${evaluationHTML(evaluation, rank, kind)}
    ${kind === "complete" ? `<table class="t"><tr><td>手元資金</td><td>${yen(S.cash)}</td></tr><tr><td>売却額${ddWord}</td><td>${yen(sale)}</td></tr>

/* ---------- 詰まりの判定：集客不足／席不足／人手不足／定着不足 ---------- */
function judgeChoke(p){
  const c = [];
  if (p.lostSeat > p.demand * 0.1) c.push("seat");
  if (p.svc < 0.95) c.push("staff");
  const age = S.openedAt == null ? 0 : S.month - S.openedAt;
  if (p.occ < 0.45 && age >= 6) c.push("demand");
  S.regHist = (S.regHist || []).concat(S.mix.regular).slice(-7);
  if (S.mix.newbie > 0.4 && S.regHist.length >= 7 && S.mix.regular <= S.regHist[0] + 0.01) c.push("retain");
  S.choke = c;
  for (const k of c) S.chokeCount[k] = (S.chokeCount[k] || 0) + 1;
  S.lostGuests = (S.lostGuests || 0) + (p.lostSeat || 0) * O.days;
}
/* ---------- 結果：設計の振り返り（設計 → 起きたこと → 結果） ---------- */
function isRamping(month, tables){
  return S.openedAt != null && month >= S.openedAt && openingDemandFactor(S.loc, tables, month - S.openedAt) < 1;
}
function causalChains(kind){
  const open = S.recs.filter((r) => r.open), out = [], cc = S.chokeCount || {};
  const avgOcc = open.length ? open.reduce((a, r) => a + r.occ, 0) / open.length : 0;
  if (kind === "bankrupt" && isRamping(S.month - 1, S.tables))
    out.push([`初期投資 ${yen(S.invest)}（開業時の手元資金 ${yen(S.startCash)}）`, `客が育つ前の${S.month - S.openedAt}か月で赤字が続いた`, "資金が尽きた"]);
  if ((cc.seat || 0) >= 6){
    const lostRevenue = open.every((r) => Number.isFinite(r.lostRevenue)) ? open.reduce((a, r) => a + r.lostRevenue, 0) : null;
    const impact = lostRevenue == null ? "席不足で売上の機会を逃した" : `席不足で逃した売上機会 約${yen(lostRevenue)}（各月の来店見送り数 × 客単価）`;
    out.push([`${S.cfg.tables}卓でスタート`, `${cc.seat}か月、席が足りなかった（逃した客 のべ約${Math.round(S.lostGuests).toLocaleString("ja-JP")}人）`, impact]);
  }
  if ((cc.demand || 0) >= 6) out.push([`${S.cfg.tables}卓・${S.loc.name}（坪${S.loc.tsuboRent}万円）`, `${cc.demand}か月、席が余った（平均満席率${Math.round(avgOcc * 100)}%）`, "空いた卓の家賃と人件費が重くなった"]);
  if ((cc.staff || 0) >= 6) out.push([`採用「${S.hiring.name}」・営業${hoursLen()}時間`, `${cc.staff}か月、人手が足りず客をさばけなかった`, "売上の取りこぼしと、トラブルの増加"]);
  if ((cc.retain || 0) >= 6) out.push([`初心者が多い客層（常連${Math.round(S.mixStart.regular * 100)}%で開業）`, `${cc.retain}か月、初心者が常連に育たなかった`, "客数が安定せず、店の値段の成長率も伸びなかった"]);
  const dReg = S.mix.regular - S.mixStart.regular;
  if (dReg > 0.2) out.push([S.fac.includes("lesson") ? "初心者講習スペース・居心地を重視" : "居心地を重視した運営", `常連が${Math.round(S.mixStart.regular * 100)}% → ${Math.round(S.mix.regular * 100)}%に育った`, "客数が安定し、店の値段の成長率が上がった"]);
  if (S.price < 0.95 && (cc.staff || 0) >= 3) out.push([`料金を全国基準より安く（${Math.round(S.price * 100)}%）`, "客は増えたが、スタッフが疲れた", "単価の低さに、接客の負担が見合わなかった"]);
  if (S.style.tier !== "clean") out.push([`営業スタイル「${S.style.name}」`, S.orders ? `${R.labels.order}を${S.orders}回受けた` : "一時的に売上は上がった", S.dd && S.dd.kind !== "none" ? "売るときの調査で見つかり、値段が下がった" : "リスクを抱えたまま営業した"]);
  return out.slice(0, 4);
}
function causalHTML(kind){
  const c = causalChains(kind);
  if (!c.length) return `<p class="muted">大きな因果は見つからなかった。</p>`;
  return `<div style="display:grid;gap:8px">${c.map(([a, b, r]) => `<div style="border:1.5px solid var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6"><span class="muted">設計</span> ${esc(a)}<br><span class="muted">→ 起きたこと</span> ${esc(b)}<br><span class="muted">→ 結果</span> <b>${esc(r)}</b></div>`).join("")}</div><p class="muted" style="font-size:12px">正解は示さない。次の店で、どこを変えて試すか。</p>`;
}
/* ---------- 店のタイプ診断（名前は架空） ---------- */
function shopType(){
  const f = (id) => S.fac.includes(id), m = S.mix, tier = S.style.tier, tb = S.tables;
  const sc = {
    thrill: (tier === "black" ? 4 : tier === "gray" ? 2.5 : 0) + (f("vip") ? 1.5 : 0) + (S.price > 1.15 ? 0.5 : 0) + S.orders * 0.5,
    lounge: (f("bar") ? 2 : 0) + (S.open >= 17 ? 1 : 0) + (S.close >= 24 ? 0.5 : 0) + m.regular,
    arena: m.tourney * 4 + (f("stream") ? 1 : 0) + (f("tournament") ? 1 : 0) + (S.ind.trust > 60 ? 0.5 : 0),
    first: (f("lesson") ? 2 : 0) + Math.max(0, m.regular - S.mixStart.regular) * 4 + (S.ind.comfort > 60 ? 0.5 : 0),
    hall: (tb >= 8 ? 2.5 : tb >= 7 ? 1 : 0) + (S.price < 0.95 ? 1 : 0),
    town: 1.2 + (tb <= 5 ? 1 : 0),
  };
  const id = Object.entries(sc).sort((a, b) => b[1] - a[1])[0][0];

}

/* 物件と競合による最終需要倍率を固定し、「預入のみ」で卓数を比較する簡易試算 */
function planFor(tables){
  const loc = S.loc, interior = S.interior || "simple", b = build(loc, tables, interior), fee = S.cfg.unlicensed ? 0 : D.license.fee;
  let cash = M.fund - b.invest - fee, minCash = cash, ops = [];
  const style = byId(STYLES, "deposit"), fx = FX(S.fac, interior), edu = EDU(S.edu || "10");
  const seats = tables * SEATS_PER_TABLE - fx.seatsLoss, turns = turnsFor(S.open, S.close, S.policy);
  const share = S.recs.length ? S.recs.at(-1).share : S.share;
  const demand = regionalDemand(loc, tables, S.price, style, fx, edu, D.mixStart.regular, S.open, S.close) * share;
  const staff = estimatedWages(loc, tables, hoursLen(), S.hiring);
  const fixed = b.rent + staff + O.otherFixed + utilityOf(tables, S.open, S.close) + edu.cost + fx.opsCost;
  const grossPerGuest = customerSpend(style, S.price) * (1 - O.variableRate - fx.varRate);
  const wait = S.cfg.unlicensed ? 0 : D.license.waitMonths;
  for (let t = 0; t < M.months; t++){
    if (t < wait){ cash -= b.rent; minCash = Math.min(minCash, cash); continue; }
    const { guests } = serviceCapacity(demand * openingDemandFactor(loc, tables, t - wait), seats, turns, loc.occCap);
    const op = guests * O.days * grossPerGuest - fixed;
    cash += op; ops.push(op); minCash = Math.min(minCash, cash);
  }
  const fcf = ops.slice(-12).reduce((a, x) => a + x, 0) / 12 - O.maintenancePerTable * tables;
  let f = fcf * 12, pv = 0; for (let y = 1; y <= V.years; y++){ f *= 1 + V.growthBase; pv += f / Math.pow(1 + V.discountBase, y); }
  const ev = Math.max(0, pv + f * (1 + V.terminalGrowth) / (V.discountBase - V.terminalGrowth) / Math.pow(1 + V.discountBase, V.years));
  return { tables, invest: b.invest + fee, minCash, final: minCash < 0 ? 0 : cash + Math.max(ev + b.deposit, b.deposit + b.fitout * L.fitoutResidual) };
}
function diagnoseHTML(kind){

  const fx = FX(), seats = S.tables * SEATS_PER_TABLE - fx.seatsLoss, turns = turnsFor(S.open, S.close, S.policy);

  if (S.invest > 2500 || S.startCash < 2000)
    items.push([4, "初期投資が大きく、手元資金が薄かった", `初期投資 ${yen(S.invest)}、開業時の手元資金 ${yen(S.startCash)}。立ち上がりの赤字とトラブルに備えて、手元に2,000万円以上残すのが目安（初期投資は1,500〜2,000万円が目安）。`]);
  if (best && mine && best.tables !== mine.tables && best.final > mine.final * 1.05)
    items.push([4, `この物件なら${best.tables}卓が良かった（試算）`, `この物件の最終需要倍率を固定して${M.months}か月を回すと、${mine.tables}卓は${mine.final > 0 ? "手取り " + yen(mine.final) : "途中で資金が尽きる"}、${best.tables}卓（初期投資 ${yen(best.invest)}）は手取り ${yen(best.final)}。預入のみで、事件・借入・税金・多店舗展開を省いた簡易試算。`]);

/* ---------- 営業中の「判断→結果」：先月と比べて、何が利益を動かしたか ---------- */
function explainMonth(){
  const open = S.recs.filter((r) => r.open); if (open.length < 2) return;
  const a = open.at(-2), b = open.at(-1);
  const hasBreakdown = [a, b].every((r) => Number.isFinite(r.spend) && Number.isFinite(r.days));
  const dNet = b.net - a.net;
  if (Math.abs(dNet) < Math.max(30, Math.abs(a.net) * 0.25)) return;
  const visitsA = a.guests * a.days, visitsB = b.guests * b.days;
  const grossProfit = (r) => r.net + r.rent + r.staff + r.other + r.interest;
  const revenueParts = hasBreakdown ? [
    ["本店の客数", (visitsB - visitsA) * a.spend],
    ["本店の客単価", visitsB * (b.spend - a.spend)],
    ["2号店売上", b.branchRev - a.branchRev], ["FCロイヤリティ", b.fcRoy - a.fcRoy],
    ["原価・決済", -(b.varCost - a.varCost)],
  ] : [["粗利", grossProfit(b) - grossProfit(a)]];
  const [top] = [...revenueParts, ["人件費", a.staff - b.staff], ["家賃", a.rent - b.rent],
    ["その他費用", a.other - b.other], ["借入利息", a.interest - b.interest],
  ].filter((x) => Math.abs(x[1]) >= 3).sort((x, y) => Math.abs(y[1]) - Math.abs(x[1]));
  if (!top) return;
  const causes = [], mo = b.t;
  for (const e of S.log.filter((x) => x.t === mo || x.t === mo - 1)){
    if (e.type === "settings") causes.push("設定の変更");
    if (e.type === "tables") causes.push(`卓数${e.n}`);
    if (e.type === "ad") causes.push(e.level ? `広告Lv${e.level}` : "広告停止");
    if (e.type === "edu") causes.push("教育");
    if (e.type === "shock") causes.push("客足が落ちる出来事");
    if (e.type === "order") causes.push(R.labels.order);
  }
  if (b.share < a.share - 0.001) causes.push("競合の出店");
  if (isRamping(b.t, b.tables ?? S.tables)) causes.push("立ち上がり中（客が増えていく時期）");
  if (S.rumor > 0) causes.push("風評");
  note(`先月より${dNet >= 0 ? "+" : "−"}${Math.round(Math.abs(dNet))}万円。主に${top[0]}${top[1] >= 0 ? "が効いた" : "が響いた"}${causes.length ? `（${causes[0]}）` : ""}`, dNet >= 0 ? "good" : "bad");
}

const SS = D.staffSystem;
function makeStaff(hiringId, locObj){
  const h = SS.hiring[hiringId] || SS.hiring.exp, lo = h.skill[0], hi = h.skill[1];
  const r = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const skill = r(lo, hi), teach = r(Math.max(1, lo - 1), hi), host = r(Math.max(1, lo - 1), hi);
  const base = locObj.staffPerTable / SS.perTable;
  return { id: Math.floor(rand() * 1e9).toString(36), name: SS.names[Math.floor(rand() * SS.names.length)], skill, teach, host,
    wage: Math.round(base * h.wage * (0.95 + 0.025 * (skill + host - 6)) * 10) / 10, morale: 60, months: 0, manager: false, growth: h.growth };
}
function staffNeed(){ return S.tables * SS.perTable * hoursLen() / O.baseHours; }
function staffStats(){
  const st = S.staffList || [], n = st.length || 1, avg = (k) => st.reduce((a, x) => a + x[k], 0) / n;

function loadRank(){
  try {
    const r = JSON.parse(localStorage.getItem(RANK_KEY)) || {};
    const final = [...(r.final || []), ...(r.money || []).filter((x) => x.record)]
      .map(({ record, ...x }) => ({ ...x, arrest: x.arrest || record }));
    return { final, peak: r.peak || [], evaluation: r.evaluation || [] };
  } catch { return { final: [], peak: [], evaluation: [] }; }
}
function saveRank(kind, amount, evaluation){
  const r = loadRank();
  if (kind !== "bankrupt"){
    const base = { loc: S.loc.name, tables: S.tables, tier: S.style.tier, arrest: kind === "arrest", date: new Date().toISOString().slice(0, 10) };
    r.final.push({ ...base, amount: Math.round(amount), mine: true });
    if (isFinite(S.peakMonth)) r.peak.push({ ...base, amount: Math.round(S.peakMonth), mine: true });
    if (evaluation) r.evaluation.push({ ...base, amount: Math.round(amount), evaluation: evaluation.score, mine: true });
  }
  for (const k of ["final", "peak"]) r[k].sort((a, b) => b.amount - a.amount);
  r.evaluation.sort((a, b) => b.evaluation - a.evaluation || b.amount - a.amount);
  const out = Object.fromEntries(Object.entries(r).map(([key, entries]) => [key, entries.slice(0, 10)]));

    try { localStorage.setItem(RANK_KEY, JSON.stringify(Object.fromEntries(Object.entries(out).map(([k, v]) => [k, v.map(({ mine, ...x }) => x)])))); } catch {}
  }
  return out;
}

/* ---------- 料金と満席率の見える化（v1.3） ----------
   全国基準から料金を動かしたときの満席率と月の差し引きを表示する。
   料金による客数の変化は、営業中と同じ priceDemandMultiplier を使う。 */
const PRICE_STEPS = (() => { const a = []; for (let x = Math.round(O.price.min * 100); x <= Math.round(O.price.max * 100); x += 5) a.push(x / 100); return a; })();
function buildEst(loc, price, cfg = CFG){
  const { tables, open, close, interior } = cfg;
  const b = build(loc, tables, interior);
  const hiring = byId(ST.hiring, cfg.hiring), policy = byId(ST.policy, cfg.policy);
  const style = byId(STYLES, cfg.style), fx = FX(cfg.fac, interior), edu = EDU(cfg.edu);
  const seats = tables * SEATS_PER_TABLE - fx.seatsLoss, turns = turnsFor(open, close, policy);
  const staff = estimatedWages(loc, tables, close - open, hiring);
  const utility = utilityOf(tables, open, close);
  const fixed = b.rent + staff + O.otherFixed + fx.opsCost + utility + edu.cost;
  const spend = customerSpend(style, price), vr = O.variableRate + fx.varRate;
  const demand = regionalDemand(loc, tables, price, style, fx, edu, D.mixStart.regular, open, close);
  const { occ, guests } = serviceCapacity(demand, seats, turns, loc.occCap);
  const rev100 = seats * turns * O.days * spend, rev = guests * O.days * spend;
  return { p: price, demand, occ, guests, rev, net: rev * (1 - vr) - fixed, capped: occ >= loc.occCap - 1e-9, rev100, spend, vr, b, seats, turns, staff, utility, edu, fixed };
}

const addTableCost = () => S.tables < S.capacity ? L.tablePrice : lateTableCost();
const lateTableCost = () => L.tablePrice + L.tsuboPerTable * S.loc.fitoutPerTsubo * L.lateTableMarkup + L.tsuboPerTable * S.loc.tsuboRent * L.depositMonths;
function changeTables(delta){
  if (!S.annualReport) return;
  const next = S.tables + delta;
  if (next < L.minTables || next > L.maxTables) return;
  if (delta > 0){
    const cost = addTableCost();
    if (S.tables >= S.capacity){
      S.capacity++;
      S.area += L.tsuboPerTable;
      S.rent += L.tsuboPerTable * S.loc.tsuboRent;
      S.deposit += L.tsuboPerTable * S.loc.tsuboRent * L.depositMonths;
      S.fitout += L.tsuboPerTable * S.loc.fitoutPerTsubo * L.lateTableMarkup;
    }
    S.cash -= cost;
    S.tablesValue += L.tablePrice;
    story(`1卓増やした（${yen(cost)}）。`);
  } else {
    const back = L.tablePrice * L.tableResidual;
    S.cash += back;
    S.tablesValue -= L.tablePrice;
    story(`1卓減らした（売却額 ${yen(back)}）。`);
  }
  S.tables = next;
  resizeStaff();
  logEv("tables", { n: S.tables });
  layoutRoom();
  saveGame();
  annual();
}

function fundingTier(){
  const recent = (S.riskMonths || []).filter(({ t }) => t >= S.month - 12 && t < S.month);
  if (S.style.tier === "black" || isLate(S.open, S.close) || (!S.licensed && S.unlicensed) || recent.some(({ tier }) => tier === "black")) return "black";
  if (S.style.tier === "gray" || recent.some(({ tier }) => tier === "gray")) return "gray";
  return "clean";
}
function canBorrow(){
  const funding = D.annualNews.funding;
  if (!S?.annualReport || S.over) return { ok: false, why: "決算で相談できます", limit: 0 };
  if (S.cash >= funding.cashBelow) return { ok: false, why: `手元資金が${yen(funding.cashBelow)}以上あります`, limit: 0 };
  if (S.rescueLoanTaken) return { ok: false, why: "この店ではすでに融資を利用しました", limit: 0 };
  const tier = fundingTier(), limit = funding.byTier[tier];
  return { ok: limit > 0, why: limit ? "" : "融資判定が黒のため借りられません", limit, tier };
}

function dayHour(){ const f = (S ? S.monthT : 0) % 1; return S ? (S.open - 1) + f * (S.close - S.open + 2) : 10; }
function shopLit(){ if (!S || !isOpen()) return false; const h = dayHour(); return h >= S.open && h < S.close; }
function syncTime(){
  if (!S){ $("tYear").textContent = "開業前"; $("tMonth").textContent = ""; $("tClock").textContent = "--:--"; $("tNote").textContent = ""; return; }
  const atMonthEnd = S.annualReport || S.enforcement;
  const t = Math.min(atMonthEnd ? S.month - 1 : S.month, M.months - 1);
  $("tYear").textContent = `${Math.floor(t / 12) + 1}年目`;
  $("tMonth").textContent = `${(t % 12) + 1}か月目`;
  const lit = shopLit();
  $("tClock").textContent = S.enforcement ? "停止中" : clockStr(dayHour()); $("tClock").className = "clock" + (lit ? "" : " closed");
  const activeMonth = S.enforcement ? t : S.month;
  document.querySelectorAll("#tbar i").forEach((c) => {
    const ct = +c.dataset.t;
    c.classList.toggle("past", ct < activeMonth); c.classList.toggle("now", ct === activeMonth);
    c.querySelector("b").style.width = ct === activeMonth ? (S.enforcement ? "100%" : `${Math.round((S.monthT % 1) * 100)}%`) : "0";
  });
  let status;
  if (S.over) status = "経営終了";
  else if (S.enforcement) status = S.enforcement.kind === "arrest" ? R.labels.arrest : R.labels.order;
  else if (S.annualReport) status = "決算・次の方針を選択";
  else if (!isOpen()) status = `開業まであと${S.licenseWait}か月`;
  else if (S.month >= R.ddStart) status = `買収前調査中 ・ 売却まであと${M.months - S.month}か月`;

}

function depthReceptionG(g, iso, o, v, interior, finishedLuxury){
  const { x0, y0, x1, y1, returnX, returnY } = o;
  const top = v.tw * 0.36, body = top - v.tw * 0.05;
  const luxury = interior === "lux";
  const foot = finishedLuxury ? v.tw * 0.061 : 0;
  const panelZ = (fraction) => foot + (body - foot) * fraction;
  if (finishedLuxury){
    const feet = [[returnX + 0.10, y1 - 0.10], [x1 - 0.10, y1 - 0.10], [x1 - 0.10, y0 + 0.11], [x0 + 0.10, y0 + 0.11], [x1 - 0.10, y0 + (y1 - y0) * 0.52]];
    for (const [x, y] of feet){
      boxG(g, iso, x - 0.029, y - 0.029, x + 0.029, y + 0.029, 0, foot, C.wallD);
      boxG(g, iso, x - 0.041, y - 0.041, x + 0.041, y + 0.041, foot * 0.73, foot, C.gray);

  wallG(g, iso, terminalX, terminalY - 0.19, terminalX, terminalY + 0.19, top + v.tw * 0.075, top + v.tw * 0.22, C.wallD);
  planeG(g, iso, x0 + 0.12, y1 - 1.12, x1 - 0.11, y1 - 0.77, top, C.soft2, C.gray, 0.75);

function receptionG(g, iso, o, v, interior, finishedLuxury){

  planeG(g, iso, x0 + 0.17, y0 + 0.14, x0 + 0.56, y1 - 0.13, h, C.soft2, C.gray, 0.75);

    s.tx = clamp(target.x, 0.35, lay.w - 0.35);
    s.ty = clamp(target.y, 0.35, lay.d - 0.35);
    if (reception && s.ty >= reception.y0 - 0.2 && s.ty <= Math.max(reception.y1, reception.returnY ?? reception.y1) + 0.2) s.tx = Math.max(s.tx, reception.x1 + 0.2);
  }
  // 人手不足：座っている客が待たされている（…）
  if (S.choke && S.choke.includes("staff") && Math.random() < dt * 1.5 * sp){ const sit = people.filter((p) => p.sit); if (sit.length){ const q = sit[Math.floor(Math.random() * sit.length)]; bubbles.push({ x: q.x, y: q.y, z: 40, t: 0, text: "…" }); } }
  // 口論（信頼・居心地が低いと卓で「!」）
  const tension = shopLit() ? Math.max(0, 45 - Math.min(S.ind.trust, S.ind.comfort)) / 45 : 0;
  if (Math.random() < dt * tension * 0.8 * sp){ const t = lay.tables[Math.floor(Math.random() * lay.tables.length)]; bubbles.push({ x: t[0], y: t[1], z: 40, t: 0 }); }
}
function draw(dt){
  cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
  updateEnforcementScene(dt);
  const warning = raidScene?.warningRemaining > 0;
  const running = S && !S.paused && !S.over, sp = S ? S.speed : 1, lit = !!raidScene || shopLit();
  if (running && isOpen()) updatePeople(dt, sp);
  else if (S && !isOpen()) { people = []; staffBots = []; }
  if (!warning){
    if (elevT > 0){ elevT -= dt; elev = Math.min(1, elev + dt * 4); } else elev = Math.max(0, elev - dt * 3);
  }
  const lay = ROOM;
  const queue = S && !raidScene && lit && S.choke && S.choke.includes("seat") ? Math.min(8, Math.max(2, Math.round((S.last.lostSeat || 0) / 3))) : 0;
  const iso = drawShopG(cx, VIEW, { lay, tier: S ? styleNow().tier : "clean", lit: S ? lit : true, people: raidScene?.guests ?? people, staff: S && isOpen() ? staffBots : [], police: warning ? null : raidScene?.officers, elev, queue });
  // 状態ピル
  if (S && !warning){
    const seats = S.tables * 9, seated = people.filter((p) => p.sit).length;
    const label = raidScene
      ? (raidScene.arrest ? "機動隊が店内に踏み込んだ" : "警察官5人が命令書を持って立ち入り")
      : !isOpen() ? `許可待ち あと${S.licenseWait}か月` : !lit ? `営業時間外（${hhLong(S.open)}から）` : `${lay.tsubo}坪 ・ ${S.tables}卓 ・ ${seated}/${seats}席`;
    const labelColor = raidScene ? C.danger : C.ink;
    const p = PHONE.matches ? [W / 2, 20] : [VIEW.ox + (lay.w - lay.d) * VIEW.tw / 4, VIEW.oy - VIEW.wall - 20]; cx.font = `700 14px ${C.font}`; const tw = cx.measureText(label).width + 26;
    cx.fillStyle = C.bg; cx.strokeStyle = labelColor; cx.lineWidth = 2; cx.beginPath(); cx.roundRect(p[0] - tw / 2, p[1] - 15, tw, 30, 9); cx.fill(); cx.stroke();
    cx.fillStyle = labelColor; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(label, p[0], p[1] + 1); cx.textAlign = "start"; cx.textBaseline = "alphabetic";
  }
  for (const b of bubbles){
    b.t += dt; const a = Math.max(0, 1 - b.t / 1.5); cx.globalAlpha = a; const q = iso(b.x, b.y, b.z + b.t * 10);
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(q[0], q[1], 10, 0, Math.PI * 2); cx.fill(); cx.stroke();
    cx.fillStyle = C.ink; cx.font = `700 13px ${C.font}`; cx.textAlign = "center"; cx.fillText(b.text || "!", q[0], q[1] + 5); cx.textAlign = "start"; cx.globalAlpha = 1;
  }
  bubbles = bubbles.filter((b) => b.t < 1.5);
  for (const p of pops){
    p.t += dt; const a = Math.max(0, 1 - p.t / 1.4); if (!a) continue;
    cx.globalAlpha = a; const txt = `+${p.v.toLocaleString("ja-JP")}円`, q = iso(p.x, p.y, 44 + p.t * 18);
    cx.font = `500 12px ${C.mono}`; const w = cx.measureText(txt).width + 14;
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.roundRect(q[0] - w / 2, q[1] - 11, w, 22, 7); cx.fill(); cx.stroke();
    cx.fillStyle = C.ink; cx.fillText(txt, q[0] - w / 2 + 7, q[1] + 4); cx.globalAlpha = 1;
  }
  pops = pops.filter((p) => p.t < 1.4).slice(-30);
}
/* 店舗イメージ図（開業前の確認用）。卓数ごとのレイアウトをそのまま描く */
function drawPreview(canvas, n, seed0, caption = true, fill = 0.62, tier, it){
  const dpr = Math.min(2, devicePixelRatio || 1), w = canvas.clientWidth || 640, h = canvas.clientHeight || 300;
  canvas.width = w * dpr; canvas.height = h * dpr; const g = canvas.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = C.bg; g.fillRect(0, 0, w, h);
  const lay = layoutFor(n, it), v = makeView(lay, w, h, caption ? 28 : 8, 8);
  let seed = seed0 != null ? seed0 : n * 97; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
  const ppl = [], stf = [];
  if (fill > 0){
    lay.tables.forEach((t) => { stf.push({ ...dealerPos(t), sit: true }); for (let k = 0; k < 9; k++) if (rnd() < fill){ const s = seatPos(t, k); ppl.push({ ...s, sit: true, kind: rnd() < 0.25 ? "newbie" : "guest" }); } });
    if (lay.bar) stf.push({ x: lay.bar.serving.x0 - 0.36, y: lay.bar.serving.y0 + 0.1 });
  }
  drawShopG(g, v, { lay, tier: tier || (byId(STYLES, CFG.style) || STYLES[0]).tier, lit: true, people: ppl, staff: stf, elev: 0.6 });
  if (caption){ g.fillStyle = C.muted; g.font = `500 12px ${C.font}`; { const ly = layoutFor(n, it); g.fillText(`${n}卓（${n * 9}席）・ ${ly.tsubo}坪 ${ly.m2}㎡ ・ 内装「${IV(ly.interior).name}」`, 8, 18); } }
}

/* ---------- ループ ---------- */
let lastT = performance.now(), hudT = 0;
const SPM = TEST ? 0.02 : M.secondsPerMonth;
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (S && !S.paused && !S.over){
    S.monthT += dt * S.speed / SPM;
    while (S.monthT >= 1 && !S.over && !S.paused){ S.monthT -= 1; monthTick(); }
  }
  draw(dt);
  hudT += dt; if (hudT > 0.1){ hudT = 0; syncHUD(); }
  requestAnimationFrame(frame);
}
window.__dbg = () => ({ n: people.length, states: people.reduce((a, p) => (a[p.state] = (a[p.state] || 0) + 1, a), {}), sample: people.slice(0, 3).map((p) => [p.x.toFixed(2), p.y.toFixed(2), p.tx && p.tx.toFixed(2), p.ty && p.ty.toFixed(2), p.state]), lit: shopLit(), want: targetSeated() });
if (TEST) window.__shop = { state: () => S, cfg: CFG, project: () => project(),
  // 検証用：その時点での売却額と、営業スタイルの切り替え
  sellNow: () => { const dd = ddCheck(), v = valuation(dd); return { month: S.month, dd: dd.kind, sale: v.adopted, dcf: v.dcf.point, comps: v.comps.point, liq: v.liq.point, cash: S.cash, debt: S.debt, amount: S.cash + v.adopted - S.debt }; },
  setStyle: (id) => { S.style = byId(STYLES, id); }, preview: (c, n) => drawPreview(c, n), previewIt: (c, n, it) => drawPreview(c, n, undefined, true, 0.62, "clean", it), start: (cfg) => startGame({ ...CFG, ...cfg }) };
readColors(); buildTimeBar(); resize(); syncHUD(); openTitle();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(readColors);
requestAnimationFrame(frame);
})();
</script>
