<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー店経営 5年</title>
<style>
:root{
  --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#1a1a1a; --soft:#d9d9d9;
  --wall:#e6e6e6; --wall-dark:#c4c4c4; --shadow:rgba(0,0,0,.14); --panel:#ffffff;
  --danger:#b3261e; --good:#2e6b45;
  --font: "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a;
    --wall:#2c2c2c; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --danger:#ff8a80; --good:#8fd1a6;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a;
  --wall:#2c2c2c; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --danger:#ff8a80; --good:#8fd1a6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* HUD */
.tl{position:fixed;top:18px;left:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tlrow{display:flex;gap:8px;align-items:center}
.pause{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:14px}
.speed{font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px 8px;cursor:pointer}
.ind{display:grid;grid-template-columns:auto 84px;gap:3px 8px;font-size:11.5px;align-items:center;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:6px 8px;border-radius:10px}
.ind .bar{height:6px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ind .bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
.hud{position:fixed;top:16px;right:18px;text-align:right;line-height:1.35;pointer-events:none;background:color-mix(in srgb,var(--bg) 80%,transparent);padding:4px 6px;border-radius:10px}
.money{font-size:36px;font-weight:300;display:flex;align-items:center;gap:10px;justify-content:flex-end}
.money.neg{color:var(--danger)}
.money small{font-size:15px}
.chip{display:inline-block;width:.62em;height:.62em;border-radius:50%;border:.17em solid currentColor;flex:none}
.money .chip{background:var(--ink);border-color:var(--ink);box-shadow:inset 0 0 0 .12em var(--bg)}
.hud .sub{font-size:14px}
.hud .tiny{font-size:12px;color:var(--muted)}
.hud .risk{font-size:12px;color:var(--danger);margin-top:2px}
.pos{color:var(--good)} .negc{color:var(--danger)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:min(520px,calc(100vw - 420px))}
.toast div{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px 10px;font-size:13px;animation:fade 4.5s forwards;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.dockwrap{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100vw - 32px)}
.tag{border:1.5px solid var(--line);border-radius:9px;padding:1px 9px;font-size:12px;background:var(--bg);min-height:20px}
.tag:empty{visibility:hidden}
.dock{display:flex;gap:12px;border:2px solid var(--line);border-radius:18px;padding:12px 14px 8px;background:var(--bg);overflow-x:auto;max-width:100%}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;position:relative;min-width:58px}
.act .ic{width:54px;height:54px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--bg);box-shadow:3px 4px 0 var(--shadow);font-size:20px;transition:transform .08s}
.act.on .ic{background:var(--ink);color:var(--bg)}
.act:active .ic{transform:translateY(2px)}
.act .k{position:absolute;left:0;top:38px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:10px;display:grid;place-items:center}
.act .c{font-size:11.5px;white-space:nowrap}
.act[disabled]{opacity:.35;cursor:default}
.act svg{width:24px;height:24px}

/* overlay */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 86%,transparent);display:none;place-items:center;padding:16px;overflow:auto;z-index:10}
.ov.show{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:6px 8px 0 var(--shadow)}
.card h1{font-size:22px;font-weight:600;margin:0 0 6px}
.card h2{font-size:13px;font-weight:600;margin:18px 0 8px;letter-spacing:.06em}
.card p{margin:6px 0;font-size:14px;line-height:1.7}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);text-align:left;cursor:pointer;font-size:13px;line-height:1.55}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt small{color:var(--muted);display:block}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.opt[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.choice{display:block;width:100%;margin:6px 0}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
.stepper output{font-size:28px;font-weight:300;min-width:2ch;text-align:center}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);border-radius:999px;padding:9px 20px;background:var(--bg);cursor:pointer;font-size:14px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.4;cursor:default}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
table.t td,table.t th{border-bottom:1px solid var(--soft);padding:5px 6px;text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t tr.total td{font-weight:600;border-top:1.5px solid var(--line)}
details{border-top:1px solid var(--soft);margin-top:10px;padding-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.prov{margin:8px 0;padding:8px 10px;border-left:2px solid var(--line);font-size:12.5px;line-height:1.7}
.prov a{color:inherit}
.big{font-size:44px;font-weight:300;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.big small{font-size:16px}
.timeline{font-size:12.5px;line-height:1.8;max-height:200px;overflow:auto;border:1px solid var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.slider{display:grid;grid-template-columns:4.5em 1fr 4.5em;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.slider input{width:100%}
.hours{position:relative;height:30px;border:1px solid var(--soft);border-radius:8px;margin:6px 0 2px;overflow:hidden}
.hours .band{position:absolute;top:0;bottom:0;background:var(--soft)}
.hours .open{position:absolute;top:6px;bottom:6px;background:var(--ink);border-radius:4px}
.hours .legal{position:absolute;top:0;bottom:0;border-left:2px dashed var(--danger)}
.hours .lbl{position:absolute;bottom:-1px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.warn{color:var(--danger);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.grid2 span:nth-child(even){text-align:right}
.rank{font-size:12.5px;line-height:1.7;margin:0;padding-left:1.4em}
@media (max-width:720px){
  .money{font-size:26px}.hud{top:10px;right:10px}.tl{top:10px;left:10px}.ind{display:none}
  .act .ic{width:44px;height:44px;font-size:17px}.act{min-width:48px}.act .k{top:30px}.dock{gap:6px;padding:10px 8px 6px}
  .toast{top:120px;max-width:calc(100vw - 32px)}
}
</style>
</head>

<script>
(() => {
"use strict";
const D = JSON.parse(document.getElementById("shop-data").textContent);
const PROV = JSON.parse(document.getElementById("provisions-data").textContent);
const M = D.meta, L = D.layout, O = D.operations, R = D.risk, V = D.valuation, F = D.finance, IND = D.indicators;
const $ = (id) => document.getElementById(id);
const byId = (arr, id) => arr.find((x) => x.id === id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const QS = new URLSearchParams(location.search);
const TEST = QS.has("test");
let rand = Math.random;
if (QS.has("seed")) { let s = (+QS.get("seed") >>> 0) || 1; rand = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

/* 金額：万円 → 「1億2,345万円」 */
function yen(man, sign){
  const neg = man < 0, v = Math.round(Math.abs(man));
  const oku = Math.floor(v / 10000), rest = v % 10000;
  let s = oku ? `${oku}億${rest ? rest.toLocaleString("ja-JP") + "万" : ""}円` : `${rest.toLocaleString("ja-JP")}万円`;
  if (oku && !rest) s = `${oku}億円`;
  return (neg ? "−" : sign && man > 0 ? "+" : "") + s;
}
const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
const hh = (h) => `${h >= 24 ? h - 24 : h}時`;
const hhLong = (h) => h >= 24 ? `翌${h - 24}時` : `${h}時`;

/* ---------- 店の形 ---------- */
function build(loc, tables){
  const area = tables * L.tsuboPerTable + L.commonTsubo;
  const rent = area * loc.tsuboRent;
  const deposit = rent * L.depositMonths;
  const fitout = area * loc.fitoutPerTsubo;
  const tablesCost = tables * L.tablePrice;
  return { area, rent, deposit, fitout, tablesCost, invest: deposit + fitout + tablesCost + L.openingCost };
}
function bandWeight(open, close){
  let w = 0;
  for (const b of O.bands){ const a = Math.max(open, b.from), z = Math.min(close, b.to); if (z > a) w += (z - a) * b.w; }
  return w;
}
const BASE_W = bandWeight(14, 24);
function turnsFor(open, close){ return bandWeight(open, close) / O.avgStayHours * O.turnsScale; }

/* ---------- 状態 ---------- */
let S = null;
function newState(cfg){
  const loc = byId(D.locations, cfg.loc), b = build(loc, cfg.tables);
  const legalWait = !cfg.unlicensed;
  const st = {
    cfg, loc, tables: cfg.tables, area: b.area, rent: b.rent, deposit: b.deposit, fitout: b.fitout, tablesValue: b.tablesCost,
    open: cfg.open, close: cfg.close, price: cfg.price, ad: 0,
    cash: M.fund - b.invest - (legalWait ? D.license.fee : 0), debt: 0,
    month: 0, monthT: 0, openedAt: null,
    licensed: false, licenseWait: legalWait ? D.license.waitMonths : 0, applying: false,
    illegal: { cashout: !!cfg.cashout, prize: !!cfg.prize, unlicensed: !!cfg.unlicensed, latenight: false },
    used: { cashout: 0, prize: 0, unlicensed: 0, latenight: 0 }, lastUsed: {}, stopUntil: {},
    illegalMonths: [], orders: 0, rumor: 0, shock: 0,
    ind: { ...IND.start },
    share: Math.max(0.3, 1 + gauss() * loc.demandSd), competitors: 0,
    tempDemand: [], pending: [], eventsSeen: new Set(),
    ops: [], last: { guests: 0, occ: 0, rev: 0, net: 0, cost: 0 }, peakMonth: -Infinity,
    year: { rev: 0, op: 0 }, q: [], log: [], timeline: [], over: null, paused: false, speed: 1, ddNotified: false,
  };
  st.illegal.latenight = st.close > O.legalClose;
  return st;
}
function gauss(){ let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function logEv(type, data){ S.log.push({ t: S.month, type, ...data }); }
function story(text){ S.timeline.push({ t: S.month, text }); }
const monthLabel = (t) => `${Math.floor(t / 12) + 1}年目${(t % 12) + 1}か月`;

/* ---------- 計算 ---------- */
function demandMult(){
  const i = S.ind;
  let m = (0.82 + 0.6 * i.fame / 100) * (0.8 + 0.4 * i.comfort / 100); // 開業時（知名度30・居心地50）で1.0
  m *= Math.pow(S.price, -O.price.elasticity);
  if (S.illegal.prize && !stopped("prize") && !demandMult.legal) m *= byId(D.illegal, "prize").effect.demand;
  for (const t of S.tempDemand) m *= t.mult;
  return m;
}
function ramp(){ const t = S.openedAt == null ? 0 : S.month - S.openedAt; return Math.min(1, O.rampStart + (1 - O.rampStart) * t / O.rampMonths); }
function isOpen(){ return S.licensed || S.illegal.unlicensed; }
function stopped(id){ return (S.stopUntil[id] || 0) > S.month; }
function activeIllegal(){
  return D.illegal.filter((a) => {
    if (a.id === "latenight") return S.close > O.legalClose && isOpen();
    if (a.id === "unlicensed") return !S.licensed && S.illegal.unlicensed;
    return S.illegal[a.id] && !stopped(a.id) && isOpen();
  });
}
function hoursLen(){ return S.close - S.open; }
function project(legalOnly){
  // 今月の見込み（月次処理とHUDで共用）。legalOnly=true なら違法の効果を除く
  const seats = S.tables * 9, turns = turnsFor(S.open, S.close);
  const hoursF = bandWeight(S.open, S.close) / BASE_W;
  demandMult.legal = !!legalOnly;
  const demand = S.loc.demand * S.share * ramp() * demandMult() * hoursF;
  demandMult.legal = false;
  const occ = seats ? Math.min(S.loc.occCap, demand / (seats * turns)) : 0;
  const guests = seats * occ * turns;
  let spend = S.loc.spend * S.price;
  if (S.illegal.cashout && !stopped("cashout") && !legalOnly) spend *= byId(D.illegal, "cashout").effect.spend;
  let rev = guests * O.days * spend;
  if (S.rumor > 0) rev *= 1 - R.orderRumor;
  if (S.shock > 0) rev *= 1 - O.trouble.shock;
  const staff = S.loc.staffPerTable * S.tables * hoursLen() / O.baseHours;
  const adCost = O.ads[S.ad].cost;
  const interest = S.debt * F.rate / 12;
  const op = rev * (1 - O.variableRate) - S.rent - staff - O.otherFixed - adCost;
  return { demand, occ, guests, rev, staff, adCost, interest, op, net: op - interest, turns };
}
function risks(){
  let arrest = 0, order = 0;
  const act = activeIllegal();
  const jump = Math.pow(R.orderJump, S.orders);
  for (const a of act){ arrest += (a.arrest + a.arrestGrowth * S.used[a.id]) * jump; order += a.order; }
  for (const a of D.illegal){
    if (act.includes(a)) continue;
    const lu = S.lastUsed[a.id];
    if (lu != null && S.month - lu <= R.tailMonths) arrest += a.arrest * R.tailFactor * jump;
  }
  return { arrest: Math.min(0.9, arrest), order: Math.min(0.9, order), active: act };
}

/* DCF */
function dcfParts(){
  const recent = S.ops.slice(-12);
  const fcfMonth = (recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0) - O.maintenancePerTable * S.tables;
  const i = S.ind;
  const r = V.discountBase + (50 - i.trust) / 100 * V.discountTrust * 2 + V.discountPerOrder * S.orders + (i.slack < 30 ? V.discountLowSlack : 0);
  const g = clamp(V.growthBase + (i.comfort - 50) / 100 * V.growthComfort * 2 + (i.fame - 50) / 100 * V.growthFame * 2, V.growthMin, V.growthMax);
  const rows = []; let fcf = fcfMonth * 12, pv = 0;
  for (let y = 1; y <= V.years; y++){ fcf *= 1 + g; const d = fcf / Math.pow(1 + r, y); pv += d; rows.push({ y, fcf, pv: d }); }
  const tv = fcf * (1 + V.terminalGrowth) / (r - V.terminalGrowth), tvPv = tv / Math.pow(1 + r, V.years);
  const ev = pv + tvPv;
  return { fcfMonth, r, g, rows, tv, tvPv, ev: Math.max(0, ev), raw: ev };
}
function shellValue(){ return S.deposit + S.fitout * L.fitoutResidual + S.tablesValue * L.tableResidual; }
function storeValue(){ const d = dcfParts(); return Math.max(d.ev + S.deposit, shellValue()); }

/* ---------- 月次 ---------- */
function monthTick(){
  const wasOpen = isOpen();
  let orderActs = null;
  if (wasOpen && S.openedAt == null){ S.openedAt = S.month; story(S.licensed ? "許可が下り、開業した。" : "許可を待たずに開業した。"); }
  let p;
  if (wasOpen){
    p = project();
  } else {
    p = { demand: 0, occ: 0, guests: 0, rev: 0, op: -S.rent, interest: 0, net: -S.rent };
  }
  S.cash += p.net; S.last = p;
  if (wasOpen){ S.ops.push(p.op); S.year.rev += p.rev; S.year.op += p.op; S.peakMonth = Math.max(S.peakMonth, p.net); }
  logEv("month", { net: Math.round(p.net), guests: Math.round(p.guests), occ: +p.occ.toFixed(3) });

  // 違法の記録とリスク
  if (wasOpen){
    const rk = risks();
    for (const a of rk.active){ S.used[a.id]++; S.lastUsed[a.id] = S.month; }
    if (rk.active.length) S.illegalMonths.push(S.month);
    if (rand() < rk.arrest){ logEv("arrest", {}); story("摘発された。"); spawnPolice(); S.month++; return finish("arrest"); }
    if (rk.active.length && rand() < rk.order) orderActs = rk.active;
  }

  // 指標の動き
  const i = S.ind;
  if (wasOpen){
    i.fame = clamp(i.fame + O.ads[S.ad].fame + (p.occ > 0.8 ? 0.5 : 0), 0, 100);
    const slackTarget = 85 - 70 * Math.max(0, p.occ - 0.5) / 0.4 - Math.max(0, hoursLen() - 10) * 3;
    i.slack = clamp(i.slack + (slackTarget - i.slack) * 0.2, 0, 100);
    i.comfort = clamp(i.comfort + ((50 + (i.slack - 50) * 0.4) - i.comfort) * 0.1, 0, 100);
    i.trust = clamp(i.trust + (50 - i.trust) * 0.03, 0, 100);
  }
  // 期限つき効果
  S.tempDemand = S.tempDemand.filter((t) => --t.months > 0);
  if (S.rumor > 0) S.rumor--;
  if (S.shock > 0) S.shock--;
  // 許可
  if (S.licenseWait > 0){ S.licenseWait--; if (S.licenseWait === 0){ S.licensed = true; S.illegal.unlicensed = false; note("許可が下りた。"); logEv("licensed", {}); } }

  // 競合・トラブル
  if (wasOpen && rand() < S.loc.competition.p){ S.competitors++; S.share *= 1 - S.loc.competition.hit; note(`近くに競合店が開業した（需要 −${Math.round(S.loc.competition.hit * 100)}%）`); story("近くに競合店が開業した。"); }
  const trP = S.loc.troubleP * (i.slack < 30 ? 1.5 : 1);
  if (wasOpen && rand() < trP){
    if (rand() < 0.5){ const c = (O.trouble.costMin + rand() * (O.trouble.costMax - O.trouble.costMin)) * (1 + S.tables / 10); S.cash -= c; const t = D.troubleTexts[Math.floor(rand() * D.troubleTexts.length)]; note(`${t}（${yen(-c)}）`); story(`${t}。${yen(c)}かかった。`); logEv("trouble", { cost: Math.round(c) }); }
    else { S.shock = O.trouble.shockMonths; const t = D.shockTexts[Math.floor(rand() * D.shockTexts.length)]; note(`${t}（3か月 売上−30%）`); story(`${t}。`); logEv("shock", {}); }
  }

  // 後日談
  for (const pd of S.pending.filter((x) => x.at <= S.month)){ applyEffects(pd.effects || {}); note(`後日談：${pd.text}`); story(`後日談：${pd.text}`); }
  S.pending = S.pending.filter((x) => x.at > S.month);

  S.month++;
  if (S.cash < M.bankruptAt){ story("資金が尽きた。"); return finish("bankrupt"); }

  // 区切り（同じ月に重なったら順番に出す）
  if (orderActs) enqueue(() => order(orderActs));
  if (S.month >= M.months) enqueue(proposal);
  else {
    if (S.month % 12 === 0) enqueue(annual);
    if (S.month >= R.ddStart && !S.ddNotified){ S.ddNotified = true; enqueue(offer); }
    if (wasOpen && !orderActs) maybeEvent();
  }
  if (S.q.length && !ov.classList.contains("show")) S.q.shift()();
}
function enqueue(fn){ S.q.push(fn); S.paused = true; }
function applyEffects(e){
  const i = S.ind;
  for (const k of ["fame", "trust", "comfort", "slack"]) if (e[k]) i[k] = clamp(i[k] + e[k], 0, 100);
  if (e.cash){ S.cash += e.cash; }
  if (e.demand) S.tempDemand.push({ mult: e.demand.mult, months: e.demand.months });
  if (e.closeDelta){ S.close = clamp(S.close + e.closeDelta, S.open + 4, O.closeMax); }
}

/* ---------- 是正指摘・摘発 ---------- */
function order(acts){
  S.orders++;
  const legalOp = Math.max(0, project(true).op);  // 違法の上乗せを除いた月の利益が基準
  const cost = Math.max(R.orderCostMin, legalOp * R.orderCostMonths);
  S.cash -= cost; S.ind.trust = clamp(S.ind.trust + R.orderTrust, 0, 100); S.rumor = R.orderRumorMonths;
  for (const a of acts){ if (a.id === "latenight"){ S.close = O.legalClose; } else if (a.id !== "unlicensed"){ S.illegal[a.id] = false; S.stopUntil[a.id] = S.month + R.orderStopMonths; } }
  logEv("order", { acts: acts.map((a) => a.id), cost: Math.round(cost) });
  story(`${R.labels.order}を受けた（${acts.map((a) => a.short).join("・")}）。${R.labels.orderCost} ${yen(cost)}。`);
  spawnPolice();
  pauseWith(() => show(`
    <div class="kicker">${monthLabel(S.month - 1)}</div>
    <h1>${esc(R.labels.order)}</h1>
    <p>${acts.map((a) => esc(a.name)).join("、")}について指摘を受けた。</p>
    <table class="t"><tr><td>${esc(R.labels.orderCost)}</td><td>${yen(cost)}</td></tr>
      <tr><td>信頼</td><td>${R.orderTrust}</td></tr>
      <tr><td>その違法アクション</td><td>${R.orderStopMonths}か月 止まる</td></tr>
      <tr><td>風評（売上）</td><td>${R.orderRumorMonths}か月 −${Math.round(R.orderRumor * 100)}%</td></tr>
      <tr><td>以後の摘発率</td><td>×${Math.pow(R.orderJump, S.orders)}</td></tr>
      <tr><td>店の値段（DCFの割引率）</td><td>+${Math.round(V.discountPerOrder * 100)}%</td></tr></table>
    <p class="muted" style="font-size:12px">${esc(R.note)}</p>
    <details><summary>参考：実際の条文（このゲームの処分モデルの根拠ではない）</summary>${provHTML([...new Set(acts.flatMap((a) => a.provisionIds))])}</details>
    <div class="row"><button class="btn primary" id="okBtn">営業を続ける</button></div>`, () => { $("okBtn").onclick = resume; }));
}

/* ---------- 事件 ---------- */
function eligible(ev){
  const w = ev.when || {};
  if (S.eventsSeen.has(ev.id)) return false;
  if (w.minMonth && S.month < w.minMonth) return false;
  if (w.minFame && S.ind.fame < w.minFame) return false;
  if (w.maxSlack && S.ind.slack > w.maxSlack) return false;
  if (w.minOcc && S.last.occ < w.minOcc) return false;
  if (w.minClose && S.close < w.minClose) return false;
  return true;
}
function maybeEvent(){
  if (rand() > D.eventChance) return;
  const list = D.events.filter(eligible);
  if (!list.length) return;
  const ev = list[Math.floor(rand() * list.length)];
  S.eventsSeen.add(ev.id);
  enqueue(() => pauseWith(() => {
    show(`<div class="kicker">${monthLabel(S.month)} ・ 事件</div><h1>${esc(ev.title)}</h1><p>${esc(ev.omen)}</p>
      <h2>どうする？</h2>${ev.choices.map((c, k) => `<button class="opt choice" data-k="${k}"><b>${esc(c.label)}</b></button>`).join("")}`);
    card.querySelectorAll(".choice").forEach((b) => b.onclick = () => decide(ev, ev.choices[+b.dataset.k]));
  }));
}
function decide(ev, c){
  if (c.effects) applyEffects(c.effects);
  let text = c.text || "";
  let later = c.later;
  if (c.outcomes){
    let r = rand(), o = c.outcomes.at(-1);
    for (const x of c.outcomes){ if (r < x.p){ o = x; break; } r -= x.p; }
    if (o.effects) applyEffects(o.effects);
    text = (text ? text + " " : "") + o.text; if (o.later) later = o.later;
  }
  if (later) S.pending.push({ at: S.month + later.months, text: later.text, effects: later.effects });
  logEv("event", { id: ev.id, choice: c.label });
  story(`${ev.title} → 「${c.label}」。${text}`);
  const eff = { ...(c.effects || {}) };
  show(`<div class="kicker">${monthLabel(S.month)} ・ 結果</div><h1>${esc(c.label)}</h1><p>${esc(text)}</p>
    ${later ? `<p class="muted" style="font-size:12.5px">この判断は、後から効いてくるかもしれない。</p>` : ""}
    <div class="row"><button class="btn primary" id="okBtn">営業に戻る</button></div>`);
  $("okBtn").onclick = resume;
  if (TEST) autoClick();
}

function annual(){
  const y = S.month / 12, d = dcfParts();

      ${Object.entries(IND.names).map(([k, n]) => `<span>${n}</span><span>${Math.round(S.ind[k])}</span>`).join("")}</div>

function offer(){
  story("大手から買収の打診が来た。ここから6か月が買収前調査。");
  pauseWith(() => show(`
    <div class="kicker">${monthLabel(S.month)}</div><h1>大手から買収の打診</h1>
    <p>5年目の終わりに、あなたの店を買いたいという話が来た。ここから6か月かけて、買い手が店の中身を調べる（買収前調査）。</p>
    <p>この期間の違法営業は、ほぼ確実に見つかる。過去の違法も、1か月ごとに一定の確率で見つかる。見つかれば、売却額は「ハコとしての価値」だけになる。</p>
    <div class="row"><button class="btn primary" id="okBtn">分かった</button></div>`, () => { $("okBtn").onclick = resume; }));

function proposal(){
  const early = S.illegalMonths.filter((t) => t < R.ddStart).length, late = S.illegalMonths.filter((t) => t >= R.ddStart).length;
  const pFound = 1 - Math.pow(1 - R.ddEarlyQ, early) * Math.pow(1 - R.ddLateQ, late);
  const found = S.illegalMonths.length > 0 && rand() < pFound;
  const d = dcfParts();
  const sale = found ? shellValue() : storeValue();
  logEv("proposal", { found, sale: Math.round(sale), pFound: +pFound.toFixed(3) });
  story(found ? "買収前調査で違法営業が見つかった。" : "買収提案がまとまった。");
  S.sale = sale; S.found = found;
  pauseWith(() => show(`
    <div class="kicker">60か月目</div><h1>${found ? "買収前調査の結果" : "買収提案"}</h1>
    ${found ? `<p><b>${esc(V.shellMessage)}</b></p>
      <table class="t"><tr><td>敷金</td><td>${yen(S.deposit)}</td></tr><tr><td>内装の残存価値（${Math.round(L.fitoutResidual * 100)}%）</td><td>${yen(S.fitout * L.fitoutResidual)}</td></tr>
      <tr><td>卓の残存価値（${Math.round(L.tableResidual * 100)}%）</td><td>${yen(S.tablesValue * L.tableResidual)}</td></tr><tr class="total"><td>売却額</td><td>${yen(sale)}</td></tr></table>
      <p class="muted" style="font-size:12px">違法営業 ${S.illegalMonths.length}か月（調査期間中 ${late}か月）。見つかる確率は ${pct(pFound, 0)} だった。参考：健全なら ${yen(storeValue())}。</p>`
      : `<p>あなたの店の将来のキャッシュフローを、今の価値に直した金額で買いたい、という提案。</p>${dcfTable(d)}${rDetail(d)}`}
    <div class="row"><button class="btn primary" id="okBtn">結果発表へ</button></div>`, () => { $("okBtn").onclick = () => finish("complete"); }));
}

/* ---------- 終了 ---------- */
function finish(kind){
  S.over = kind; S.paused = true;
  const sale = kind === "complete" ? S.sale : 0;
  const amount = kind === "complete" ? S.cash + sale - S.debt : 0;
  const disq = kind === "arrest";
  logEv("end", { kind, amount: Math.round(amount), sale: Math.round(sale), peak: Math.round(S.peakMonth) });
  const rank = saveRank(kind, amount);
  const title = { complete: "結果発表", arrest: R.labels.arrest, bankrupt: "資金が尽きた" }[kind];
  const lead = { complete: S.found ? "店は売れたが、ハコの値段にしかならなかった。" : "5年の経営を終え、店を売却した。", arrest: "違法営業が摘発され、店は続けられなくなった。両方のランキングで失格。", bankrupt: `${monthLabel(Math.max(0, S.month - 1))}に資金が尽きた。` }[kind];
  show(`
    <div class="kicker">${esc(S.loc.name)} ・ ${S.tables}卓 ・ ${S.month}か月</div><h1>${esc(title)}</h1><p>${esc(lead)}</p>
    <div class="kicker" style="margin-top:12px">最終手取り額</div>
    <div class="big num">${yen(amount)}<small class="${amount - M.fund >= 0 ? "pos" : "negc"}">元手${yen(M.fund)}から ${yen(amount - M.fund, true)}</small></div>
    ${kind === "complete" ? `<table class="t"><tr><td>手元資金</td><td>${yen(S.cash)}</td></tr><tr><td>売却額${S.found ? "（ハコとしての価値）" : "（DCF）"}</td><td>${yen(sale)}</td></tr>
      <tr><td>借入残高</td><td>${yen(-S.debt)}</td></tr><tr class="total"><td>最終手取り額</td><td>${yen(amount)}</td></tr></table>` : ""}
    <p class="muted num" style="font-size:12.5px">一番稼いだ月の利益：${isFinite(S.peakMonth) ? yen(S.peakMonth) : "—"}${disq ? "（失格）" : ""}</p>
    <h2>5年の物語</h2><div class="timeline">${S.timeline.map((x) => `${monthLabel(x.t)}：${esc(x.text)}`).join("<br>") || "—"}</div>
    <h2>ランキング（この端末）</h2>${rankHTML(rank)}
    <div class="row"><button class="btn" id="dlBtn">プレイログを保存（JSONL）</button><button class="btn primary" id="againBtn">もう一度</button></div>
    <div class="foot">ログとランキングはこの端末に保存されるだけで、送信されない。${esc(M.disclaimer)}</div>`);
  $("dlBtn").onclick = exportLog; $("againBtn").onclick = () => { S = null; resetScene(); openTitle(); };
}
const RANK_KEY = "poker-shop-v06-rank";
function loadRank(){ try { return JSON.parse(localStorage.getItem(RANK_KEY)) || { final: [], peak: [] }; } catch { return { final: [], peak: [] }; } }
function saveRank(kind, amount){
  const r = loadRank();
  if (kind !== "arrest"){
    const base = { loc: S.loc.name, tables: S.tables, date: new Date().toISOString().slice(0, 10) };
    if (kind === "complete" || kind === "bankrupt") r.final.push({ ...base, amount: Math.round(amount), mine: true });
    if (isFinite(S.peakMonth)) r.peak.push({ ...base, amount: Math.round(S.peakMonth), illegal: S.illegalMonths.length > 0, mine: true });
  }
  r.final.sort((a, b) => b.amount - a.amount); r.peak.sort((a, b) => b.amount - a.amount);
  const out = { final: r.final.slice(0, 10), peak: r.peak.slice(0, 10) };
  try { localStorage.setItem(RANK_KEY, JSON.stringify({ final: out.final.map(({ mine, ...x }) => x), peak: out.peak.map(({ mine, ...x }) => x) })); } catch {}
  return out;
}
function rankHTML(r){
  const li = (x) => `<li${x.mine ? ' style="font-weight:600"' : ""}>${yen(x.amount)} ・ ${esc(x.loc)} ${x.tables}卓${x.illegal ? " ・ 違法あり" : ""} ・ ${esc(x.date)}</li>`;
  return `<div class="grid2" style="align-items:start"><div><div class="kicker">最終手取り額</div><ol class="rank">${r.final.map(li).join("") || "<li>まだ記録がない</li>"}</ol></div>
    <div><div class="kicker">瞬間収益（一番稼いだ月）</div><ol class="rank">${r.peak.map(li).join("") || "<li>まだ記録がない</li>"}</ol></div></div>`;
}
function exportLog(){
  const meta = { type: "run", game: "poker-shop", version: M.version, cfg: S.cfg, outcome: S.over, found: !!S.found, at: new Date().toISOString(), note: "ゲームの架空パラメータによるプレイログ。実データではない。" };
  const lines = [meta, ...S.log.map((x) => ({ type: "event", ...x })), ...S.timeline.map((x) => ({ type: "story", ...x }))].map((x) => JSON.stringify(x)).join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines], { type: "application/jsonl" }));

function hide(){ ov.classList.remove("show"); }
function pauseWith(fn, after){ S.paused = true; fn(); if (after) after(); if (TEST) autoClick(); }
function resume(){ hide(); if (!S || S.over) return; if (S.q.length) S.q.shift()(); else S.paused = false; }
function autoClick(){ setTimeout(() => { const cs = card.querySelectorAll(".choice"); const b = cs.length ? cs[Math.floor(Math.random() * cs.length)] : $("okBtn"); if (b && ov.classList.contains("show")) b.click(); }, 10); }
function note(text){

function provHTML(ids){

/* ---------- 開業後の操作 ---------- */
function lateTableCost(){ return L.tablePrice + L.tsuboPerTable * S.loc.fitoutPerTsubo * L.lateTableMarkup + L.tsuboPerTable * S.loc.tsuboRent * L.depositMonths; }
function act(a){
  if (!S || S.over || ov.classList.contains("show")) return;
  if (a === "ad"){ S.ad = (S.ad + 1) % O.ads.length; note(S.ad ? `広告 Lv${S.ad}（${yen(O.ads[S.ad].cost)}/月）` : "広告を止めた"); logEv("ad", { level: S.ad }); }
  if (a === "tableAdd"){
    if (S.tables >= L.maxTables) return note("これ以上は置けない");
    const c = lateTableCost();
    S.tables++; S.cash -= c; S.area += L.tsuboPerTable; S.rent += L.tsuboPerTable * S.loc.tsuboRent; S.deposit += L.tsuboPerTable * S.loc.tsuboRent * L.depositMonths;
    S.fitout += L.tsuboPerTable * S.loc.fitoutPerTsubo * L.lateTableMarkup; S.tablesValue += L.tablePrice;
    note(`増卓（${yen(c)}。家賃 +${yen(L.tsuboPerTable * S.loc.tsuboRent)}/月）`); logEv("tables", { n: S.tables }); placeTables();
  }
  if (a === "tableSub"){
    if (S.tables <= L.minTables) return;
    S.tables--; const back = L.tablePrice * L.tableResidual; S.cash += back; S.tablesValue -= L.tablePrice;
    note(`減卓（${yen(back)}で売却。面積と家賃はそのまま）`); logEv("tables", { n: S.tables }); placeTables();
  }
  if (a === "edu"){ const e = O.education; S.cash -= e.cost; S.ind.slack = clamp(S.ind.slack + e.slack, 0, 100); S.ind.comfort = clamp(S.ind.comfort + e.comfort, 0, 100); note(`スタッフ教育（${yen(-e.cost)}）余力 +${e.slack}・居心地 +${e.comfort}`); logEv("edu", {}); }
  if (a === "settings") openSettings();
  if (a === "finance") openFinance();
  syncHUD();
}

function canBorrow(){
  if (S.month < F.unlockMonths) return { ok: false, why: `開業から${F.unlockMonths}か月たっていない` };
  if (activeIllegal().length) return { ok: false, why: "違法営業中" };
  if (S.illegalMonths.some((t) => t >= S.month - F.unlockMonths)) return { ok: false, why: `直近${F.unlockMonths}か月に違法営業がある` };
  if (S.rumor > 0) return { ok: false, why: `${R.labels.order}の風評が残っている` };
  const last6 = S.ops.slice(-6).reduce((a, b) => a + b, 0);
  if (last6 <= 0) return { ok: false, why: "直近6か月のキャッシュフローがマイナス" };
  const limit = Math.max(0, S.ops.slice(-12).reduce((a, b) => a + b, 0) * F.limitMultiple);
  return { ok: limit > S.debt, why: "上限まで借りている", limit };
}
function openFinance(){
  const was = S.paused; S.paused = true;
  const render = () => {
    const f = canBorrow();
    show(`<div class="kicker">借入</div><h1>お金を借りる・返す</h1>
      <p>健全営業で、直近6か月のキャッシュフローがプラスなら借りられる。上限は直近12か月の営業キャッシュフローの${F.limitMultiple}倍、金利は年${pct(F.rate, 0)}（案）。借入残高は最後に手取り額から引かれる。</p>

      ${f.ok ? "" : `<p class="muted">いまは借りられない：${esc(f.why)}</p>`}
      <div class="row"><button class="btn" id="repayBtn" ${S.debt > 0 && S.cash > 0 ? "" : "disabled"}>${yen(F.step)}返す</button>
        <button class="btn" id="borrowBtn" ${f.ok ? "" : "disabled"}>${yen(F.step)}借りる</button><button class="btn primary" id="okBtn">閉じる</button></div>`);
    $("borrowBtn").onclick = () => { const amt = Math.min(F.step, f.limit - S.debt); S.debt += amt; S.cash += amt; note(`${yen(amt)}借りた`); story(`${yen(amt)}借りた。`); logEv("borrow", { amt }); render(); };
    $("repayBtn").onclick = () => { const amt = Math.min(F.step, S.debt, S.cash); S.debt -= amt; S.cash -= amt; note(`${yen(amt)}返した`); logEv("repay", { amt }); render(); };
    $("okBtn").onclick = () => { hide(); S.paused = was; syncHUD(); };
  };
  render();
}

  $("adC").textContent = S.ad ? `広告Lv${S.ad}` : "広告";
  document.querySelector('[data-a="ad"]').classList.toggle("on", S.ad > 0);
  $("addC").textContent = `増卓 ${Math.round(lateTableCost())}万`;
  $("subC").textContent = `${S.tables}卓`;
  $("eduC").textContent = `教育 ${O.education.cost}万`;
  let tag = "";
  if (!isOpen()) tag = `許可待ち あと${S.licenseWait}か月`;
  else if (S.month >= R.ddStart) tag = "買収前調査中";
  else if (S.rumor > 0) tag = `風評 あと${S.rumor}か月`;
  else if (rk.active.length) tag = `違法営業中：${rk.active.map((a) => a.short).join("・")}`;
  else if (S.ind.slack < 30) tag = "スタッフが疲れている";
  else if ((S.last.occ || 0) >= S.loc.occCap - 0.01) tag = "満席続き";
  else if (S.last.occ && S.last.occ < 0.4) tag = "集客不足";
  $("tag").textContent = tag;
}

/* ---------- 見下ろし画面 ---------- */
const cv = $("cv"), cx = cv.getContext("2d");
let W = 0, H = 0, U = 1;
function resize(){ const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); U = Math.min(W, H) / 1000; placeTables(); }
addEventListener("resize", resize);
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let C = {};
function readColors(){ C = { ink: css("--ink"), bg: css("--bg"), wall: css("--wall"), wallD: css("--wall-dark"), sh: css("--shadow"), muted: css("--muted"), danger: css("--danger"), font: css("--font") }; }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
let people = [], tablesPos = [], pops = [], police = [], bubbles = [];
const center = () => ({ x: W / 2, y: H * 0.5 });
const shopR = () => 150 * U * (S ? 1 + Math.min(S.tables, 12) * 0.035 : 1);
const reachR = () => Math.min(W, H) * 0.62 * (S ? 0.55 + 0.15 * S.ad : 0.55);
function resetScene(){ people = []; pops = []; police = []; bubbles = []; placeTables(); readColors(); }
function placeTables(){
  tablesPos = []; if (!S) return;
  const n = S.tables, r = shopR() * 0.58;
  for (let i = 0; i < n; i++){
    const ring = n > 6 && i >= 6 ? 1 : 0, k = ring ? n - 6 : Math.min(n, 6), j = ring ? i - 6 : i;
    const a = (j / k) * Math.PI * 2 + (ring ? Math.PI / k : 0) - Math.PI / 2, rr = ring ? r * 0.35 : (n === 1 ? 0 : r);
    tablesPos.push({ x: Math.cos(a) * rr, y: Math.sin(a) * rr * 0.62 });
  }
}
function spawnPerson(toShop){
  const c = center(), R0 = reachR() * (1.05 + Math.random() * 0.3), a = Math.random() * Math.PI * 2;
  const p = { x: c.x + Math.cos(a) * R0, y: c.y + Math.sin(a) * R0 * 0.62, toShop, ph: Math.random() * 6, sp: (30 + Math.random() * 18) * U * 1.6, state: "walk", t: 0 };
  if (toShop){
    // 居心地が低いと、入口で引き返す新規客が出る
    p.turnBack = S && Math.random() < (60 - S.ind.comfort) / 120;
    const tb = p.turnBack ? { x: -shopR() * 0.8, y: shopR() * 0.4 } : tablesPos[Math.floor(Math.random() * tablesPos.length)] || { x: 0, y: 0 };
    p.tx = c.x + tb.x + (Math.random() - .5) * 40 * U; p.ty = c.y + tb.y + (Math.random() - .5) * 26 * U;
  } else { const b = a + Math.PI + (Math.random() - .5); p.tx = c.x + Math.cos(b) * R0 * 1.4; p.ty = c.y + Math.sin(b) * R0 * 0.62 * 1.4; }
  people.push(p);
}
function spawnPolice(){ const c = center(); police.push({ x: c.x - reachR() * 1.1, y: c.y + reachR() * 0.3, tx: c.x - shopR() * 0.9, ty: c.y + shopR() * 0.25, t: 0, ph: 0 }); }
function figure(x, y, s, ph, moving, outline){
  cx.fillStyle = C.sh; cx.beginPath(); cx.ellipse(x + 6 * s, y + 2 * s, 9 * s, 3.5 * s, 0, 0, Math.PI * 2); cx.fill();
  const bob = moving ? Math.sin(ph) * 1.2 * s : 0, leg = moving ? Math.sin(ph) * 3 * s : 0;
  cx.fillStyle = outline ? C.bg : C.ink; cx.strokeStyle = C.ink; cx.lineWidth = 1.6 * s;
  cx.beginPath(); cx.roundRect(x - 5 * s + leg * .3, y - 10 * s, 4 * s, 10 * s, 2 * s); cx.roundRect(x + 1 * s - leg * .3, y - 10 * s, 4 * s, 10 * s, 2 * s); cx.fill(); if (outline) cx.stroke();
  cx.beginPath(); cx.roundRect(x - 6.5 * s, y - 24 * s + bob, 13 * s, 16 * s, 5 * s); cx.fill(); if (outline) cx.stroke();
  cx.beginPath(); cx.arc(x, y - 30 * s + bob, 6.5 * s, 0, Math.PI * 2); cx.fill(); if (outline) cx.stroke();
}
function wallArc(c, r, a0, a1, h){
  const k = 0.62, steps = 40;
  cx.beginPath();
  for (let i = 0; i <= steps; i++){ const a = a0 + (a1 - a0) * i / steps; const X = c.x + Math.cos(a) * r, Y = c.y + Math.sin(a) * r * k; i ? cx.lineTo(X, Y) : cx.moveTo(X, Y); }
  for (let i = steps; i >= 0; i--){ const a = a0 + (a1 - a0) * i / steps; cx.lineTo(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r * k - h); }
  cx.closePath(); cx.fillStyle = C.wall; cx.fill(); cx.strokeStyle = C.ink; cx.lineWidth = 1.4; cx.stroke();
  cx.beginPath();
  for (let i = 0; i <= steps; i++){ const a = a0 + (a1 - a0) * i / steps; const X = c.x + Math.cos(a) * r, Y = c.y + Math.sin(a) * r * k - h; i ? cx.lineTo(X, Y) : cx.moveTo(X, Y); }
  cx.lineWidth = 2.2; cx.stroke();
}
function draw(dt){
  const c = center();
  cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
  // 道（立地）
  const tr = S ? S.loc.tsuboRent : 1.5, ang = -0.36, len = Math.hypot(W, H);
  const ux = Math.cos(ang), uy = -Math.sin(ang), nx = -uy, ny = ux, rw = (10 + tr * 6) * U;
  cx.beginPath(); cx.moveTo(c.x - ux * len + nx * rw, c.y + uy * len + ny * rw); cx.lineTo(c.x + ux * len + nx * rw, c.y - uy * len + ny * rw);
  cx.lineTo(c.x + ux * len + nx * (rw + 26 * U), c.y - uy * len + ny * (rw + 26 * U)); cx.lineTo(c.x - ux * len + nx * (rw + 26 * U), c.y + uy * len + ny * (rw + 26 * U)); cx.closePath();
  const g = cx.createLinearGradient(c.x + nx * rw, c.y + ny * rw, c.x + nx * (rw + 26 * U), c.y + ny * (rw + 26 * U)); g.addColorStop(0, C.wallD); g.addColorStop(1, C.bg);
  cx.fillStyle = g; cx.fill(); cx.strokeStyle = C.ink; cx.lineWidth = 1.5;
  for (const s of [-rw, rw]){ cx.beginPath(); cx.moveTo(c.x - ux * len + nx * s, c.y + uy * len + ny * s); cx.lineTo(c.x + ux * len + nx * s, c.y - uy * len + ny * s); cx.stroke(); }
  if (S){ cx.fillStyle = C.muted; cx.font = `12px ${C.font}`; cx.save(); cx.translate(c.x - ux * W * 0.36, c.y + uy * W * 0.36 - rw - 8); cx.rotate(-Math.atan2(uy, ux)); cx.fillText(S.loc.name, 0, 0); cx.restore(); }
  // 競合店（道沿いの灰色の箱）
  if (S) for (let i = 0; i < S.competitors; i++){
    const d = (i % 2 ? 1 : -1) * (0.55 + 0.12 * Math.floor(i / 2)) * Math.min(W, H) * 0.6;
    const x = c.x + ux * d - nx * (rw + 30 * U), y = c.y - uy * d - ny * (rw + 30 * U), s = 26 * U;
    cx.fillStyle = C.sh; cx.fillRect(x - s + 5, y - s * 0.6 + 6, s * 2, s * 1.2);
    cx.fillStyle = C.wallD; cx.strokeStyle = C.ink; cx.lineWidth = 1; cx.fillRect(x - s, y - s * 0.6, s * 2, s * 1.2); cx.strokeRect(x - s, y - s * 0.6, s * 2, s * 1.2);
    cx.fillStyle = C.muted; cx.font = `10px ${C.font}`; cx.textAlign = "center"; cx.fillText("競合", x, y + 4); cx.textAlign = "start";
  }
  // 広告の届く範囲 + 5年の時計
  const RR = reachR();
  cx.strokeStyle = C.ink; cx.globalAlpha = .5; cx.lineWidth = 1;
  cx.beginPath(); cx.ellipse(c.x, c.y, RR, RR * 0.775, 0, 0, Math.PI * 2); cx.stroke();
  for (let i = 0; i < 5; i++){ const a = i / 5 * Math.PI * 2 - Math.PI / 2, x = c.x + Math.cos(a) * RR, y = c.y + Math.sin(a) * RR * 0.775; cx.beginPath(); cx.moveTo(x - Math.cos(a) * 7, y - Math.sin(a) * 7); cx.lineTo(x + Math.cos(a) * 7, y + Math.sin(a) * 7); cx.stroke(); }
  cx.globalAlpha = 1;
  if (S){ const a = (S.month + S.monthT) / M.months * Math.PI * 2 - Math.PI / 2, x = c.x + Math.cos(a) * RR, y = c.y + Math.sin(a) * RR * 0.775;
    cx.fillStyle = C.bg; cx.beginPath(); cx.arc(x, y, 8, 0, Math.PI * 2); cx.fill(); cx.stroke(); cx.fillStyle = C.ink; cx.beginPath(); cx.arc(x, y, 2.5, 0, Math.PI * 2); cx.fill(); }
  // 店
  const r = shopR(), h = 34 * U, k = 0.62, closed = S && !isOpen();
  cx.fillStyle = C.sh; cx.beginPath(); cx.ellipse(c.x + 10, c.y + 10, r + 6, (r + 6) * k, 0, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = C.bg; cx.beginPath(); cx.ellipse(c.x, c.y, r, r * k, 0, 0, Math.PI * 2); cx.fill();
  wallArc(c, r, Math.PI * 1.05, Math.PI * 1.65, h); wallArc(c, r, Math.PI * 1.78, Math.PI * 2.0, h);
  for (const t of tablesPos){
    const x = c.x + t.x, y = c.y + t.y, tw = 46 * U, th = 24 * U;
    cx.fillStyle = C.sh; cx.beginPath(); cx.ellipse(x + 5, y + 6, tw, th, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = C.ink; cx.beginPath(); cx.ellipse(x, y + 5 * U, tw, th, 0, 0, Math.PI * 2); cx.fill();
    cx.fillStyle = closed ? C.wallD : C.ink; cx.strokeStyle = C.bg; cx.lineWidth = 1.2;
    cx.beginPath(); cx.ellipse(x, y, tw, th, 0, 0, Math.PI * 2); cx.fill(); cx.beginPath(); cx.ellipse(x, y, tw * .78, th * .7, 0, 0, Math.PI * 2); cx.stroke();
  }
  const running = S && !S.paused && !S.over;
  if (running && isOpen()){
    const visitRate = (S.last.guests || S.tables * 4) / 18;
    if (Math.random() < dt * visitRate * S.speed) spawnPerson(true);
    if (Math.random() < dt * (0.6 + S.loc.tsuboRent * 0.5) * S.speed) spawnPerson(false);
    // 口論（信頼・居心地が低いと卓で「!」）
    const tension = Math.max(0, 45 - Math.min(S.ind.trust, S.ind.comfort)) / 45;
    if (tablesPos.length && Math.random() < dt * tension * 0.8 * S.speed){ const t = tablesPos[Math.floor(Math.random() * tablesPos.length)]; bubbles.push({ x: c.x + t.x, y: c.y + t.y - 40 * U, t: 0 }); }
  }
  people.sort((a, b) => a.y - b.y);
  const staffSpeed = S ? 1 + (100 - S.ind.slack) / 40 : 1;
  for (const p of people){
    if (running){
      const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
      if (p.state === "walk"){
        if (d < 3){
          if (p.toShop && !p.turnBack){ p.state = "sit"; p.t = 0; pops.push({ x: p.x, y: p.y - 50 * U, t: 0, v: Math.round(S.loc.spend * S.price * (S.illegal.cashout && !stopped("cashout") ? 5 : 1) * 10000) }); }
          else if (p.turnBack){ p.turnBack = false; p.toShop = false; p.state = "walk"; const b = Math.random() * Math.PI * 2; p.tx = c.x + Math.cos(b) * RR * 1.5; p.ty = c.y + Math.sin(b) * RR; bubbles.push({ x: p.x, y: p.y - 50 * U, t: 0, text: "…" }); }
          else p.dead = true;
        } else { const s = p.sp * dt * S.speed; p.x += dx / d * s; p.y += dy / d * s; p.ph += dt * 10 * S.speed; }
      } else { p.t += dt * S.speed; if (p.t > 5) p.dead = true; }
    }
    figure(p.x, p.y, U * 1.15, p.ph, p.state === "walk", false);
  }
  people = people.filter((p) => !p.dead).slice(-160);
  // スタッフ（白抜き・腕章）：余力が低いと速く動き回る
  if (S && isOpen()){
    const n = Math.max(1, Math.round(S.tables * 0.6)), tt = performance.now() / 1000 * staffSpeed;
    for (let i = 0; i < n; i++){ const a = tt * 0.6 + i * 2.1, rr = r * 0.82; figure(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr * k, U * 1.0, tt * 8 + i, true, true); }
  }
  for (const q of police){
    const dx = q.tx - q.x, dy = q.ty - q.y, d = Math.hypot(dx, dy);
    if (d > 3){ const s = 80 * U / 30; q.x += dx / d * s; q.y += dy / d * s; q.ph += .2; } else q.t += 1 / 60;
    figure(q.x, q.y, U * 1.25, q.ph, d > 3, true); cx.fillStyle = C.ink; cx.fillRect(q.x - 7 * U * 1.25, q.y - 39 * U * 1.25, 14 * U * 1.25, 4 * U * 1.25);
  }
  police = police.filter((q) => q.t < 3);
  wallArc(c, r, Math.PI * 0.05, Math.PI * 0.42, h); wallArc(c, r, Math.PI * 0.62, Math.PI * 0.95, h);
  // 違法リスクの点線（店の周り）と状態ピル
  if (S){
    const rk = risks(), hz = Math.min(1, (rk.arrest + rk.order) / 0.3);
    if (hz > 0){ cx.save(); cx.setLineDash([4, 4]); cx.strokeStyle = C.danger; cx.lineWidth = 2; cx.beginPath(); cx.ellipse(c.x, c.y - h, r * 0.92, r * 0.92 * k, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.03, hz)); cx.stroke(); cx.restore(); }
    const label = !isOpen() ? `許可待ち あと${S.licenseWait}か月` : `${S.tables}卓 : 満席率 ${Math.round((S.last.occ || 0) * 100)}%`;
    cx.font = `600 15px ${C.font}`; const tw = cx.measureText(label).width + 26, ly = c.y - r * k - h - 18;
    cx.fillStyle = C.ink; cx.beginPath(); cx.roundRect(c.x - tw / 2, ly - 15, tw, 30, 9); cx.fill();
    cx.fillStyle = C.bg; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText(label, c.x, ly + 1); cx.textAlign = "start"; cx.textBaseline = "alphabetic";
  }
  for (const b of bubbles){
    b.t += dt; const a = Math.max(0, 1 - b.t / 1.5); cx.globalAlpha = a;
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.arc(b.x, b.y - b.t * 10, 11, 0, Math.PI * 2); cx.fill(); cx.stroke();
    cx.fillStyle = b.text ? C.ink : C.danger; cx.font = `700 13px ${C.font}`; cx.textAlign = "center"; cx.fillText(b.text || "!", b.x, b.y - b.t * 10 + 5); cx.textAlign = "start"; cx.globalAlpha = 1;
  }
  bubbles = bubbles.filter((b) => b.t < 1.5);
  for (const p of pops){
    p.t += dt; const a = Math.max(0, 1 - p.t / 1.6); if (!a) continue;
    cx.globalAlpha = a; const txt = `+${p.v.toLocaleString("ja-JP")}円`;
    cx.font = `13px ${C.font}`; const w = cx.measureText(txt).width + 30, y = p.y - p.t * 20;
    cx.fillStyle = C.bg; cx.strokeStyle = C.ink; cx.lineWidth = 1.5; cx.beginPath(); cx.roundRect(p.x - w / 2, y - 12, w, 24, 8); cx.fill(); cx.stroke();
    cx.beginPath(); cx.arc(p.x - w / 2 + 12, y, 4, 0, Math.PI * 2); cx.lineWidth = 2.5; cx.stroke();
    cx.fillStyle = C.ink; cx.fillText(txt, p.x - w / 2 + 20, y + 4.5); cx.globalAlpha = 1;
  }
  pops = pops.filter((p) => p.t < 1.6);
}

/* ---------- ループ ---------- */
let lastT = performance.now(), hudT = 0;
const SPM = TEST ? 0.02 : M.secondsPerMonth;
function frame(now){
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (S && !S.paused && !S.over){
    S.monthT += dt * S.speed / SPM;
    while (S.monthT >= 1 && !S.over && !S.paused){ S.monthT -= 1; monthTick(); }
  }
  draw(dt);
  hudT += dt; if (hudT > 0.15){ hudT = 0; syncHUD(); }
  requestAnimationFrame(frame);
}
window.__shop = { state: () => S, cfg: CFG, start: (cfg) => { Object.assign(CFG, cfg); S = newState({ ...CFG }); hide(); resetScene(); } };
readColors(); resize(); syncHUD(); openTitle(); requestAnimationFrame(frame);
})();
</script>
