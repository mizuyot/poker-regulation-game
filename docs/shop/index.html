<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー屋をつくろう！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#1a1a1a; --soft:#dedede; --soft2:#f1f1f1;
  --wall:#ececec; --wall-dark:#c9c9c9; --shadow:rgba(0,0,0,.13); --panel:#ffffff; --gray:#8a8a8a;
  --danger:#b3261e; --good:#2e6b45;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
    --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6; --black-hud-edge:#767676;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
  --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6; --black-hud-edge:#767676;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#branchView{position:fixed;z-index:1;pointer-events:none}
/* 上部：時間・営業実績・資金 */
.progress-top{position:fixed;inset:14px 0 auto;display:grid;justify-items:center;gap:10px;z-index:2;pointer-events:none}
.time{width:min(560px,calc(100vw - 600px));min-width:320px;text-align:center;background:color-mix(in srgb,var(--bg) 82%,transparent);border-radius:12px;padding:4px 8px 6px;pointer-events:auto}
.tdate{display:flex;align-items:baseline;justify-content:center;gap:12px}
.tdate b{font-size:22px;font-weight:700}
.tdate .m{font-size:16px}
.tdate .clock{font-family:var(--mono);font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:0 6px}
.tdate .clock.closed{color:var(--muted);border-color:var(--soft)}
.tbar{display:flex;gap:1px;margin-top:6px;height:12px}
.tbar .y{display:flex;gap:1px;flex:1}
.tbar .y + .y{margin-left:5px}
.tbar i{flex:1;background:var(--soft2);border:1px solid var(--soft);border-radius:2px;position:relative;overflow:hidden}
.tbar i.past{background:var(--gray);border-color:var(--gray)}
.tbar i.now{border-color:var(--ink)}
.tbar i.now b{position:absolute;left:0;top:0;bottom:0;background:var(--gray)}
.tlabels{position:relative;height:16px;font-size:10.5px;color:var(--muted);margin-top:2px}
.tlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.time-controls{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px 16px;margin:3px 4px 0;font-size:12px;line-height:1.4;color:var(--muted)}
.playback-control{display:flex;align-items:center;gap:8px;white-space:nowrap}
.playback-control[hidden]{display:none}
.playback-options{display:flex}
.playback-options button{position:relative;isolation:isolate;min-width:44px;min-height:44px;padding:0 6px;border:0;background:none;color:var(--ink);font-size:inherit;line-height:1.1;cursor:pointer}
.playback-options button::before{content:"";position:absolute;inset:7px 0;z-index:-1;border:1px solid var(--soft);border-right:0;background:var(--bg)}
.playback-options button:last-child::before{border-right:1px solid var(--soft)}
.playback-options button[aria-pressed="true"]{background:none;color:var(--bg);font-weight:700}
.playback-options button[aria-pressed="true"]::before{background:var(--ink);border-color:var(--ink)}
.playback-options button:disabled{opacity:.55;cursor:default}
.playback-options button:focus-visible{z-index:1;outline:2px solid var(--ink);outline-offset:2px}

.shop-hud{width:min(640px,calc(100% - 48px));border:4px solid var(--style-color,var(--ink));background:var(--panel);padding:4px 14px 6px;font-size:12px;line-height:1.3;pointer-events:auto}
.shop-hud[data-tier="black"]{outline:1px solid var(--black-hud-edge,transparent)}
.shop-hud-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:3px;margin-bottom:2px;border-bottom:1px solid var(--soft)}
.shop-hud-head h2{margin:0;color:var(--muted);font-size:inherit;font-weight:400;white-space:nowrap}
.shop-hud-style{font-weight:700;text-align:right}
.shop-hud-main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}
.shop-hud dl{margin:0}
.shop-hud dt{color:var(--muted)}
.shop-hud dd{margin:0;white-space:nowrap}
.shop-hud-stats{display:flex;gap:14px}
.shop-hud-stats dd,.money{font-size:22px;line-height:1.2;font-weight:700}
.shop-hud small{font-size:12px;font-weight:400}
.shop-hud-stats small{color:var(--muted)}
.hud{text-align:right}
.money.neg,.flow-legend dd.neg{color:var(--danger)}
.hud-secondary{display:flex;justify-content:flex-end;gap:5px;margin-top:2px}
.hud-secondary[hidden]{display:none}

/* 月別収支：売上・経費の棒に税引前利益の折れ線を重ねる */
.flow{--plot-height:112px;position:fixed;inset:auto max(24px,4vw) 16px;margin-inline:auto;max-width:1440px;background:var(--bg);border-top:1px solid var(--soft);padding-top:8px;z-index:2}
.flow-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.flow-head h2{margin:0;font-size:18px;color:var(--ink)}
.flow-month{margin-left:auto;color:var(--ink);white-space:nowrap}
.flow-chart{--zero:.5;display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.flow-axis{position:relative;height:var(--plot-height);font-size:11px;text-align:right;color:var(--muted)}
.flow-axis span{position:absolute;right:0;transform:translateY(-50%)}
.flow-axis .top{top:0;transform:none}
.flow-axis .zero{top:calc(var(--plot-height) * var(--zero))}
.flow-axis .bottom{bottom:0;transform:none}
.flow-plot{position:relative;min-width:0;--trend-padding:5px}
.flow-trend{position:absolute;top:calc(1px - var(--trend-padding));left:0;width:100%;height:calc(var(--plot-height) + 2 * var(--trend-padding));z-index:2;pointer-events:none}
.flow-track{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));border-top:1px solid var(--soft)}
.flow-track::before{content:"";position:absolute;z-index:1;top:calc(var(--plot-height) * var(--zero));left:0;right:0;border-top:1px solid var(--muted);pointer-events:none}
.flow-slot{position:relative;min-width:0}
.flow-bar{display:block;position:relative;width:100%;height:var(--plot-height);padding:0;border:0;background:transparent;cursor:pointer}
.flow-bar[aria-pressed="true"]{background:var(--soft2)}
.flow-bar:focus-visible{outline:1px solid var(--ink);outline-offset:-2px}
.flow-bar span{position:absolute;left:18%;width:64%;background:var(--series)}
.flow-sales{--series:var(--good)}
.flow-varCost{--series:color-mix(in srgb,var(--ink) 26%,var(--bg))}
.flow-rent{--series:color-mix(in srgb,var(--ink) 46%,var(--bg))}
.flow-staff{--series:color-mix(in srgb,var(--ink) 68%,var(--bg))}
.flow-other{--series:color-mix(in srgb,var(--ink) 86%,var(--bg))}
.flow-net{--series:var(--ink)}
.flow-tick{display:block;height:17px;font-size:11px;line-height:17px;color:var(--muted);white-space:nowrap}
.flow-tick span{position:absolute;left:3px}
.flow-slot:nth-child(12) .flow-tick span{left:auto;right:0}
.flow-empty{grid-column:1/-1;display:grid;place-items:center;height:calc(var(--plot-height) + 18px);margin:0;background:var(--soft2);font-size:13px;color:var(--muted)}
.flow-chart.empty .flow-axis,.flow-chart.empty .flow-plot,.flow-empty[hidden]{display:none}
.flow-legacy{margin:6px 0 0;color:var(--muted);font-size:12px}
.flow-legend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px 8px;min-height:40px;margin:4px 0 0;padding-top:4px;border-top:1px solid var(--soft);font-size:12px}
.flow-legend dt{display:flex;align-items:center;gap:4px;color:var(--muted)}
.flow-legend dt::before{content:"";flex:none;width:8px;height:8px;background:var(--series)}
.flow-legend .flow-net dt{color:var(--ink);font-weight:700}
.flow-legend .flow-net dt::before{height:2px}
.flow-legend dd{margin:0 0 0 12px;white-space:nowrap}
.flow-legend .flow-net dd{font-weight:700}
.toast{position:fixed;top:var(--toast-top,120px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:min(520px,calc(100vw - 32px));z-index:2}
.toast div.bad{border-color:var(--danger);color:var(--danger)}
.toast div.good{border-color:var(--good);color:var(--good)}
.toast div{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px 10px;font-size:13px;animation:fade 4.5s forwards;text-align:center}
.enforcement-frame{
  --warning-red:#ff645b;position:fixed;inset:0;z-index:20;
  display:grid;place-items:center;padding:16px;cursor:pointer;overflow:auto;overscroll-behavior:contain;
  border:clamp(8px,1.8vw,18px) solid var(--warning-red);background:rgba(15,9,9,.78);color:#fff;
}
.enforcement-frame[hidden]{display:none}
.enforcement-headline{
  display:grid;gap:12px;width:min(640px,100%);padding:clamp(20px,5vw,40px) 4px;
  border-block:1px solid var(--warning-red);text-align:center;
  animation:enforcement-appear .3s ease-out both;
}
.enforcement-headline strong{color:var(--warning-red);font-size:clamp(46px,13vw,112px);line-height:1.08;letter-spacing:.05em}
.enforcement-frame[data-kind="order"] .enforcement-headline strong{font-size:clamp(28px,10vw,76px)}
.enforcement-headline span{font-size:clamp(14px,2.6vw,20px);line-height:1.6}
.enforcement-offenses{font-weight:700;overflow-wrap:anywhere}
.enforcement-continue{justify-self:center;min-height:44px;padding:8px 22px;border:2px solid var(--warning-red);background:#210e0e;color:#fff;font-weight:700;cursor:pointer}
.enforcement-continue:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes enforcement-appear{from{opacity:.5;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enforcement-headline{animation:none}}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* 画面（モーダル） */
.ov{
  position:fixed;inset:0;max-height:100dvh;z-index:10;
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  display:none;grid-template:minmax(0,1fr) / minmax(0,1fr);place-items:center;
  padding:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px))
    calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));
  overflow:hidden;
}
.ov.show{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;width:min(740px,100%);min-height:0;max-height:100%;overflow:auto;overscroll-behavior:contain;box-shadow:6px 8px 0 var(--shadow)}
/* 長いカードでも、先へ進むボタンは常に見えるようにする */
.card .row.stick{position:sticky;bottom:-18px;margin:12px -22px -18px;padding:10px 22px 14px;background:var(--panel);border-top:1.5px solid var(--line);z-index:2}
.card h1{font-size:23px;font-weight:700;margin:0 0 6px}
.card h2{font-size:13px;font-weight:700;margin:18px 0 8px;letter-spacing:.06em}
.card p{margin:6px 0;font-size:14px;line-height:1.75}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opt small,.opt b{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
/* 内装は配置図の横幅で3段階を比較する */
.opts[data-k="interior"]{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.opts[data-k="interior"] .opt{min-height:48px;padding:6px 2px;border:1px solid #e0e0e0;border-radius:0;text-align:center;transition:none}
.opts[data-k="interior"] .opt[aria-pressed="true"]{box-shadow:inset 0 -2px var(--ink);transform:none;border-color:var(--ink)}
.opts[data-k="interior"] .opt[aria-pressed="true"]::before{content:none}
.opts[data-k="interior"] .opt small{font-size:12px}
.opts[data-k="edu"]{grid-template-columns:1fr}
.opts[data-k="edu"] .opt{display:grid;grid-template-columns:8.5em 1fr;column-gap:14px;align-items:center;padding:10px 14px}
.opts[data-k="edu"] .opt b{margin:0;font-size:15px}
.roomPreview{margin:8px 0 0;border-bottom:1px solid var(--soft)}
.roomPreview canvas{display:block;width:100%;height:clamp(152px,46vw,310px)}
.roomPreview figcaption{padding:0 0 8px;color:var(--muted);font-size:12px;line-height:1.6}
.setup-disclosure summary{padding:4px 0}
.opts[data-k="loc"]{margin-top:12px}
.location-costs,.valuation-comps{overflow-x:auto}
.location-costs th,.location-costs td{white-space:nowrap}
.setup-finances{display:grid;gap:16px;margin-top:24px;min-width:0}
.setup-finance,.setup-outlook{min-width:0;padding:12px;border:1px solid var(--soft)}
.setup-finances h2{margin:0 0 8px;font-size:18px;letter-spacing:.02em}
.setup-outlook{background:var(--soft2)}
.setup-outlook dl{margin:0;font-size:13px}
.setup-outlook dl div{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;padding:8px 0;border-top:1px solid var(--soft)}
.setup-outlook dd{margin:0;white-space:nowrap}
@media (max-width:520px){.opts[data-k="edu"] .opt{grid-template-columns:1fr}}
.opt{--opt-radius:12px;position:relative;border:1.5px solid var(--soft);border-radius:var(--opt-radius);padding:10px 12px;background:var(--bg);text-align:left;cursor:pointer;font-size:13px;line-height:1.55;transition:box-shadow .1s,transform .1s}
.opt:hover{border-color:var(--line)}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt small{color:var(--muted);display:block}
.opt[aria-pressed="true"]{border:2.5px solid var(--ink);box-shadow:4px 5px 0 var(--ink);transform:translate(-2px,-2px)}
.opt[aria-pressed="true"]::before{content:"✓";position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.opts[data-k="manager"]{grid-template-columns:1fr;margin:0;gap:7px}
.opts[data-k="manager"] .opt{padding:5px 10px;min-height:50px}
.opts[data-k="manager"] .opt[aria-pressed="true"]{border-width:1.5px;outline:1px solid var(--ink);transform:none;z-index:1}
.manager-card-head{display:flex;justify-content:space-between;align-items:baseline;gap:0 8px;flex-wrap:wrap}
.manager-card-head .manager-name,.manager-current-name{font-size:18px;line-height:1.4}
.manager-card-head .manager-name{margin:0}
.manager-card-head span{font-size:11px;font-weight:700;white-space:nowrap}
.manager-card-summary{font-size:11.5px;line-height:1.45}
.manager-card-summary strong{color:var(--ink)}
.manager-card-risk{display:block;margin-top:2px;color:var(--ink);font-size:11.5px;line-height:1.4;font-weight:700}
.monthly-forecast{margin:14px 0;padding:10px 12px;background:var(--soft2)}
.card .monthly-forecast h3{margin:0 0 3px;font-size:15px;letter-spacing:0}
.card .monthly-forecast p{margin:3px 0 0;font-size:12px}
.monthly-forecast th[scope="row"]{font-weight:400;text-align:left}
.monthly-forecast td,.monthly-forecast th:not([scope="row"]){text-align:right;white-space:nowrap}
.style-rule-details{margin:0 0 8px;padding:0;border:0}
.style-rule-details summary{padding:4px 0;color:var(--ink);font-weight:700}
.style-rules{margin:8px 0 16px;padding-inline-start:1.25em;font-size:13px;line-height:1.65;color:var(--muted)}
.style-rules > li + li{margin-top:4px}
:is(.tsw,.route,.style-choice).black,.shop-hud[data-tier="black"]{--style-color:#111}
:is(.tsw,.route,.style-choice).gray,.shop-hud[data-tier="gray"]{--style-color:#9a9a9a}
:is(.tsw,.route,.style-choice).clean,.shop-hud[data-tier="clean"]{--style-color:var(--good)}
.tsw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;background:var(--style-color)}
.stylelist{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:1fr;
  --ink:#111;--bg:#fff;--good:#2e6b45;--muted:#6b6b6b}
.stylelist .opt{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;align-items:start;gap:0;
  padding:0;border:1px solid #dedede;background:var(--bg);color:var(--ink);transition:none;overflow:visible}
.style-choice-heading{display:block;padding:4px 10px;background:var(--style-color);color:#fff;
  border-radius:calc(var(--opt-radius) - 1px) calc(var(--opt-radius) - 1px) 0 0}
.style-choice-heading b{margin:0;line-height:1.4}
.style-effect{max-width:100%;overflow-wrap:anywhere}
.stylelist .opt[aria-pressed="true"]{border-color:var(--ink);outline:1px solid var(--ink);transform:none}
.stylelist .opt[aria-pressed="true"]::before{left:-17px}
.stylelist .opt:focus-visible{outline:2px solid var(--line);outline-offset:2px}
/* 営業スタイル選択の比較と発覚条件 */
.style-comparison{--rate-columns:minmax(0,1fr) 3.65rem 4.25rem}
.card .style-comparison-key{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 8px;margin:9px 0 3px;font-size:12px;color:var(--muted)}
.style-comparison-key strong{font-size:14px;color:var(--ink)}
.style-comparison-columns{display:grid;grid-template-columns:var(--rate-columns);gap:6px;margin-bottom:4px;padding:0 10px;color:var(--muted);font-size:11px;line-height:1.45}
.style-comparison-columns span:nth-child(n+2){text-align:right;white-space:nowrap}
.stylelist .style-choice.gray{--style-color:#666}
.style-list-metrics{display:grid;grid-template-columns:var(--rate-columns);column-gap:6px;align-content:center;align-items:center;min-height:34px;padding:5px 9px;line-height:1.4}
.style-list-effects{display:flex;flex-wrap:wrap;gap:1px 6px;text-align:left;font-size:11.5px;color:#3d3d3d}
.style-list-rate{text-align:right;white-space:nowrap;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.style-rate-context{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.style-enforcement{margin-top:16px;border:1px solid var(--soft);border-radius:10px;background:var(--soft2);padding:11px 12px}
.card .style-enforcement > h2{margin:0 0 5px;font-size:16px;letter-spacing:0;line-height:1.5}
.style-enforcement-rule{border-top:1px solid var(--soft);padding:7px 0}
.style-enforcement-chip{display:inline-flex;align-items:center;margin:0;padding:2px 9px;border-radius:999px;background:#b3261e;color:#fff;font-size:12px;line-height:1.4}
.card .style-enforcement-rule p,.card .style-enforcement .style-enforcement-note{margin:2px 0 0;font-size:12px;line-height:1.55;color:var(--muted)}
.style-enforcement-effects{display:grid;row-gap:2px;margin:4px 0 0;font-size:12px;line-height:1.55}
.style-enforcement-effects > div{display:grid;grid-template-columns:3.25em minmax(0,1fr);column-gap:7px}
.style-enforcement-effects dt{font-weight:700}
.style-enforcement-effects dd{margin:0}
.style-game-end{color:var(--danger)}
.card .style-enforcement .style-enforcement-note{border-top:1px solid var(--soft);padding-top:7px;margin-top:0}
.style-comparison-details{margin-top:8px;margin-bottom:0}
.style-comparison-details summary{font-size:13px}
.card .style-comparison-actions{display:grid;grid-template-columns:auto minmax(0,340px);margin-top:12px}
.style-comparison-actions .btn{min-height:48px;padding-inline:16px}
@media (max-width:350px){.style-comparison{--rate-columns:minmax(0,1fr) 3.3rem 3.85rem}.style-comparison-columns{padding-inline:7px;font-size:10px}.style-list-metrics{padding-inline:6px}.style-list-effects,.style-list-rate{font-size:11px}}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
.stepper output{font-size:28px;min-width:2ch;text-align:center;font-family:var(--mono)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);border-radius:999px;padding:9px 20px;background:var(--bg);cursor:pointer;font-size:14px}
.btn.primary{border-width:3px;font-weight:700;box-shadow:3px 4px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
table.t td,table.t th{border-bottom:1px solid var(--soft);padding:5px 6px;text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td:not(:first-child){font-family:var(--mono)}
table.t tr.total td{font-weight:700;border-top:1.5px solid var(--line)}
details{border-top:1px solid var(--soft);margin-top:10px;padding-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.prov{margin:8px 0;padding:8px 10px;border-left:2px solid var(--line);font-size:12.5px;line-height:1.7}
.prov a{color:inherit}
.result-overview{--result-score-bg:#f7f7f7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .result-overview{--result-score-bg:var(--soft2)}}
:root[data-theme="dark"] .result-overview{--result-score-bg:var(--soft2)}
.result-heading{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 12px}
.card .result-heading h1{margin:0}
.result-period{font-size:13px;font-weight:700}
.result-context{font-size:12px;color:var(--muted);line-height:1.5}
.result-metrics{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:6px 12px;margin-top:14px}
.result-amount strong{display:block;margin-top:2px;font-size:clamp(26px,8vw,42px);line-height:1.12;overflow-wrap:anywhere}
.result-deviation{min-width:84px;padding:6px 10px;background:var(--result-score-bg);text-align:right}
.card .result-deviation h2{margin:0;font-size:12px;letter-spacing:0}
.result-deviation strong{display:block;font-size:clamp(24px,7vw,36px);line-height:1.15}
.result-gain{grid-column:1/-1;font-size:13px}
.result-overview .result-breakdown{margin-top:8px}
.result-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.result-actions .btn{min-height:48px;border:1px solid var(--line);border-radius:0;box-shadow:none;padding:8px;font-weight:700}
.result-actions .primary{background:var(--ink);color:var(--bg)}
.result-review{margin:14px 0 12px;padding-top:0}
.result-review > summary{padding:12px 0;color:var(--ink);font-size:15px;font-weight:700}
.result-review-facts{display:grid;gap:4px;margin-bottom:12px;color:var(--muted)}
.result-type{padding:10px 0 12px;border-top:1px solid var(--soft);border-bottom:1px solid var(--soft)}
.card .result-type h2{margin:2px 0;font-size:18px}
.card .result-type p{margin:0;font-size:13px}
.card .result-type .muted{margin-top:4px;font-size:12px}
.result-milestones ol{list-style:none;padding:0;margin:0;border-bottom:1px solid var(--soft)}
.result-milestones li{display:grid;grid-template-columns:minmax(78px,27%) minmax(0,1fr);gap:12px;border-top:1px solid var(--soft);padding:10px 0}
.result-milestones .milestone-date{font-size:13px;line-height:1.5}
.result-milestones strong{display:block;font-size:15px}
.result-milestones .milestone-detail{font-size:13px;color:var(--muted)}
.timeline{font-size:12.5px;line-height:1.8;max-height:200px;overflow:auto;border:1px solid var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.slider{display:grid;grid-template-columns:4.5em 1fr 4.5em;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.slider input{width:100%;accent-color:var(--gray)}
.slider.price{grid-template-columns:4.2em 1fr 4.2em;line-height:1.25;font-size:12px}
.fineBox{border:3px solid var(--danger);border-radius:14px;padding:12px 14px;margin:12px 0 4px;background:color-mix(in srgb,var(--danger) 7%,transparent)}
.fineAmt{font-family:var(--mono);font-size:clamp(30px,5vw,44px);font-weight:700;color:var(--danger);line-height:1.1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media (max-width:720px){.grid3{grid-template-columns:1fr}}
.rec{display:inline-block;background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:700;padding:0 6px;border-radius:4px;vertical-align:1px}
.pcbox{border:1.5px solid var(--soft);border-radius:12px;padding:8px 10px 6px;margin:6px 0 4px}
.pchart{width:100%;height:auto;display:block;overflow:visible}
.pchart .pc-t{font-size:12px;fill:var(--ink);font-weight:700}.pchart .pc-a{font-size:10.5px;fill:var(--muted)}
.pchart .pc-g{stroke:var(--soft);stroke-width:1}.pchart .pc-z{stroke:var(--muted);stroke-width:1}
.pchart .pc-r{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}.pchart .pc-c{stroke:var(--ink);stroke-width:1}
.pchart .pc-l{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}.pchart .pc-d{fill:var(--ink);stroke:var(--panel);stroke-width:2}
.pc-x{display:grid;grid-template-columns:1fr auto 1fr;font-size:11px;color:var(--muted);padding-left:54px}.pc-x span:last-child{text-align:right}
.pc-read{font-size:12.5px;margin:4px 0 2px;font-family:var(--mono)}
.pticks{display:grid;grid-template-columns:1fr auto 1fr;font-size:11px;color:var(--muted);margin:-2px 4.6em 4px}.pticks span:nth-child(2){color:var(--ink);font-weight:700}.pticks span:last-child{text-align:right}
/* 営業時間ゲージ（1本・つまみ2つ） */
.gauge{position:relative;height:46px;margin:26px 4px 26px;user-select:none;touch-action:none}
.gauge .track{position:absolute;left:0;right:0;top:14px;height:18px;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ink)}
.gauge .range{position:absolute;top:14px;height:18px;border:2.5px solid var(--ink);border-radius:9px;background:color-mix(in srgb,var(--ink) 8%,transparent);pointer-events:none}
.gauge .legal{position:absolute;top:6px;height:34px;border-left:2px dashed var(--danger)}
.gauge .legal span{position:absolute;top:44px;left:-2px;transform:translateX(-50%);font-size:10px;color:var(--danger);white-space:nowrap}
.gauge .h{position:absolute;top:8px;width:22px;height:30px;margin-left:-11px;border:2px solid var(--line);border-radius:7px;background:var(--bg);cursor:grab;box-shadow:2px 3px 0 var(--shadow);display:grid;place-items:center;font-size:9px}
.gauge .h:focus{outline:2px solid var(--ink);outline-offset:2px}
.gauge .tick{position:absolute;top:36px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-family:var(--mono)}
.gauge .lbl{position:absolute;top:-18px;font-size:11px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-weight:500}
.warn{color:var(--danger);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.grid2 span:nth-child(even){text-align:right;font-family:var(--mono)}
.rank{display:grid;gap:5px;list-style:none;margin:0;padding:0}
.rank li{padding:7px 9px 7px 12px}
:is(.rank li,.rank-receipt){background:var(--rank-tint,var(--soft2));box-shadow:inset 5px 0 0 var(--rank-edge,var(--soft))}
:is(.rank li,.rank-receipt)[data-rank-tier="clean"]{--rank-edge:var(--good);--rank-tint:color-mix(in srgb,var(--good) 7%,var(--panel))}
:is(.rank li,.rank-receipt)[data-rank-tier="gray"]{--rank-edge:#696d70;--rank-tint:color-mix(in srgb,var(--gray) 7%,var(--panel))}
:is(.rank li,.rank-receipt)[data-rank-tier="black"]{--rank-edge:var(--line);--rank-tint:color-mix(in srgb,var(--ink) 8%,var(--panel))}
.rank-line{display:flex;justify-content:space-between;align-items:baseline;gap:3px 10px;flex-wrap:wrap}
.rank-place,.rank-amount{font-size:17px;line-height:1.35}
.rank-this-run{margin-inline-start:5px;font-size:11px;font-weight:700}
.rank-meta{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.45}
.rank-style-description{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rank-history{display:flex;align-items:baseline;flex-wrap:wrap;gap:3px 8px;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.45}
.rank-history-periods{display:inline-flex;flex-wrap:wrap;align-items:center;gap:3px 8px;min-width:0}
.rank-history-period{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.rank-history-period .tsw{width:9px;height:9px;border:1px solid var(--muted);border-radius:2px;flex:none}
.result-score{margin-top:10px;padding:12px 16px;background:var(--result-score-bg);color:var(--ink)}
.result-score h2,.score-rank h2{font-size:18px;letter-spacing:.02em}
.score-heading{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .score-heading h2{margin:0}
.score-benchmark figure{margin:4px 0 0}
.score-meta,.score-benchmark figcaption{font-size:12px;color:var(--muted)}
.score-axis-info{display:flex;justify-content:space-between;gap:8px}
.score-plot,.score-ticks{margin-left:26px}
.score-plot{position:relative;height:122px;margin-top:19px}
.score-guide{position:absolute;inset:auto 0 var(--y);height:1px;background:var(--soft)}
.score-guide span{position:absolute;right:calc(100% + 7px);top:0;transform:translateY(-50%);color:var(--muted);font-size:11px}
.score-bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--bins),minmax(0,1fr));align-items:end}
.score-bars span{height:var(--height);padding-inline-end:2px;background:var(--gray);background-clip:content-box}
.score-bars span:last-child{padding-inline-end:0}
.score-marker{position:absolute;inset:0 auto 0 var(--marker);width:2px;transform:translateX(-50%);background:var(--ink)}
.score-marker-label{position:absolute;bottom:100%;left:clamp(11px,var(--marker),calc(100% - 11px));transform:translateX(-50%);font-size:11px;font-weight:700;white-space:nowrap}
.score-ticks{position:relative;height:16px;margin-top:6px;color:var(--muted);font-size:11px}
.score-ticks span{position:absolute;left:var(--x);transform:translateX(-50%);white-space:nowrap}
.score-ticks span:first-child{transform:none}
.score-ticks span:last-child{transform:translateX(-100%)}
.score-unit{text-align:right}
.score-benchmark figcaption{margin-top:3px;line-height:1.45}
.result-score details{margin-top:6px;padding-top:4px}
@media (max-width:540px){
  .result-metrics{margin-top:10px}
  .result-score{padding:10px 12px}
  .score-heading h2{font-size:15px;line-height:1.3}
  .score-plot{height:clamp(68px,11vh,92px);margin-top:14px}
}
@media (max-width:640px){.score-ticks span:nth-child(even):not(:last-child){display:none}}
.score-rank{margin-bottom:24px}
.score-rank h3{font-size:15px;margin:12px 0 4px}
.score-rank li{overflow-wrap:anywhere}
.score-rank summary{min-height:32px}
.rank-receipt{margin:4px 0 10px;padding:9px 11px 9px 14px}
.rank-receipt header,.rank-receipt-line{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.rank-receipt header span,.rank-receipt-line span{color:var(--muted);font-size:12px}
.rank-receipt-line{margin-top:4px}
.rank-position{font-size:25px}
.rank-receipt-amount{text-align:right}
.rank-submit label{display:grid;gap:4px;font-size:12px}
.rank-submit input,.rank-submit button{min-height:48px;padding:8px 16px;border:1px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.rank-submit button{border-radius:0;cursor:pointer}
.rank-submit button:disabled{opacity:.4;cursor:default}
/* タイトル画面 */
.card.titlecard{padding:24px clamp(20px,6vw,48px);width:min(840px,100%)}
.title-guide{font-family:"Helvetica Neue","Noto Sans JP","Hiragino Sans",sans-serif}
.card .guide-intro h1{font-size:clamp(20px,6.5vw,36px);line-height:1.4;letter-spacing:.015em;margin:0;white-space:nowrap}
.card .guide-intro .guide-lead{margin:10px 0 0;font-size:15px;line-height:1.65}
.guide-flow{margin-top:18px}
.card .guide-flow h2{font-size:18px;letter-spacing:.02em;line-height:1.5;margin:0 0 8px}
.guide-steps{margin:0;padding:0;list-style:none;counter-reset:guide-step}

.guide-steps summary{display:grid;grid-template-columns:26px minmax(0,1fr) 12px;align-items:center;column-gap:10px;min-height:44px;padding:7px 2px 7px 0;color:var(--ink);list-style:none}
.guide-steps summary::-webkit-details-marker{display:none}
.guide-steps summary::before{content:counter(guide-step);display:grid;place-items:center;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;font:700 13px/1 var(--mono)}
.guide-steps summary::after{content:"";width:6px;height:6px;border-right:1.5px solid;border-bottom:1.5px solid;justify-self:center;transform:rotate(45deg)}
.guide-steps details[open] > summary::after{transform:rotate(225deg)}
.guide-step-body{padding:0 0 8px 36px}

.card .guide-steps p{margin:2px 0 0;font-size:14px;line-height:1.6}

.guide-styles{margin-top:14px}

.guide-routes{display:grid;gap:6px;grid-auto-rows:1fr;--route-columns:104px minmax(0,1fr);--route-gap:8px;--route-padding:6px 9px}
.guide-routes .route,.guide-routes .style-choice-heading{display:grid;min-width:0;grid-template-columns:var(--route-columns);
  align-items:center;align-content:center;gap:var(--route-gap);padding:var(--route-padding)}

  border:3px solid var(--style-color);border-radius:7px;background:var(--style-color);color:#fff;text-align:left}

.card .guide-routes .who{margin:0;font-size:13px;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.card .guide-routes .ds{margin:0;font-size:12px;line-height:1.45}
.stylelist.guide-routes .route{grid-template-columns:minmax(0,1fr);gap:0;padding:0}
.guide-routes .style-choice-heading{background:transparent}

@media (min-width:690px){

.card .guide-risk{margin:16px 0 0;padding:8px 10px;border-left:2px solid var(--line);background:var(--soft2);font-size:12.5px;line-height:1.65}
.guide-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-top:16px}
.guide-actions .btn{min-height:48px;width:100%;text-align:center}

.guide-room{margin:0}
.guide-room canvas{display:block;width:100%;height:176px}

.card .guide-best{font-size:13px}
@media (min-width:690px){
  .guide-flow{margin-top:32px}

.annual-accounts{margin-top:12px}
.annual-accounts + .annual-accounts,.annual-sale{border-top:1px solid var(--soft);margin-top:12px;padding-top:12px}

.annual-ledger > .annual-ledger-row{min-height:28px}

.annual-sales-breakdown header strong{font-size:13px}

.annual-sale-type{font-size:12px;color:var(--muted);font-weight:400}

.annual-sale-chart svg{display:block}
.valuation-field{--method-width:clamp(96px,36%,156px);--column-gap:12px;margin:8px 0 16px}
.valuation-field-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin-bottom:6px}
.valuation-field-head strong{font-size:16px;color:var(--good)}
.valuation-field-head>span,.valuation-field-range,.valuation-field-axis,.valuation-field figcaption{color:var(--muted);font-size:12px}
.valuation-field-chart{position:relative}
.valuation-field-list{list-style:none;margin:0;padding:0}
.valuation-field-list li{display:grid;grid-template-columns:var(--method-width) minmax(0,1fr);gap:var(--column-gap);align-items:center;padding:8px 0;border-top:1px solid var(--soft)}
.valuation-field-method{display:grid;gap:2px;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.valuation-field-status{font-size:12px;color:var(--muted)}
.valuation-field-plot{position:absolute;inset:0 0 0 calc(var(--method-width) + var(--column-gap));pointer-events:none}
.valuation-field-plot::before,.valuation-field-plot::after{content:"";position:absolute;inset-block:0;border-left:1px solid var(--soft)}
.valuation-field-plot::before{inset-inline:0;border-right:1px solid var(--soft)}
.valuation-field-plot::after{inset-inline-start:50%}
.valuation-field-track{position:relative;height:16px}
.valuation-field-band{position:absolute;inset:4px auto 4px var(--start);width:max(2px,var(--width));background:var(--gray)}
.valuation-field-point,.valuation-field-adopted{position:absolute;inset:1px auto 1px var(--position);transform:translateX(-50%);border-left:2px solid var(--ink)}
.valuation-field-inactive .valuation-field-band{background:var(--soft)}
.valuation-field-inactive .valuation-field-point{border-color:var(--muted)}
.valuation-field-adopted{inset-block:0;border-left:2px dashed var(--good);z-index:1}
.valuation-field-range{position:relative;z-index:2;padding-inline-start:6px;text-align:right;line-height:1.4}
.valuation-field-range-values{background:var(--panel)}
.valuation-field-range-values span{white-space:nowrap}
.valuation-field-axis{display:grid;grid-template-columns:repeat(3,1fr);margin-inline-start:calc(var(--method-width) + var(--column-gap));padding-top:4px;border-top:1px solid var(--soft)}
.valuation-field-axis span:nth-child(2){text-align:center}
.valuation-field-axis span:last-child{text-align:right}
@media (max-width:340px){.valuation-field-axis span:nth-child(2){visibility:hidden}}
.valuation-field figcaption{margin-top:4px;line-height:1.6}
.annual-sale .btn{flex-shrink:0;min-height:44px}
@media (max-width:370px){.annual-sale .btn{padding-inline:10px}.annual-sale strong{font-size:23px}}
.annual-news{margin:16px 0;padding:12px 16px;background:var(--soft2);border-top:2px solid var(--line)}
.annual-news h2{margin:4px 0;font-size:17px;letter-spacing:0}
.annual-news p{margin:0}
.annual-news [data-tone="positive"]{color:var(--annual-news-blue,#0000ff)}
.annual-news [data-tone="negative"]{color:var(--danger)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--annual-news-blue:#9999ff}}
:root[data-theme="dark"]{--annual-news-blue:#9999ff}
.annual-news-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.annual-news-choices .btn{min-height:48px;padding:8px 6px;border:1px solid var(--line);border-radius:2px;font-weight:700;line-height:1.4}
.annual-news-choices .btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:none}
.annual-news-response{border-top:1px solid var(--soft);margin-top:12px;padding-top:12px}
.annual-news-response h3{margin:0 0 4px;font-size:15px}
.annual-news-response > .btn{margin-top:8px;min-height:44px}
.annual-growth{margin:16px 0}
.card .annual-growth h2{margin:0 0 4px}
.card .annual-growth-note{margin:0 0 8px;color:var(--muted);font-size:13px}
.annual-growth ul{margin:0;padding:0;list-style:none;border-bottom:1px solid var(--soft)}
.annual-growth li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--soft)}
.card .annual-growth h3{margin:0;font-size:15px;letter-spacing:0}
.card .annual-growth li p{margin:2px 0 0;color:var(--muted);font-size:13px}
.annual-growth .btn{min-height:48px;padding:8px 12px;white-space:nowrap}
.interior-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:16px 0}
.interior-compare figure{margin:0;min-width:0}
.interior-compare figcaption{font-size:13px;font-weight:700}
.interior-compare canvas{display:block;width:100%;height:clamp(96px,30vw,184px)}
.interior-forecast{margin-top:14px;padding:10px 12px;background:var(--soft2)}
.card .interior-forecast h3{margin:0 0 2px;font-size:15px;letter-spacing:0}
.card .interior-forecast p{margin:2px 0 0;font-size:12px}
.interior-forecast th[scope="row"]{font-weight:400}
.interior-forecast th,.interior-forecast td{white-space:nowrap}
.interior-forecast td small{display:block;font-size:12px}
.interior-forecast td small.pos{color:var(--good);font-weight:700}
.annual-decision{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.annual-decision .btn{min-height:44px;padding:8px 6px}
.annual-decision .btn.primary{box-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{border:1.5px solid var(--soft);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:22px;margin:2px 0}
.tile .s{font-size:12px;color:var(--muted);line-height:1.5}
.traps{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.traps li{font-size:13px;line-height:1.6;padding-left:22px;position:relative}
.traps li::before{content:"!";position:absolute;left:0;top:1px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--danger);color:var(--danger);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.start{font-size:17px;padding:12px 34px}
@media (max-width:720px){.tiles{grid-template-columns:1fr}}
.steps{display:flex;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.steps span.on{color:var(--ink);font-weight:700}
@media (min-width:901px) and (min-height:561px) and (max-height:700px){
  .progress-top{grid-template-columns:1fr 1fr;align-items:start;gap:16px;inset-inline:max(24px,4vw)}
  .time{width:min(100%,560px)}
  .shop-hud{width:min(100%,640px)}
}
@media (max-width:900px), (max-height:560px){
  /* 進行と月別収支を店の上下に表示する */
  html,body{height:auto;overflow-x:hidden;overflow-y:auto}
  body{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"progress" "cv" "flow";align-content:start;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .progress-top{position:static;grid-area:progress;margin-top:8px}
  #cv{position:static;grid-area:cv;width:100vw;height:clamp(250px,72vw,440px)}
  .two-shops #cv{height:clamp(220px,58vw,288px)}
  #branchView{position:relative;grid-area:cv;align-self:start;justify-self:start}
  .time{justify-self:stretch;width:auto;min-width:0;margin:0 12px}
  .flow{position:static;grid-area:flow;margin:8px 24px 0;min-width:0}
  /* 通知は店の絵の枠に重ねる */
  .toast{position:relative;grid-area:cv;align-self:start;justify-self:center;top:auto;left:auto;transform:none;margin-top:40px;max-width:calc(100vw - 24px);gap:4px}
  .toast div{font-size:12px;padding:2px 8px}
  .tdate b{font-size:18px}
}
@media (max-width:360px){
  .shop-hud{width:calc(100% - 32px);padding-inline:10px;font-size:11px}
  .shop-hud-main,.shop-hud-stats{gap:8px}
  .shop-hud-stats{flex-wrap:wrap}
  .shop-hud small{font-size:10px}
  .shop-hud-stats dd,.money{font-size:18px}
}
@media (max-width:540px){
  .flow-legend{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* 物件を共通の指標で比較する。 */
.property-choices{--property-columns:minmax(0,1.42fr) minmax(0,1fr) minmax(0,.94fr) minmax(0,1.32fr);margin-top:12px}
.property-columns,.opts[data-k="loc"] .property-option{display:grid;grid-template-columns:var(--property-columns);column-gap:6px;align-items:center}
.property-columns{align-items:start;padding:0 10.5px 5px;color:var(--muted);font-size:10.5px;line-height:1.35}
.property-columns>span:not(:first-child),.property-option>.property-value{text-align:right}
.property-columns small{display:block;font-size:10px;white-space:nowrap}
.property-column-word{white-space:nowrap}
.property-choices .opts[data-k="loc"]{grid-template-columns:1fr;grid-auto-rows:1fr;margin-top:0}
.opts[data-k="loc"] .property-option{min-height:46px;padding:5px 9px}
.opts[data-k="loc"] .property-option[aria-pressed="true"]{border-width:1.5px;outline:1px solid var(--ink);transform:none;z-index:1}
.property-option b{margin:0;font-size:13.5px}
.property-option>.property-value{font-size:14px;font-weight:700;white-space:nowrap}
.card .property-comparison-note{margin:12px 0 0;color:var(--muted);font-size:12px;line-height:1.55}
@media (max-width:350px){
  .property-columns{padding-inline:8.5px;font-size:10px}
  .opts[data-k="loc"] .property-option{padding-inline:7px}
  .property-option b{font-size:12px}
  .property-option>.property-value{font-size:13px}
}

/* 店づくりの設定を、決める順に区切る。 */
.build-setup .build-section{margin-top:16px}
.build-setup .build-section + .build-section{border-top:1px solid var(--soft);padding-top:12px}
.card .build-section h2{margin:0 0 8px;font-size:15px;letter-spacing:.02em;line-height:1.5}
.card .build-section h3{margin:12px 0 7px;font-size:13px;line-height:1.45}
.build-setup .opts [aria-pressed="true"]{border-width:1.5px;outline:1px solid var(--ink);transform:none;z-index:1}
.build-setup .opts[data-k="interior"] [aria-pressed="true"]{border-width:1px;outline:0}
.build-setup .opts[data-k="interior"] .opt{min-height:52px}
.build-setup .opts[data-k="interior"] .opt b{font-size:12.5px;line-height:1.35;text-wrap:balance}
.build-setup .stepper{gap:10px}
.build-setup .stepper button{width:42px;height:42px}
.build-setup .stepper output{min-width:2ch;font-size:24px}
.build-setup .roomPreview{margin-top:4px;border-bottom:0}
.build-setup .roomPreview canvas{height:clamp(140px,42vw,260px)}
.build-setup details{margin-top:6px}
.build-setup details > summary{padding:7px 0;font-size:13px;line-height:1.5}
.build-setup .build-price-read{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:8px 0 0;padding:7px 8px;border-radius:8px;background:var(--soft2);text-align:center}
.build-price-read dt{font-size:11px;color:var(--muted)}
.build-price-read dd{margin:2px 0 0;font-weight:700;font-size:12px;white-space:nowrap}
.build-setup .opts[data-k="edu"]{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.build-setup .opts[data-k="edu"] .opt{display:block;min-height:52px;padding:5px 3px;text-align:center}
.build-setup .opts[data-k="edu"] .opt b{font-size:13px}
.build-setup .opts[data-k="edu"] .opt small{font-size:10.5px}
.build-setup .build-permit{display:grid;gap:7px}
.build-setup .build-permit .chk{margin:0;align-items:start;border:1px solid var(--soft);border-radius:8px;padding:7px 8px;font-size:13px}
.build-setup .build-permit .chk:has(input:checked){border-color:var(--ink)}
.build-setup .build-permit .chk input{accent-color:var(--ink)}
.build-setup .build-permit .chk small{display:block;margin:2px 0 0;font-size:11.5px;line-height:1.4}
.build-setup .build-actions{margin-top:14px}
@media (max-width:360px){
  .manager-card-head span{font-size:10px}
  .build-setup .opts[data-k="interior"] .opt b{font-size:11.5px}
  .build-setup .build-price-read{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1.2fr)}
  .build-setup .build-price-read dd{font-size:11px}
}
.build-setup #calc{
  gap:16px;
  margin-top:24px;
}
.build-setup .setup-finance,
.build-setup .setup-outlook{
  padding:16px;
  border:1px solid var(--soft);
  border-radius:0;
  background:var(--bg);
}
.build-setup .build-outlook{
  background:var(--soft2);
}
.build-setup #calc h2{
  margin:0 0 8px;
  font-size:18px;
  font-weight:700;
  line-height:1.5;
  letter-spacing:.02em;
}
.build-setup .build-finance-summary{
  margin:0;
  font-size:15px;
}
.build-setup .build-finance-summary > div{
  display:grid;
  grid-template-columns:minmax(0,1fr) max-content;
  align-items:baseline;
  gap:8px 16px;
  padding:10px 0;
  border-top:1px solid var(--soft);
}
.build-setup .build-finance-summary dt{
  min-width:0;
  font-weight:400;
  line-height:1.6;
}
.build-setup .build-finance-summary dd{
  margin:0;
  text-align:right;
  white-space:nowrap;
  font-size:18px;
  line-height:1.5;
}
.build-setup .build-finance-summary small,
.build-setup .build-finance-table small{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-family:var(--font);
  font-size:12px;
  font-weight:400;
  line-height:1.6;
  overflow-wrap:anywhere;
}
.build-setup .build-finance-result dt,
.build-setup .build-finance-result dd{
  font-weight:700;
}
.build-setup .build-finance-result dd{
  font-size:22px;
}
.build-setup .build-finance-note{
  margin:0 0 10px;
  color:var(--muted);
  font-size:12px;
  line-height:1.6;
}
.build-setup .build-investment .build-finance-result{padding-bottom:3px}
.build-setup .build-investment .build-finance-note{margin:0}
.build-setup .build-ramp-note{
  margin:8px 0 0;
  padding-top:12px;
  border-top:1px solid var(--soft);
}
.build-setup .build-finance-details{
  margin:0;
}
.build-setup .build-finance-details > summary{
  padding:10px 0;
  font-size:13px;
  line-height:1.6;
  cursor:pointer;
}
.build-setup .build-investment .build-finance-details{
  border-top:0;
  padding-top:0;
}
.build-setup .build-investment .build-finance-details > summary{
  display:grid;
  grid-template-columns:minmax(0,1fr) max-content;
  align-items:center;
  column-gap:6px;
  min-height:44px;
  padding:0;
  color:var(--ink);
  list-style:none;
}
.build-investment summary::-webkit-details-marker{display:none}
.build-setup #calc .build-investment summary h2{
  display:flex;
  align-items:center;
  gap:6px;
  margin:0;
}
.build-investment summary h2::before{
  content:"";
  flex:0 0 6px;
  height:6px;
  border-right:1.5px solid;
  border-bottom:1.5px solid;
  transform:rotate(45deg);
}
.build-investment details[open] > summary h2::before{transform:rotate(225deg)}
.build-setup .build-investment-total{
  font-size:18px;
  line-height:1.5;
  white-space:nowrap;
}
.build-setup .build-full-pl .build-finance-details > summary{
  padding:0;
}
.build-setup .build-finance-details > summary h2{
  display:inline;
  margin:0;
}
.build-setup .build-full-pl .build-finance-details[open] > summary{
  margin-bottom:10px;
}
.build-setup .build-finance-table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
.build-setup .build-finance-table th,
.build-setup .build-finance-table td{
  padding:10px 0;
  border-top:1px solid var(--soft);
  vertical-align:top;
}
.build-setup .build-finance-table th{
  padding-right:16px;
  text-align:left;
  font-weight:400;
  line-height:1.6;
}
.build-setup .build-finance-table td{
  width:1%;
  text-align:right;
  white-space:nowrap;
  font-size:15px;
  line-height:1.6;
}
.build-setup .build-finance-table .build-finance-subtotal th,
.build-setup .build-finance-table .build-finance-subtotal td,
.build-setup .build-finance-table .build-finance-result th,
.build-setup .build-finance-table .build-finance-result td{
  font-weight:700;
}
.build-setup .build-finance-table .build-finance-result td{
  font-size:18px;
}
@media (max-width:360px){
  .build-setup .setup-finance,
  .build-setup .setup-outlook{
    padding:12px;
  }
  .build-setup .build-finance-summary > div{
    column-gap:10px;
  }
  .build-setup #calc .build-finance-details > summary h2,
  .build-setup .build-investment-total{
    font-size:16px;
  }
  .build-setup .build-finance-summary dd{
    font-size:16px;
  }
  .build-setup .build-finance-result dd{
    font-size:18px;
  }
}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<canvas id="branchView" role="img" aria-label="2号店の店内図" hidden></canvas>
<div class="progress-top" id="progressTop">
  <div class="time" id="timeBox">
    <div class="tdate"><b id="tYear">開業前</b><span class="m" id="tMonth"></span><span class="clock" id="tClock">--:--</span></div>
    <div class="tbar" id="tbar"></div>
    <div class="tlabels" id="tlabels"></div>
    <div class="time-controls">
      <div id="tNote"></div>
      <div class="playback-control" id="playbackControl" hidden>
        <span id="playbackLabel">速度</span>
        <div class="playback-options" id="playbackOptions" role="group" aria-labelledby="playbackLabel"></div>
      </div>
    </div>
  </div>
  <section class="shop-hud" id="shopHud" aria-labelledby="shopHudTitle" hidden>
    <header class="shop-hud-head">
      <h2 id="shopHudTitle">前月の営業実績</h2>
      <span class="shop-hud-style" id="shopHudStyle"></span>
    </header>
    <div class="shop-hud-main">
      <dl class="shop-hud-stats">
        <div><dt>来店客数</dt><dd><span class="num" id="shopHudGuests">—</span> <small id="shopHudGuestsUnit" hidden>人/日</small></dd></div>
        <div><dt>満席率</dt><dd class="num" id="shopHudOccupancy">—</dd></div>
      </dl>
      <dl class="hud">
        <div><dt>手元資金</dt><dd class="money" id="money"><span class="num" id="moneyV">—</span> <small>万円</small></dd></div>
        <div class="hud-secondary"><dt>事業価値</dt><dd class="num" id="valueV">—</dd></div>
        <div class="hud-secondary" id="debt" hidden><dt>借入残高</dt><dd class="num" id="debtV"></dd></div>
      </dl>
    </div>
  </section>
</div>

<section class="flow" id="flow" aria-labelledby="flowTitle">
  <header class="flow-head"><h2 id="flowTitle">月別収支</h2><span>万円</span><span class="flow-month" id="flowMonth"></span></header>
  <div class="flow-chart empty" id="flowChart">
    <div class="flow-axis num" aria-hidden="true"><span class="top" id="flowTop"></span><span class="zero">0</span><span class="bottom" id="flowBottom"></span></div>
    <div class="flow-plot">
      <div class="flow-track" id="flowTrack" role="group" aria-label="直近12か月の収支。月を選んで内訳を表示"></div>
      <canvas class="flow-trend" id="flowTrend" aria-hidden="true"></canvas>
    </div>
    <p class="flow-empty" id="flowEmpty">1か月経過すると表示されます</p>
  </div>
  <dl class="flow-legend" id="flowLegend"></dl>
  <p class="flow-legacy" id="flowLegacy" hidden>この月は臨時損益の記録がありません。</p>
</section>
<div class="toast" id="toast"></div>
<div class="enforcement-frame" id="enforcementFrame" role="alertdialog" aria-modal="true" aria-labelledby="enforcementTitle" aria-describedby="enforcementOffenses enforcementMessage" hidden>
  <div class="enforcement-headline">
    <strong id="enforcementTitle"></strong>
    <span class="enforcement-offenses" id="enforcementOffenses"></span>
    <span id="enforcementMessage"></span>
    <button type="button" class="enforcement-continue" id="enforcementContinue">画面をタップして進む</button>
  </div>
</div>

<div class="ov" id="ov"><div class="card" id="card"></div></div>

<script type="application/json" id="shop-data">
{
  "meta": {
    "title": "ポーカー屋をつくろう！",
    "version": "1.0.0",
    "unit": "万円",
    "disclaimer": "このゲームは適法性の判断・法的助言ではありません。確率・処分の段階・金額・立地の数値はすべてゲーム用の架空の値です。",
    "parameterNote": "数値は遊びの釣り合いのための架空パラメータで、実在の市場や物件の統計ではない。売上・集客・費用の前提はゲーム内の「計算の前提と式」に表示する。条文の逐語は docs/questions.json の provisions（正本）から build_shop.py で埋め込む。",
    "months": 60,
    "secondsPerMonth": 6,
    "fund": 5000,
    "bankruptAt": 0

function businessDetectionRate(source, months){
  const reference = source.orderReference;
  if (!reference) return source.order + (source.orderGrowth || 0) * months;
  const comparison = byId(STYLES, reference.style);
  const comparisonRate = (month) => gamblingArrestRate(comparison, month, R.grayReferenceCurve);
  const rate = comparisonRate(months);
  if (!reference.target) return rate * reference.factor;
  const start = comparisonRate(0);
  const startDetection = start * reference.factor;
  const progress = (rate - start) / (comparisonRate(reference.target.months) - start);
  return startDetection + progress * (reference.target.rate - startDetection);
}
function risks(){
  let arrest = 0, order = 0;
  const active = riskSources(), business = active.filter((source) => source.offense === "business");
  const gambling = active.find((source) => source.offense === "gambling");
  const jump = Math.pow(R.orderJump, S.orders);
  const rm = FX().riskMult;
  const floorId = annualNewsFor(S.loc)?.grayRiskFloor;
  const grayRiskFloor = floorId && byId(STYLES, floorId);
  if (gambling) arrest = gamblingArrestRate(gambling, S.used[gambling.id] || 0) * jump * rm;
  else if (S.month - S.lastUsed.cashout <= R.tailMonths){
    arrest = byId(STYLES, "cashout").arrest * R.tailFactor * jump;
  }
  for (const source of business){
    const months = S.used[source.id] || 0;
    let detection = businessDetectionRate(source, months);
    if (source.tier === "gray" && grayRiskFloor){
      detection = Math.max(detection, gamblingArrestRate(grayRiskFloor, months, R.grayReferenceCurve) * jump, grayRiskFloor.order + grayRiskFloor.orderGrowth * months);
    }
    order += detection * rm;
  }
  return { arrest: Math.min(MAX_ENFORCEMENT_RATE, arrest), order: Math.min(MAX_ENFORCEMENT_RATE, order), active, business };
}
function dcfParts(rr, gg){
  const recent = S.ops.slice(-12);
  const fcfMonth = (recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0) - O.maintenancePerTable * (S.tables + (S.branch ? S.branch.tables : 0));
  const i = S.ind, mgr = S.staffList && S.staffList.some((x) => x.manager);
  const r0 = V.discountBase + V.discountPerOrder * S.orders + (i.slack < 30 ? V.discountLowSlack : 0) + (mgr ? 0 : V.ownerDependence);
  const g0 = clamp(V.growthBase + (i.fame - 50) / 100 * V.growthFame * 2 + (S.mix.regular - 0.4) * SEG.regularGrowth, V.growthMin, V.growthMax);
  const r = rr != null ? rr : r0, g = gg != null ? gg : g0;
  const rows = []; let fcf = fcfMonth * 12, pv = 0;
  for (let y = 1; y <= V.years; y++){ fcf *= 1 + g; const d = fcf / Math.pow(1 + r, y); pv += d; rows.push({ y, fcf, pv: d }); }
  const tv = fcf * (1 + V.terminalGrowth) / (r - V.terminalGrowth), tvPv = tv / Math.pow(1 + r, V.years);
  return { fcfMonth, r, g, mgr, rows, tv, tvPv, ev: Math.max(0, pv + tvPv) };
}
const deposits = () => S.deposit + (S.branch ? S.branch.deposit : 0);
function storeAssets(){
  const branch = S.branch;
  return {
    deposit: deposits(),
    fitout: S.fitout + (branch ? branch.fitout : 0),
    tablesCost: S.tablesValue + (branch ? branch.tablesValue : 0),
    area: S.area + (branch ? branch.tables * L.tsuboPerTable + L.commonTsubo : 0),
  };
}
function liquidationRecovery({ deposit, fitout, tablesCost, area }){
  const restore = area * LQ.restorePerTsubo;
  const fitoutSale = fitout * LQ.assetSaleRate, equipmentSale = tablesCost * LQ.assetSaleRate;
  const liquid = Math.max(0, deposit - restore + fitoutSale + equipmentSale);
  return { restore, fitoutSale, equipmentSale, liquid };
}
const shellValue = () => liquidationRecovery(storeAssets()).liquid;
const storeValue = () => valuation(ddCheck()).adopted;

/* ---------- 月次 ---------- */
function monthTick(){
  const wasOpen = isOpen();
  const manager = currentManager();
  // 決算で確定した採用・許可の支出は、新年度の最初の月に含める。
  const adjAtStart = S.month % 12 === 0 ? 0 : S.year.adj || 0;
  const monthlyAdjustment = () => (S.year.adj || 0) - adjAtStart;
  let orderActs = null;
  if (wasOpen && S.openedAt == null){ S.openedAt = S.month; story(S.licensed ? "許可が下り、開業した。" : "許可を待たずに開業した。"); }
  const rentBeforeOpening = wasOpen ? 0 : monthlyRent();
  const monthMultiplier = 1 + O.monthlyDemandVariation * (2 * hr("monthlyDemand") - 1);
  const p = wasOpen ? project(false, { monthMultiplier }) : { demand: 0, occ: 0, guests: 0, rev: 0, op: -rentBeforeOpening, interest: 0, net: -rentBeforeOpening, rent: rentBeforeOpening, varCost: 0, other: 0, staff: 0 };
  if (wasOpen && manager.misconductChance && hr("managerMisconduct") < manager.misconductChance){
    const variation = manager.misconductSalesRateVariation ?? 0;
    const salesRate = manager.misconductSalesRate + variation * (2 * hr("managerMisconduct", 1) - 1);
    const cost = (p.storeRev - p.branchRev) * salesRate;
    p.other += cost;
    p.op -= cost;
    p.net -= cost;
    note(`店長・${manager.personName}の不正が発覚。返金や対応が発生した。`, "bad");
    story(`店長・${manager.personName}の不正が発覚し、返金や対応が発生した。`);
    logEv("managerMisconduct", { cost });
  }
  expansionTick(wasOpen);
  S.cash += p.net; S.last = p; S.year.net = (S.year.net || 0) + p.net;
  if (wasOpen){ S.ops.push(p.op); S.year.rev += p.rev; S.year.op += p.op; S.peakMonth = Math.max(S.peakMonth, p.net); }
  logEv("month", { net: Math.round(p.net), guests: Math.round(p.guests), occ: +p.occ.toFixed(3), style: styleNow().id });

  if (wasOpen){
    const rk = risks();
    if (rk.active.length) S.violationNet += p.net;
    for (const a of rk.active){ S.used[a.id] = (S.used[a.id] || 0) + 1; S.lastUsed[a.id] = S.month; S.riskMonths.push({ t: S.month, id: a.id, tier: a.tier }); }
    const gamblingDetected = hr("arrest") < rk.arrest;
    const businessDetected = rk.business.length && hr("order") < rk.order;
    const businessRepeat = S.businessOrders + 1 >= R.businessArrestAt;
    const cause = gamblingDetected ? "gambling" : businessDetected && businessRepeat ? "business" : null;
    if (cause){
      S.arrestCause = cause;
      const offenseIds = cause === "gambling" ? ["cashout"] : rk.business.map(({ id }) => id);
      const record = { cause, offenseIds, triggeredByHistory: cause === "gambling" && !rk.active.some((source) => source.offense === "gambling") };
      logEv("arrest", record);
      story(cause === "gambling" ? "賭博場開張で逮捕された。" : "風営法違反の再発覚で逮捕された。");
      S.month++;
      rec(p, wasOpen, monthlyAdjustment());
      return pauseForEnforcement({ kind: "arrest", ...record });
    }
    const arrestChance = rk.arrest + (businessRepeat ? (1 - rk.arrest) * rk.order : 0);
    if (arrestChance >= R.heatWarn && S.month - (S.heatWarnAt ?? -99) >= 6){ S.heatWarnAt = S.month; story("店の前に、見慣れない車が何日も停まっている。"); note(`捜査の気配。今月の逮捕率 ${pct(arrestChance)}`, "bad"); }
    if (businessDetected) orderActs = rk.business;
  }
  const i = S.ind;
  if (wasOpen){
    i.fame = clamp(i.fame + FX().fameGain * 0.5 + (p.occ > 0.8 ? 0.5 : 0), 0, 100);
    // 採用方式（経験者＋10／未経験−5、教育で育つ）を毎月の余力の戻り先に入れる
    const ssx = staffStats(), fill = ssx.need ? ssx.count / ssx.need : 1;
    const slackTarget = 85 + clamp((fill - 1) * 60, -30, 15) + (ssx.skill - 3) * 5 + (ssx.manager ? 5 : 0) + FX().slackTarget + EDU().slackTarget - 70 * Math.max(0, p.occ - 0.5) / 0.4 - Math.max(0, hoursLen() - 10) * 3;
    i.slack = clamp(i.slack + (slackTarget - i.slack) * 0.2, 0, 100);
    updateMix();
    staffMonthly();
  }
  S.tempDemand = S.tempDemand.filter((t) => --t.months > 0);
  if (S.rumor > 0) S.rumor--;
  if (S.shock > 0) S.shock--;
  if (S.licenseWait > 0){ S.licenseWait--; if (S.licenseWait === 0){ S.licensed = true; S.unlicensed = false; note("許可が下りた。", "good"); logEv("licensed", {}); } }

  if (S.month === MK.shakeStart && wasOpen){ note("業界の淘汰が始まった。弱い店が撤退し、残った店に客が集まる", "good"); story("5年目に入り、業界の淘汰が始まった。"); }
  const trP = S.loc.troubleP * S.hiring.trouble * EDU().trouble * (i.slack < 30 ? 1.5 : 1) * manager.troubleMultiplier;
  if (wasOpen && hr("trouble") < trP){
    if (hr("trouble", 1) < 0.5){ const c = (O.trouble.costMin + hr("trouble", 2) * (O.trouble.costMax - O.trouble.costMin)) * (1 + S.tables / 10); S.cash -= c; taxAdj(-c, "トラブル対応費"); const t = D.troubleTexts[Math.floor(hr("trouble", 3) * D.troubleTexts.length)]; note(`${t}（${yen(-c)}）`, "bad"); story(`${t}。${yen(c)}かかった。`); logEv("trouble", { cost: Math.round(c) }); }
    else { S.shock = O.trouble.shockMonths; const t = D.shockTexts[Math.floor(hr("trouble", 3) * D.shockTexts.length)]; note(`${t}（${O.trouble.shockMonths}か月 来店需要−${pct(O.trouble.shock, 0)}）`, "bad"); story(`${t}。`); logEv("shock", {}); }
  }
  S.month++;
  const orderNotice = orderActs ? order(orderActs) : null;
  const adjustment = monthlyAdjustment();
  if (S.month % 12 === 0) payTax(`${S.month / 12}年目`);
  if (TEST && window.__onMonth) window.__onMonth(S); // 検証用：月末のフック（scripts/sim_annual.js）
  if (wasOpen) judgeChoke(p);
  rec(p, wasOpen, adjustment);
  explainMonth();
  if (orderNotice) return pauseForEnforcement(orderNotice);
  finishMonth();
}
function finishMonth(){
  if (S.cash < M.bankruptAt){ story("資金が尽きた。"); return finish("bankrupt"); }
  if (S.month >= M.months) return completeSale();
  if (S.month % 12 === 0){
    S.annualReport = { rev: S.year.rev, op: S.year.op, recorded: false };
    return annual();
  }
  saveGame();
}
/* 月ごとの記録（進行・結果画面用）。extra＝営業損益以外の出入り（内装投資・借入・是正対応費など） */
function rec(p, wasOpen, adjustment){
  const other = wasOpen ? p.other : 0;
  const expenses = wasOpen ? {
    variable: p.varCost - p.procurementCost,
    procurement: p.procurementCost,
    wages: p.staff - p.managerCost,
    manager: p.managerCost,
    utility: p.utility,
    education: p.eduCost,
    facilities: p.facOps,
    other: other - p.utility - p.eduCost - p.facOps,
  } : undefined;
  S.recs.push({ t: S.month - 1, open: wasOpen, guests: p.guests || 0, occ: p.occ || 0, rev: p.rev || 0, rent: p.rent || S.rent, staff: wasOpen ? p.staff : 0, other,
    days: O.days, spend: p.spend, lostRevenue: wasOpen ? p.lostSeat * O.days * p.spend : 0,
    branchRev: p.branchRev || 0, fcRoy: p.fcRoy || 0, varCost: p.varCost || 0,
    interest: p.interest || 0, net: p.net, adjustment, expenses, extra: S.cash - S.prevCash - p.net, cash: S.cash, debt: S.debt, share: S.share, tables: S.tables });
  S.prevCash = S.cash;
}
/* 客層の動き：スタッフの指導力が常連化に効き、大会客は設備と知名度で変わる */
function normMix(){ const t = S.mix.regular + S.mix.newbie + S.mix.tourney; for (const k of ["regular", "newbie", "tourney"]) S.mix[k] /= t; }
function updateMix(){
  const m = S.mix;
  const conv = SEG.baseConvert * FX().convert * (1 + (staffStats().teach - 3) * 0.15) * m.newbie;
  const churn = SEG.baseChurn * m.regular;
  m.regular += conv - churn; m.newbie += churn - conv;
  const tt = FX().tourney + (S.ind.fame - 30) / 100 * SEG.tourneyFameBonus;
  m.tourney += (tt - m.tourney) * SEG.tourneyAdjust;
  for (const k of ["regular", "newbie", "tourney"]) m[k] = Math.max(0.02, m[k]);
  normMix();
}

function order(acts){
  S.orders++;
  S.businessOrders++;
  const cost = Math.max(R.orderCostMin, Math.max(0, project(true).op) * R.orderCostMonths);
  S.cash -= cost;
  taxAdj(-cost, "業務改善命令への対応費");
  S.rumor = R.orderRumorMonths;
  for (const a of acts){
    if (a.id === "latenight"){
      S.close = clamp(S.close, O.legalOpen + 4, O.legalClose);
      S.open = clamp(S.open, O.legalOpen, S.close - 4);
      resizeStaff();
    }
    else if (a.style) S.stopUntil[a.id] = S.month + R.orderStopMonths;
  }
  const subjects = acts.map((a) => a.short);
  const offenseIds = acts.map(({ id }) => id);
  logEv("order", { acts: offenseIds, cost: Math.round(cost) });
  story(`${R.labels.order}を受けた（${subjects.join("・")}）。${R.labels.orderCost} ${yen(cost)}。`);
  return { kind: "order", offenseIds, subjects, cost, suspendedStyle: acts.some((a) => a.style), adjustedHours: acts.some((a) => a.id === "latenight") };
}

/* ---------- バリュエーション：DCF・類似取引比較・清算価値 → 中央値（清算価値が下限） ---------- */
const CP = D.comps, LQ = D.liquidation;
const pctile = (arr, q) => { const a = [...arr].sort((x, y) => x - y), i = (a.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return a[lo] + (a[hi] - a[lo]) * (i - lo); };
function ltm(){ const r = S.recs.filter((x) => x.open).slice(-12); return { sales: r.reduce((a, x) => a + x.rev, 0), ebitda: r.reduce((a, x) => a + x.net + x.interest, 0), months: r.length }; }
function valuation(dd){
  const assets = storeAssets(), dep = assets.deposit;
  const months = S.openedAt == null ? 0 : S.month - S.openedAt;
  // DCF と感応度
  const d = dcfParts(), sens = [];
  for (const dr of [-V.sensR, 0, V.sensR]){ const row = []; for (const dg of [-V.sensG, 0, V.sensG]) row.push(dcfParts(d.r + dr, clamp(d.g + dg, -0.1, 0.2)).ev + dep); sens.push(row); }
  const flat = sens.flat(), dcf = { point: d.ev + dep, lo: Math.min(...flat), hi: Math.max(...flat), d, sens };
  // 類似取引比較
  const L12 = ltm(), seats = (S.tables + (S.branch ? S.branch.tables : 0)) * 9 + (S.fc ? S.fc.count * 18 : 0);
  const m = { ebitda: CP.deals.map((x) => x.ev / x.ebitda), sales: CP.deals.map((x) => x.ev / x.sales), seat: CP.deals.map((x) => x.ev / (x.tables * 9)) };
  const A = CP.adjust, mgr = d.mgr;
  const adj = clamp(1 + (S.mix.regular - 0.4) * A.regular + (mgr ? 0 : A.noManager), A.min, A.max);
  const distress = L12.ebitda <= 0 ? A.distress : 1;
  const implied = (q) => {
    const v = [];
    if (L12.ebitda > 0) v.push(pctile(m.ebitda, q) * L12.ebitda);
    if (L12.sales > 0) v.push(pctile(m.sales, q) * L12.sales * distress);
    v.push(pctile(m.seat, q) * seats * distress * (L12.months >= 6 ? 1 : 0.5));
    return Math.max(0, pctile(v, 0.5) * adj) + dep;
  };
  const comps = { point: implied(0.5), lo: implied(0.25), hi: implied(0.75), adj, distress, L12, seats, mult: { ebitda: pctile(m.ebitda, 0.5), sales: pctile(m.sales, 0.5), seat: pctile(m.seat, 0.5) } };
  // 清算価値（帳簿の純資産と、急いで売る清算価値）
  const fitBook = assets.fitout * Math.max(0, 1 - months / LQ.fitoutLifeMonths);
  const tabBook = assets.tablesCost * Math.max(0, 1 - months / LQ.tableLifeMonths);
  const book = dep + fitBook + tabBook;
  const recovery = liquidationRecovery(assets), liquid = recovery.liquid;
  const liq = { point: liquid, lo: liquid, hi: Math.max(liquid, book), book, dep, fitBook, tabBook, assets, ...recovery };
  // 買収前調査
  let use = { dcf: dcf.point, comps: comps.point }, note = "";
  if (dd && dd.kind === "shell"){ use = null; note = V.shellMessage; }

function usedGrowthAction(action){

    || (action === "interior_upgrade" && legacy === "内装の改装")
    || (action === "manager_change" && typeof legacy === "string" && legacy.startsWith("店長の交代（"))
    || (action === "branch" && legacy === "2号店の出店")

    ? prior.reduce((sum, entry) => sum + entry.rev, 0) : null;
  const change = priorSales == null ? null : totalSales - priorSales;
  const rate = priorSales > 0 ? change / priorSales : null;
  const openedAt = S.branch?.openedAt;
  const hasBranch = openedAt != null && openedAt < S.month;
  if (change == null && !hasBranch) return "";
  let breakdown = "";
  if (hasBranch){
    const current = S.recs.filter((entry) => entry.t >= yearStart && entry.t < S.month);
    if (current.length === 12 && current.every((entry) => Number.isFinite(entry.branchRev) && Number.isFinite(entry.fcRoy))){
      const branchSales = current.reduce((sum, entry) => sum + entry.branchRev, 0);

  const difference = toYen(total) - rows.reduce((sum, [, amount]) => sum + toYen(amount), 0);
  if (!difference) return "";

function ddCheck(){

  return gray ? { kind: "shell", gray: true, name: byId(STYLES, gray.id)?.name || "グレーの営業" } : { kind: "none" };

const PN = D.penalty;
function penaltyOf(){
  const b = PN.black;
  const forfeit = Math.max(0, S.violationNet) * b.forfeitRate;
  const out = { forfeit, total: forfeit, prisonMonths: 0, items: [[`違反営業中の利益の${pct(b.forfeitRate, 0)}を没収`, forfeit]], provisionIds: [] };
  if (S.arrestCause === "gambling"){
    const gamblingMonths = S.riskMonths.filter(({ id }) => id === "cashout").length;
    out.prisonMonths = clamp(Math.round(b.prisonBaseMonths + b.prisonPerBlackYearMonths * gamblingMonths / 12), b.prisonMinMonths, b.prisonMaxMonths);
    out.provisionIds.push(...b.provisionIds);
  }
  return out;
}
const prisonText = (m) => m >= 12 ? `${Math.floor(m / 12)}年${m % 12 ? `${m % 12}か月` : ""}` : `${m}か月`;

/* ---------- 税金（法人の税、v1.4）----------
   税率は docs/questions.json の条文（e-Gov 法令APIから取得）にもとづく標準税率。shop.json の tax に値と条文IDを置く。
   課税所得＝その事業年度の月々の利益（営業利益−利息）＋臨時の損益（トラブル・是正対応費・採用・許可申請・FC加盟金）。
   設備・卓・内装などの投資は損金に入れない（減価償却は省略）。欠損金は翌年以降に繰り越して控除する */
const TX = D.tax;
const TAX_ITEMS = [
  ["法人税", "hojin"], ["地方法人税", "chihohojin"], ["防衛特別法人税", "boei"],
  ["法人住民税（法人税割）", "juminWari"], ["法人住民税（均等割）", "kintou"],
  ["事業税", "jigyo"], ["特別法人事業税", "tokubetsu"],
];
function taxAdj(x, label){
  if (!S?.year) return;
  S.year.adj = (S.year.adj || 0) + x;
  const adjustments = (S.year.adjustments ??= {});
  adjustments[label] = (adjustments[label] || 0) + x;
}
function corpTax(income, staffN){
  const b = { income, carried: 0, taxable: 0, hojin: 0, chihohojin: 0, boei: 0, juminWari: 0, kintou: TX.perCapitaPref + (staffN > TX.perCapitaMuniStaff ? TX.perCapitaMuniOver : TX.perCapitaMuni), jigyo: 0, tokubetsu: 0 };
  if (income <= 0){ S.taxLoss = (S.taxLoss || 0) - income; }
  else { b.carried = Math.min(S.taxLoss || 0, income); S.taxLoss = (S.taxLoss || 0) - b.carried; b.taxable = income - b.carried; }
  const T = b.taxable, br = (lo, hi) => Math.max(0, Math.min(T, hi) - lo);
  b.hojin = TX.corpSmallRate * br(0, TX.corpSmallLimit) + TX.corpRate * br(TX.corpSmallLimit, Infinity);
  b.chihohojin = b.hojin * TX.localCorpRate;
  b.boei = Math.max(0, b.hojin - TX.defenseDeduction) * TX.defenseRate;
  b.juminWari = b.hojin * (TX.residentPrefRate + TX.residentMuniRate);
  b.jigyo = TX.enterprise.reduce((a, [lo, hi, r]) => a + br(lo, hi == null ? Infinity : hi) * r, 0);
  b.tokubetsu = b.jigyo * TX.specialEnterpriseRate;
  b.total = b.hojin + b.chihohojin + b.boei + b.juminWari + b.kintou + b.jigyo + b.tokubetsu;
  return b;
}
function payTax(label){
  const y = S.year || {}, income = (y.net || 0) + (y.adj || 0), b = corpTax(income, S.staffList ? S.staffList.length : 0);
  b.adjustment = y.adj || 0;
  b.adjustments = y.adjustments;
  S.cash -= b.total; S.taxPaid = (S.taxPaid || 0) + b.total; S.lastTax = b;
  y.net = 0; y.adj = 0; delete y.adjustments;
  story(`${label}の税金（法人税など）${yen(b.total)}を納めた（課税所得 ${yen(b.taxable)}${b.carried ? `・繰越欠損金 ${yen(b.carried)}を控除` : ""}）。`);
  logEv("tax", { income: Math.round(income), taxable: Math.round(b.taxable), total: Math.round(b.total) });
  return b;
}
function taxHTML(b){
  const r = (n, v) => v ? `<tr><td style="text-align:left">${n}</td><td>${yen(v)}</td></tr>` : "";
  return `<table class="t"><tr><td style="text-align:left">その年の所得</td><td>${yen(b.income)}</td></tr>${b.carried ? `<tr><td style="text-align:left">繰越欠損金の控除</td><td>${yen(-b.carried)}</td></tr>` : ""}<tr><td style="text-align:left">課税所得</td><td>${yen(b.taxable)}</td></tr>
    ${TAX_ITEMS.map(([label, key]) => r(label, b[key])).join("")}
    <tr class="total"><td style="text-align:left">税金の合計</td><td>${yen(b.total)}</td></tr></table>
    <details><summary>税率と条文</summary><p class="muted" style="font-size:12px">${esc(TX.note)}</p>${provHTML(TX.provisionIds)}</details>`;
}

const benchmarkDeviation = Math.sqrt(referenceAmounts.reduce((sum, value) => sum + (value - benchmarkMean) ** 2, 0) / referenceAmounts.length);
const deviationScore = (amount) => (50 + 10 * (amount - benchmarkMean) / benchmarkDeviation).toFixed(1);

function resultScoreHTML(amount){

  const ticks = Array.from(tickIndices, (i) => {

    return `<span style="--x:${pct(i / counts.length, 4)}">${value.toLocaleString("ja-JP")}</span>`;
  }).join("");
  const series = counts.map((count, i) => `${yen(min + i * binWidth)}から${yen(min + (i + 1) * binWidth)}まで ${count}回`).join("、");
  return `<section class="result-score" aria-labelledby="scoreDistributionHeading">
    <div class="score-benchmark">
      <div class="score-heading"><h2 id="scoreDistributionHeading">成績分布</h2><span class="score-meta">基準プレイ ${referenceAmounts.length}回</span></div>
      <figure>
        <div role="img" aria-label="基準プレイの最終手取り額の分布。 ${series}。今回の最終手取り額は${yen(amount)}。">
          <div class="score-axis-info score-meta"><span>回数</span><span>${yen(binWidth)}刻み</span></div>
          <div class="score-plot" style="--marker:${marker}">
            ${[0, .5, 1].map((y) => `<div class="score-guide" style="--y:${pct(y, 0)}"><span class="num">${top * y}</span></div>`).join("")}
            <div class="score-bars" style="--bins:${counts.length}">${counts.map((count) => `<span style="--height:${pct(count / top, 3)}"></span>`).join("")}</div>
            <div class="score-marker"></div><span class="score-marker-label">今回</span>
          </div>
          <div class="score-ticks num">${ticks}</div>

/* ---------- 詰まりの判定：集客不足／席不足／人手不足／定着不足 ---------- */
function judgeChoke(p){
  const c = [];
  if (p.lostSeat > p.demand * 0.1) c.push("seat");
  if (p.svc < 0.95) c.push("staff");
  const age = S.openedAt == null ? 0 : S.month - S.openedAt;
  if (p.occ < 0.45 && age >= 6) c.push("demand");
  S.regHist = (S.regHist || []).concat(S.mix.regular).slice(-7);
  if (S.mix.newbie > 0.4 && S.regHist.length >= 7 && S.mix.regular <= S.regHist[0] + 0.01) c.push("retain");
  S.choke = c;
  for (const k of c) S.chokeCount[k] = (S.chokeCount[k] || 0) + 1;
  S.lostGuests = (S.lostGuests || 0) + (p.lostSeat || 0) * O.days;
}
/* ---------- 結果：設計の振り返り（設計 → 起きたこと → 結果） ---------- */
function isRamping(month, tables){
  return S.openedAt != null && month >= S.openedAt && openingDemandFactor(S.loc, tables, month - S.openedAt) < 1;
}
function causalChains(kind){
  const open = S.recs.filter((r) => r.open), out = [], cc = S.chokeCount || {};
  const avgOcc = open.length ? open.reduce((a, r) => a + r.occ, 0) / open.length : 0;
  if (kind === "bankrupt" && isRamping(S.month - 1, S.tables))
    out.push([`初期投資 ${yen(S.invest)}（開業時の手元資金 ${yen(S.startCash)}）`, `客が育つ前の${S.month - S.openedAt}か月で赤字が続いた`, "資金が尽きた"]);
  if ((cc.seat || 0) >= 6){
    const lostRevenue = open.every((r) => Number.isFinite(r.lostRevenue)) ? open.reduce((a, r) => a + r.lostRevenue, 0) : null;
    const impact = lostRevenue == null ? "席不足で売上の機会を逃した" : `席不足で逃した売上機会 約${yen(lostRevenue)}（各月の来店見送り数 × 客単価）`;
    out.push([`${S.cfg.tables}卓でスタート`, `${cc.seat}か月、席が足りなかった（逃した客 のべ約${Math.round(S.lostGuests).toLocaleString("ja-JP")}人）`, impact]);
  }
  if ((cc.demand || 0) >= 6) out.push([`${S.cfg.tables}卓・${S.loc.name}（坪${S.loc.tsuboRent}万円）`, `${cc.demand}か月、席が余った（平均満席率${Math.round(avgOcc * 100)}%）`, "空いた卓の家賃と人件費が重くなった"]);
  if ((cc.staff || 0) >= 6) out.push([`採用「${S.hiring.name}」・営業${hoursLen()}時間`, `${cc.staff}か月、人手が足りず客をさばけなかった`, "売上の取りこぼしと、トラブルの増加"]);
  if ((cc.retain || 0) >= 6) out.push([`初心者が多い客層（常連${Math.round(S.mixStart.regular * 100)}%で開業）`, `${cc.retain}か月、初心者が常連に育たなかった`, "客数が安定せず、店の値段の成長率も伸びなかった"]);
  const dReg = S.mix.regular - S.mixStart.regular;
  if (dReg > 0.2) out.push([S.fac.includes("lesson") ? "初心者講習スペースを設置" : "開業時の客層", `常連の比率が${pct(S.mixStart.regular, 0)} → ${pct(S.mix.regular, 0)}に増えた`, "客数が安定し、店の値段の成長率が上がった"]);
  if (S.price < 0.95 && (cc.staff || 0) >= 3) out.push([`料金を全国基準より安く（${Math.round(S.price * 100)}%）`, "客は増えたが、スタッフが疲れた", "単価の低さに、接客の負担が見合わなかった"]);
  if (S.style.tier !== "clean") out.push([`営業スタイル「${S.style.name}」`, S.orders ? `${R.labels.order}を${S.orders}回受けた` : "一時的に売上は上がった", S.dd?.kind === "shell" ? "売却時に過去の営業履歴を確認し、ハコの価値で売却した" : "リスクを抱えたまま営業した"]);
  return out.slice(0, 4);
}
function causalHTML(kind){
  const c = causalChains(kind);
  if (!c.length) return `<p class="muted">大きな因果は見つからなかった。</p>`;
  return `<div style="display:grid;gap:8px">${c.map(([a, b, r]) => `<div style="border:1.5px solid var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6"><span class="muted">設計</span> ${esc(a)}<br><span class="muted">→ 起きたこと</span> ${esc(b)}<br><span class="muted">→ 結果</span> <b>${esc(r)}</b></div>`).join("")}</div><p class="muted" style="font-size:12px">正解は示さない。次の店で、どこを変えて試すか。</p>`;
}
/* ---------- 店のタイプ診断（名前は架空） ---------- */
function shopType(){
  const f = (id) => S.fac.includes(id), m = S.mix, tier = S.style.tier, tb = S.tables;
  const sc = {
    thrill: (tier === "black" ? 4 : tier === "gray" ? 2.5 : 0) + (f("vip") ? 1.5 : 0) + (S.price > 1.15 ? 0.5 : 0) + S.orders * 0.5,
    lounge: (f("bar") ? 2 : 0) + (S.open >= 17 ? 1 : 0) + (S.close >= 24 ? 0.5 : 0) + m.regular,
    arena: m.tourney * 4 + (f("stream") ? 1 : 0) + (f("tournament") ? 1 : 0),
    first: (f("lesson") ? 2 : 0) + Math.max(0, m.regular - S.mixStart.regular) * 4,
    hall: (tb >= 8 ? 2.5 : tb >= 7 ? 1 : 0) + (S.price < 0.95 ? 1 : 0),
    town: 1.2 + (tb <= 5 ? 1 : 0),
  };
  const id = Object.entries(sc).sort((a, b) => b[1] - a[1])[0][0];
  return byId(TYPES.list, id);
}
