<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー店経営 5年</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#111111; --muted:#6b6b6b; --line:#1a1a1a; --soft:#dedede; --soft2:#f1f1f1;
  --wall:#ececec; --wall-dark:#c9c9c9; --shadow:rgba(0,0,0,.13); --panel:#ffffff; --gray:#8a8a8a;
  --danger:#b3261e; --good:#2e6b45;
  --font:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
    --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --ink:#f2f2f2; --muted:#9a9a9a; --line:#e8e8e8; --soft:#3a3a3a; --soft2:#1e1e1e;
  --wall:#2a2a2a; --wall-dark:#3d3d3d; --shadow:rgba(0,0,0,.5); --panel:#1b1b1b; --gray:#8d8d8d; --danger:#ff8a80; --good:#8fd1a6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block}
button{font-family:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 左上：一時停止と4指標 */
.tl{position:fixed;top:16px;left:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start;z-index:2}
.tlrow{display:flex;gap:8px;align-items:center}
.pause{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;font-size:13px}
.speed{font-size:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:2px 8px;cursor:pointer;font-family:var(--mono)}
.ind{display:grid;grid-template-columns:auto 80px 2.2em;gap:3px 8px;font-size:11.5px;align-items:center;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:6px 8px;border-radius:10px}
.ind .bar{height:6px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.ind .bar i{display:block;height:100%;background:var(--gray);width:0;transition:width .3s}
.ind .v{font-family:var(--mono);text-align:right;color:var(--muted)}
.ind .short{display:none}

/* 上中央：時間 */
.time{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 600px));min-width:320px;text-align:center;z-index:2;background:color-mix(in srgb,var(--bg) 82%,transparent);border-radius:12px;padding:4px 8px 6px}
.tdate{display:flex;align-items:baseline;justify-content:center;gap:12px}
.tdate b{font-size:22px;font-weight:700}
.tdate .m{font-size:16px}
.tdate .clock{font-family:var(--mono);font-size:14px;border:1.5px solid var(--line);border-radius:8px;padding:0 6px}
.tdate .clock.closed{color:var(--muted);border-color:var(--soft)}
.tbar{display:flex;gap:1px;margin-top:6px;height:12px}
.tbar .y{display:flex;gap:1px;flex:1}
.tbar .y + .y{margin-left:5px}
.tbar i{flex:1;background:var(--soft2);border:1px solid var(--soft);border-radius:2px;position:relative;overflow:hidden}
.tbar i.past{background:var(--gray);border-color:var(--gray)}
.tbar i.now{border-color:var(--ink)}
.tbar i.now b{position:absolute;left:0;top:0;bottom:0;background:var(--gray)}
.tbar i.mark::after{content:"";position:absolute;left:50%;bottom:-1px;width:4px;height:4px;transform:translateX(-50%) rotate(45deg);background:var(--danger)}
.tlabels{position:relative;height:16px;font-size:10.5px;color:var(--muted);margin-top:2px}
.tlabels span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tnote{font-size:12px;color:var(--muted)}

/* 右上：お金 */
.hud{position:fixed;top:14px;right:16px;text-align:right;line-height:1.4;pointer-events:none;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:4px 6px;border-radius:10px;z-index:2}
.money{font-size:32px;font-family:var(--mono);display:flex;align-items:center;gap:8px;justify-content:flex-end}
.money.neg{color:var(--danger)}
.money small{font-size:13px;font-family:var(--font)}
.chip{display:inline-block;width:.62em;height:.62em;border-radius:50%;border:.17em solid currentColor;flex:none}
.money .chip{border-color:var(--ink)}
.hud .sub{font-size:13.5px}
.hud .tiny{font-size:12px;color:var(--muted)}
.mixbar{display:flex;flex-direction:column;align-items:flex-end;gap:2px;margin:3px 0}
.mixbar .bar{display:flex;width:170px;height:8px;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.mixbar .bar i{display:block;height:100%}
.mixbar .lg{font-size:11px;color:var(--muted)}
.seg-regular{background:var(--gray)} .seg-newbie{background:var(--bg)} .seg-tourney{background:repeating-linear-gradient(45deg,var(--gray) 0 2px,var(--bg) 2px 5px)}
.hud .risk{font-size:12px;color:var(--danger);margin-top:2px}
.pos{color:var(--good)} .negc{color:var(--danger)}

.flow{position:fixed;right:16px;top:190px;width:250px;background:color-mix(in srgb,var(--bg) 88%,transparent);border:1.5px solid var(--soft);border-radius:12px;padding:8px 10px;font-size:12px;z-index:2}
.fhead{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.frow{display:grid;grid-template-columns:5.2em 1fr 3.6em;gap:6px;align-items:center;margin:3px 0}
.frow b{font-family:var(--mono);font-weight:500;text-align:right}
.frow .fb{height:9px;border-radius:4px;background:var(--soft2);overflow:hidden}
.frow .fb i{display:block;height:100%;width:0;transition:width .6s ease-out}
.frow.in .fb i{background:var(--good)} .frow.in b{color:var(--good)}
.frow.out .fb i{background:var(--danger);opacity:.75} .frow.out b{color:var(--danger)}
.fnet{border-top:1px solid var(--soft);margin-top:5px;padding-top:4px;text-align:right}
.fnet b{font-family:var(--mono);font-size:14px}
.why{font-size:11.5px;line-height:1.6;margin-top:5px;border-top:1px dashed var(--soft);padding-top:4px}
.why:empty{display:none}
.choke{font-size:11.5px;line-height:1.55;margin-top:5px;border-top:1px dashed var(--soft);padding-top:4px}
.choke:empty{display:none}
.choke b{color:var(--danger)}
.why .up{color:var(--good)} .why .dn{color:var(--danger)}
.toast{position:fixed;top:120px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;max-width:min(520px,calc(100vw - 32px));z-index:2}
.toast div.bad{border-color:var(--danger);color:var(--danger)}
.toast div.good{border-color:var(--good);color:var(--good)}
.toast div{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:3px 10px;font-size:13px;animation:fade 4.5s forwards;text-align:center}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

.dockwrap{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100vw - 24px);z-index:2}
.tag{border:1.5px solid var(--line);border-radius:9px;padding:1px 9px;font-size:12px;background:var(--bg);min-height:20px}
.tag:empty{visibility:hidden}
.dock{display:flex;gap:12px;border:2px solid var(--line);border-radius:18px;padding:12px 14px 8px;background:var(--bg);overflow-x:auto;max-width:100%}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;padding:0;position:relative;min-width:58px}
.act .ic{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--bg);box-shadow:3px 4px 0 var(--shadow);font-size:19px;font-weight:700;transition:transform .08s}
.act.on .ic{border-width:4px}
.act.on .c{font-weight:700}
.act:active .ic{transform:translateY(2px)}
.act .k{position:absolute;left:0;top:36px;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:10px;display:grid;place-items:center;font-family:var(--mono)}
.act .c{font-size:11.5px;white-space:nowrap}
.act svg{width:23px;height:23px}

/* 画面（モーダル） */
.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 86%,transparent);display:none;place-items:center;padding:16px;overflow:auto;z-index:10}
.ov.show{display:grid}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 22px 18px;width:min(740px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:6px 8px 0 var(--shadow)}
.card h1{font-size:23px;font-weight:700;margin:0 0 6px}
.card h2{font-size:13px;font-weight:700;margin:18px 0 8px;letter-spacing:.06em}
.card p{margin:6px 0;font-size:14px;line-height:1.75}
.kicker{font-size:12px;color:var(--muted);letter-spacing:.08em}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.opt{position:relative;border:1.5px solid var(--soft);border-radius:12px;padding:10px 12px;background:var(--bg);text-align:left;cursor:pointer;font-size:13px;line-height:1.55;transition:box-shadow .1s,transform .1s}
.opt:hover{border-color:var(--line)}
.opt b{display:block;font-size:14px;margin-bottom:2px}
.opt small{color:var(--muted);display:block}
.opt[aria-pressed="true"]{border:2.5px solid var(--ink);box-shadow:4px 5px 0 var(--ink);transform:translate(-2px,-2px)}
.opt[aria-pressed="true"]::before{content:"✓";position:absolute;top:-10px;left:-10px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1}
.stylelist{display:flex;flex-direction:column;gap:8px}
.stylelist .opt{display:grid;grid-template-columns:1fr auto 14px;gap:12px;align-items:center;padding-right:0;overflow:visible}
.stylelist .stripe{align-self:stretch;margin:-10px 0 -10px 0;border-radius:0 10px 10px 0}
.stripe.black,.tsw.black{background:#111}
.stripe.gray,.tsw.gray{background:#9a9a9a}
.stripe.clean,.tsw.clean{background:var(--good)}
.tsw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin:6px 2px 0;flex-wrap:wrap}
.okc{color:var(--good);font-weight:700}
.riskcol{font-size:11.5px;text-align:right;font-family:var(--mono);white-space:nowrap}
.arrow{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;margin:4px 2px 0}
.choice{display:block;width:100%;margin:6px 0}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;font-size:18px}
.stepper output{font-size:28px;min-width:2ch;text-align:center;font-family:var(--mono)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{border:2px solid var(--line);border-radius:999px;padding:9px 20px;background:var(--bg);cursor:pointer;font-size:14px}
.btn.primary{border-width:3px;font-weight:700;box-shadow:3px 4px 0 var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
table.t td,table.t th{border-bottom:1px solid var(--soft);padding:5px 6px;text-align:right}
table.t td:first-child,table.t th:first-child{text-align:left}
table.t td:not(:first-child){font-family:var(--mono)}
table.t tr.total td{font-weight:700;border-top:1.5px solid var(--line)}
details{border-top:1px solid var(--soft);margin-top:10px;padding-top:8px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.prov{margin:8px 0;padding:8px 10px;border-left:2px solid var(--line);font-size:12.5px;line-height:1.7}
.prov a{color:inherit}
.big{font-size:42px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;font-family:var(--mono)}
.big small{font-size:15px;font-family:var(--font)}
.timeline{font-size:12.5px;line-height:1.8;max-height:200px;overflow:auto;border:1px solid var(--soft);border-radius:10px;padding:8px 12px;margin-top:8px}
.foot{font-size:11px;color:var(--muted);margin-top:14px;line-height:1.6}
.slider{display:grid;grid-template-columns:4.5em 1fr 4.5em;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.slider input{width:100%;accent-color:var(--gray)}
/* 営業時間ゲージ（1本・つまみ2つ） */
.gauge{position:relative;height:46px;margin:26px 4px 26px;user-select:none;touch-action:none}
.gauge .track{position:absolute;left:0;right:0;top:14px;height:18px;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--ink)}
.gauge .range{position:absolute;top:14px;height:18px;border:2.5px solid var(--ink);border-radius:9px;background:color-mix(in srgb,var(--ink) 8%,transparent);pointer-events:none}
.gauge .legal{position:absolute;top:6px;height:34px;border-left:2px dashed var(--danger)}
.gauge .legal span{position:absolute;top:44px;left:-2px;transform:translateX(-50%);font-size:10px;color:var(--danger);white-space:nowrap}
.gauge .h{position:absolute;top:8px;width:22px;height:30px;margin-left:-11px;border:2px solid var(--line);border-radius:7px;background:var(--bg);cursor:grab;box-shadow:2px 3px 0 var(--shadow);display:grid;place-items:center;font-size:9px}
.gauge .h:focus{outline:2px solid var(--ink);outline-offset:2px}
.gauge .tick{position:absolute;top:36px;font-size:10px;color:var(--muted);transform:translateX(-50%);font-family:var(--mono)}
.gauge .lbl{position:absolute;top:-18px;font-size:11px;transform:translateX(-50%);white-space:nowrap;font-family:var(--mono);font-weight:500}
.warn{color:var(--danger);font-size:12.5px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:6px 0;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.grid2 span:nth-child(even){text-align:right;font-family:var(--mono)}
.rank{font-size:12.5px;line-height:1.7;margin:0;padding-left:1.4em}
.rank li{font-family:var(--mono)}
.card.titlecard{width:min(860px,100%);padding:30px 30px 22px}
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:center}
.hero h1{font-size:clamp(26px,3.3vw,38px);line-height:1.25;margin:6px 0 10px}
.hero .lead{font-size:15px;line-height:1.8}
.hero canvas{width:100%;height:280px;display:block}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.tile{border:1.5px solid var(--soft);border-radius:12px;padding:10px 12px}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:22px;margin:2px 0}
.tile .s{font-size:12px;color:var(--muted);line-height:1.5}
.traps{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.traps li{font-size:13px;line-height:1.6;padding-left:22px;position:relative}
.traps li::before{content:"!";position:absolute;left:0;top:1px;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--danger);color:var(--danger);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.best{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1.5px solid var(--line);margin-top:18px;padding:12px 0 6px;flex-wrap:wrap;position:sticky;bottom:-22px;background:var(--panel)}
.best .amt{font-family:var(--mono);font-size:28px}
.start{font-size:17px;padding:12px 34px}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero canvas{height:220px}.tiles{grid-template-columns:1fr}}
.steps{display:flex;gap:6px;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.steps span.on{color:var(--ink);font-weight:700}
@media (max-width:900px){
  .flow{top:auto;bottom:250px;left:12px;right:12px;width:auto;padding:5px 8px;font-size:11px}.frow{margin:1px 0}.fhead{display:none}
  .time{top:auto;bottom:150px;width:calc(100vw - 24px);min-width:0}
  .toast{top:100px}
}
@media (max-width:720px){
  .toast{top:190px}
  .money{font-size:24px}.hud{top:10px;right:10px}.tl{top:10px;left:10px}
  .ind{grid-template-columns:repeat(4,auto auto);gap:2px 4px;font-size:11px;padding:4px 6px;cursor:pointer}.ind .bar{display:none}.ind .full{display:none}.ind .short{display:inline}.ind .v{color:var(--ink)}
  .act .ic{width:42px;height:42px;font-size:16px}.act{min-width:46px}.act .k{top:28px}.dock{gap:6px;padding:10px 8px 6px}
  .time{bottom:140px}.tdate b{font-size:18px}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="tl">
  <div class="tlrow"><button class="pause" id="pauseBtn" aria-label="一時停止">II</button><button class="speed" id="speedBtn">×1</button></div>
  <div class="ind" id="ind"></div>
</div>

<div class="time" id="timeBox" aria-live="polite">
  <div class="tdate"><b id="tYear">開業前</b><span class="m" id="tMonth"></span><span class="clock" id="tClock">--:--</span></div>
  <div class="tbar" id="tbar"></div>
  <div class="tlabels" id="tlabels"></div>
  <div class="tnote" id="tNote"></div>
</div>

<div class="hud" aria-live="polite">
  <div class="money" id="money"><span class="chip"></span><span id="moneyV">0</span><small>万円</small></div>
  <div class="sub">今月 <span class="num" id="netV">0</span> 万円</div>
  <div class="tiny"><span class="num" id="guestV">0</span> 人/日 ・ 満席率 <span class="num" id="occV">0</span>%</div>
  <div class="mixbar" id="mixV"></div>
  <div class="tiny">いまの店の値段 <span id="valueV">—</span></div>
  <div class="tiny" id="styleV"></div>
  <div class="tiny" id="debtV"></div>
  <div class="risk" id="riskV"></div>
</div>

<div class="flow" id="flow" aria-label="今月の収支">
  <div class="fhead"><span id="flowMonth">今月</span>の収支（万円）</div>
  <div class="frow in"><span>売上</span><span class="fb"><i></i></span><b>0</b></div>
  <div class="frow out"><span>原価・決済</span><span class="fb"><i></i></span><b>0</b></div>
  <div class="frow out"><span>家賃</span><span class="fb"><i></i></span><b>0</b></div>
  <div class="frow out"><span>人件費</span><span class="fb"><i></i></span><b>0</b></div>
  <div class="frow out"><span>その他</span><span class="fb"><i></i></span><b>0</b></div>
  <div class="fnet">差し引き <b id="flowNet">—</b></div>
  <div class="why" id="flowWhy"></div>
  <div class="choke" id="flowChoke"></div>
</div>
<div class="toast" id="toast"></div>

<div class="dockwrap">
  <div class="tag" id="tag"></div>
  <div class="dock" id="dock">
    <button class="act" data-a="ad"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h3l5 4V6L6 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg></span><span class="k">1</span><span class="c" id="adC">広告</span></button>

let S = null;

/* 同じ条件で再挑戦：外の出来事（物件の当たり外れ・競合・トラブル・事件・摘発・調査）は、条件コード×月×種類で決まる */

  const ind = { ...IND.start };
  for (const src of [hiring.start, contact.start]) for (const [k, v] of Object.entries(src || {})) ind[k] = clamp(ind[k] + v, 0, 100);
  const st = {
    cfg, loc, hiring, policy, contact, fac: [...(cfg.fac || [])], mix: { ...D.mixStart }, mixStart: { ...D.mixStart }, choke: [], chokeCount: { seat: 0, staff: 0, demand: 0, retain: 0 }, lostGuests: 0, style: byId(STYLES, cfg.style),
    tables: cfg.tables, capacity: cfg.tables, area: b.area, rent: b.rent, deposit: b.deposit, fitout: b.fitout, tablesValue: b.tablesCost,
    open: cfg.open, close: cfg.close, price: cfg.price, ad: 0,

    ops: [], last: { guests: 0, occ: 0, rev: 0, net: 0 }, peakMonth: -Infinity,
    year: { rev: 0, op: 0 }, recs: [], q: [], log: [], timeline: [], over: null, paused: false, speed: 1, ddNotified: false,

  { const saved = S; S = st; st.share = Math.max(0.3, 1 + hgauss(`share:${loc.id}`) * loc.demandSd); S = saved; }
  st.startCash = st.cash; st.prevCash = st.cash; st.invest = M.fund - st.cash;
  st.autoHire = true;
  { const n = Math.round(cfg.tables * (cfg.hiring === "lean" ? SS.leanPerTable : SS.perTable) * (cfg.close - cfg.open) / O.baseHours); const saved = S; S = st; st.staffList = Array.from({ length: n }, () => makeStaff(cfg.hiring, loc)); S = saved; }

}
function logEv(type, data){ S.log.push({ t: S.month, type, ...data }); }

const monthLabel = (t) => `${Math.floor(t / 12) + 1}年目${(t % 12) + 1}か月`;

/* ---------- 計算 ---------- */
const isOpen = () => S.licensed || S.unlicensed;
const stopped = (id) => (S.stopUntil[id] || 0) > S.month;
function styleNow(){ return stopped(S.style.id) ? byId(STYLES, "deposit") : S.style; }
function demandMult(legalOnly){
  const i = S.ind;
  let m = (0.82 + 0.6 * i.fame / 100) * (0.8 + 0.4 * i.comfort / 100); // 開業時（知名度30・居心地50）で1.0
  m *= Math.pow(S.price, -O.price.elasticity) * S.contact.demand * FX().demand * (1 - SEG.regularDemandBonus / 2 + SEG.regularDemandBonus * S.mix.regular); // 常連が厚いほど客が客を呼ぶ

  for (const t of S.tempDemand) m *= t.mult;

}
function ramp(){ const t = S.openedAt == null ? 0 : S.month - S.openedAt; return Math.min(1, O.rampStart + (1 - O.rampStart) * t / O.rampMonths); }
const hoursLen = () => S.close - S.open;
/* 1店舗ぶんの計算（本店と2号店で共用）。ブランド（指標・客層・コンセプト・営業スタイル・営業時間・料金）は共通 */
function storeCalc(st, legalOnly){
  const svc = clamp(0.76 + S.ind.slack / 250, 0.76, 1); // 余力が低いと、さばききれずに客を逃す
  // 本店：スタッフが足りなければその分の卓は開けられない。熟練するほど卓が速く回る
  const ssx = st.main && S.staffList ? staffStats() : null, fill = ssx && ssx.need ? Math.min(1, ssx.count / ssx.need) : 1;

/* リスクの源：営業スタイル（黒・グレー）、深夜営業、無許可 */
function riskSources(){
  if (!isOpen()) return [];
  const out = [], st = styleNow();
  if (st.tier !== "clean") out.push({ id: st.id, short: st.name, tier: st.tier, arrest: st.arrest, growth: st.arrestGrowth, order: st.order, prov: st.provisionIds, style: st });

}
function risks(){
  let arrest = 0, order = 0;
  const act = riskSources();
  const jumpOf = (tier) => Math.pow(tier === "black" ? R.orderJump : R.orderJumpGray, S.orders); // グレーは是正指摘が中心で、摘発率の上がり方は穏やか

function dcfParts(rr, gg){
  const recent = S.ops.slice(-12);
  const fcfMonth = (recent.length ? recent.reduce((a, b) => a + b, 0) / recent.length : 0) - O.maintenancePerTable * (S.tables + (S.branch ? S.branch.tables : 0));

  let orderActs = null;
  if (wasOpen && S.openedAt == null){ S.openedAt = S.month; story(S.licensed ? "許可が下り、開業した。" : "許可を待たずに開業した。"); }
  const p = wasOpen ? project() : { demand: 0, occ: 0, guests: 0, rev: 0, op: -S.rent, interest: 0, net: -S.rent, rent: S.rent, varCost: 0, other: 0, staff: 0 };
  expansionTick(wasOpen);
  S.cash += p.net; S.last = p;
  if (wasOpen){ S.ops.push(p.op); S.year.rev += p.rev; S.year.op += p.op; S.peakMonth = Math.max(S.peakMonth, p.net); }
  logEv("month", { net: Math.round(p.net), guests: Math.round(p.guests), occ: +p.occ.toFixed(3), style: styleNow().id });

  if (wasOpen){
    const rk = risks();
    for (const a of rk.active){ S.used[a.id] = (S.used[a.id] || 0) + 1; S.lastUsed[a.id] = S.month; S.riskMonths.push({ t: S.month, id: a.id, tier: a.tier }); }
    if (hr("arrest") < rk.arrest){ logEv("arrest", {}); story("摘発された。"); spawnPolice(); S.month++; rec(p, wasOpen); return finish("arrest"); }
    if (rk.active.length && hr("order") < rk.order) orderActs = rk.active;
  }
  const i = S.ind;
  if (wasOpen){
    i.fame = clamp(i.fame + O.ads[S.ad].fame + FX().fameGain * 0.5 + (p.occ > 0.8 ? 0.5 : 0), 0, 100);
    // 採用方式（経験者＋10／未経験−5、教育で育つ／少人数−20）を毎月の余力の戻り先に入れる
    const ssx = staffStats(), fill = ssx.need ? ssx.count / ssx.need : 1;
    const slackTarget = 85 + clamp((fill - 1) * 60, -30, 15) + (ssx.skill - 3) * 5 + (ssx.manager ? 5 : 0) + FX().slackTarget - 70 * Math.max(0, p.occ - 0.5) / 0.4 - Math.max(0, hoursLen() - 10) * 3;
    i.slack = clamp(i.slack + (slackTarget - i.slack) * 0.2, 0, 100);
    i.comfort = clamp(i.comfort + ((50 + (i.slack - 50) * 0.4 + S.policy.comfortTarget + FX().comfortTarget + (staffStats().host - 3) * 4 - S.mix.tourney * 10) - i.comfort) * 0.1, 0, 100);
    i.trust = clamp(i.trust + ((50 + S.policy.trustTarget + FX().trustTarget) - i.trust) * 0.04, 0, 100);
    updateMix();
    staffMonthly();
  }
  S.tempDemand = S.tempDemand.filter((t) => --t.months > 0);
  if (S.rumor > 0) S.rumor--;
  if (S.shock > 0) S.shock--;
  if (S.licenseWait > 0){ S.licenseWait--; if (S.licenseWait === 0){ S.licensed = true; S.unlicensed = false; note("許可が下りた。", "good"); logEv("licensed", {}); } }

  if (wasOpen && hr("comp") < S.loc.competition.p){ S.competitors++; S.share *= 1 - S.loc.competition.hit * (1 - SEG.regularCompShield * S.mix.regular); note(`近くに競合店が開業した（需要 −${Math.round(S.loc.competition.hit * 100)}%）`, "bad"); story("近くに競合店が開業した。"); }
  const trP = S.loc.troubleP * S.hiring.trouble * (i.slack < 30 ? 1.5 : 1);
  if (wasOpen && hr("trouble") < trP){
    if (hr("trouble", 1) < 0.5){ const c = (O.trouble.costMin + hr("trouble", 2) * (O.trouble.costMax - O.trouble.costMin)) * (1 + S.tables / 10); S.cash -= c; const t = D.troubleTexts[Math.floor(hr("trouble", 3) * D.troubleTexts.length)]; note(`${t}（${yen(-c)}）`, "bad"); story(`${t}。${yen(c)}かかった。`); logEv("trouble", { cost: Math.round(c) }); }
    else { S.shock = O.trouble.shockMonths; const t = D.shockTexts[Math.floor(hr("trouble", 3) * D.shockTexts.length)]; note(`${t}（3か月 売上−30%）`, "bad"); story(`${t}。`); logEv("shock", {}); }
  }
  for (const pd of S.pending.filter((x) => x.at <= S.month)){ applyEffects(pd.effects || {}); note(`後日談：${pd.text}`); story(`後日談：${pd.text}`); }
  S.pending = S.pending.filter((x) => x.at > S.month);

  S.month++;
  if (wasOpen) judgeChoke(p);
  rec(p, wasOpen);
  flowAnim(p, wasOpen);
  explainMonth();
  if (S.cash < M.bankruptAt){ story("資金が尽きた。"); return finish("bankrupt"); }
  if (orderActs) enqueue(() => order(orderActs));
  if (S.month >= M.months) enqueue(proposal);
  else {
    if (S.month % 12 === 0) enqueue(annual);
    if (S.month >= R.ddStart && !S.ddNotified){ S.ddNotified = true; enqueue(offer); }
    if (wasOpen && !orderActs) maybeEvent();
  }
  if (S.q.length && !ov.classList.contains("show")) S.q.shift()();
  saveGame();
}
/* 月ごとの記録（結果画面のシミュレーション表示に使う）。extra＝営業損益以外の出入り（トラブル・事件・増卓・教育・借入・是正対応費など） */
function rec(p, wasOpen){
  const other = wasOpen ? p.other : 0;
  S.recs.push({ t: S.month - 1, open: wasOpen, guests: p.guests || 0, occ: p.occ || 0, rev: p.rev || 0, rent: p.rent || S.rent, staff: wasOpen ? p.staff : 0, other,
    interest: p.interest || 0, net: p.net, extra: S.cash - S.prevCash - p.net, cash: S.cash, share: S.share, tables: S.tables });
  S.prevCash = S.cash;
}
/* 客層の動き：初心者は居心地しだいで常連に育ち、常連は居心地・信頼が低いと離れる。大会客はコンセプトと知名度で決まる */
function normMix(){ const t = S.mix.regular + S.mix.newbie + S.mix.tourney; for (const k of ["regular", "newbie", "tourney"]) S.mix[k] /= t; }
function updateMix(){
  const i = S.ind, m = S.mix;
  const conv = SEG.baseConvert * FX().convert * (1 + (staffStats().teach - 3) * 0.15) * (i.comfort / 50) * m.newbie;
  const churn = SEG.baseChurn * (1 + Math.max(0, 50 - i.comfort) / 50 + Math.max(0, 50 - i.trust) / 50) * m.regular;
  m.regular += conv - churn; m.newbie += churn - conv;
  const tt = FX().tourney + (i.fame - 30) / 100 * SEG.tourneyFameBonus;
  m.tourney += (tt - m.tourney) * SEG.tourneyAdjust;
  for (const k of ["regular", "newbie", "tourney"]) m[k] = Math.max(0.02, m[k]);
  normMix();
}
function enqueue(fn){ S.q.push(fn); S.paused = true; }
function applyEffects(e){
  const i = S.ind;
  for (const k of ["fame", "trust", "comfort", "slack"]) if (e[k]) i[k] = clamp(i[k] + e[k], 0, 100);
  if (e.cash) S.cash += e.cash;
  if (e.demand) S.tempDemand.push({ mult: e.demand.mult, months: e.demand.months });
  if (e.closeDelta) S.close = clamp(S.close + e.closeDelta, S.open + 4, O.closeMax);
  if (e.contactBan) S.contact = byId(ST.contact, "ban");
  if (e.mix){ for (const [k, v] of Object.entries(e.mix)) S.mix[k] = Math.max(0.02, (S.mix[k] || 0) + v); normMix(); }
}

/* ---------- 是正指摘 ---------- */
function order(acts){
  S.orders++;
  const cost = Math.max(R.orderCostMin, Math.max(0, project(true).op) * R.orderCostMonths);
  S.cash -= cost; S.ind.trust = clamp(S.ind.trust + R.orderTrust, 0, 100); S.rumor = R.orderRumorMonths;
  for (const a of acts){
    if (a.id === "latenight") S.close = O.legalClose;
    else if (a.style) S.stopUntil[a.id] = S.month + R.orderStopMonths;
  }
  logEv("order", { acts: acts.map((a) => a.id), cost: Math.round(cost) });
  story(`${R.labels.order}を受けた（${acts.map((a) => a.short).join("・")}）。${R.labels.orderCost} ${yen(cost)}。`);
  spawnPolice();
  pauseWith(() => show(`
    <div class="kicker">${monthLabel(S.month - 1)}</div><h1>${esc(R.labels.order)}</h1>
    <p>${acts.map((a) => esc(a.short)).join("、")}について指摘を受けた。</p>
    <table class="t"><tr><td>${esc(R.labels.orderCost)}</td><td>${yen(cost)}</td></tr>
      <tr><td>信頼</td><td>${R.orderTrust}</td></tr>
      <tr><td>営業スタイル</td><td>${acts.some((a) => a.style) ? `${R.orderStopMonths}か月「預入のみ」になる` : "そのまま"}</td></tr>
      <tr><td>風評（売上）</td><td>${R.orderRumorMonths}か月 −${Math.round(R.orderRumor * 100)}%</td></tr>
      <tr><td>以後の摘発率</td><td>${acts.some((a) => a.tier === "black") ? "×" + Math.pow(R.orderJump, S.orders) : "×" + Math.pow(R.orderJumpGray, S.orders).toFixed(2)}</td></tr>
      <tr><td>店の値段（DCFの割引率）</td><td>+${Math.round(V.discountPerOrder * 100)}%</td></tr></table>
    <p class="muted" style="font-size:12px">${esc(R.note)}</p>
    <details><summary>参考：実際の条文（このゲームの処分モデルの根拠ではない）</summary>${provHTML([...new Set(acts.flatMap((a) => a.prov))])}</details>
    <div class="row"><button class="btn primary" id="okBtn">営業を続ける</button></div>`, () => { $("okBtn").onclick = resume; }));
}

/* ---------- 事件 ---------- */
function eligible(ev){
  const w = ev.when || {};
  if (S.eventsSeen.has(ev.id)) return false;
  if (w.minMonth && S.month < w.minMonth) return false;
  if (w.minFame && S.ind.fame < w.minFame) return false;
  if (w.maxSlack && S.ind.slack > w.maxSlack) return false;
  if (w.minOcc && S.last.occ < w.minOcc) return false;
  if (w.minClose && S.close < w.minClose) return false;
  if (w.contact && S.contact.id !== w.contact) return false;
  return true;
}
function maybeEvent(){
  if (hr("event") > D.eventChance) return;
  const list = D.events.filter(eligible);
  if (!list.length) return;
  const wts = list.map((e) => FX().eventBias[e.id] || 1), tot = wts.reduce((a, b) => a + b, 0);
  let r = hr("event", 1) * tot, ev = list.at(-1); for (let k = 0; k < list.length; k++){ if (r < wts[k]){ ev = list[k]; break; } r -= wts[k]; }
  S.eventsSeen.add(ev.id);
  enqueue(() => pauseWith(() => {
    show(`<div class="kicker">${monthLabel(S.month)} ・ 事件</div><h1>${esc(ev.title)}</h1><p>${esc(ev.omen)}</p>
      <h2>どうする？</h2>${ev.choices.map((c, k) => `<button class="opt choice" data-k="${k}"><b>${esc(c.label)}</b></button>`).join("")}`);
    card.querySelectorAll(".choice").forEach((b) => b.onclick = () => decide(ev, ev.choices[+b.dataset.k]));
  }));
}
function decide(ev, c){
  if (c.whenNotClean && styleNow().tier !== "clean"){
    // 黒・グレーで営業しているのに「していない」と説明した場合は、裏目に出る
    const w = c.whenNotClean; c = { ...c, effects: { ...(c.effects || {}), ...(w.effects || {}) }, text: w.text, outcomes: null };
    if (w.orderChance && hr("event", 2) < w.orderChance){ const acts = riskSources(); if (acts.length) S.q.unshift(() => order(acts)); }
  }
  if (c.effects) applyEffects(c.effects);
  let text = c.text || "", later = c.later;
  if (c.outcomes){
    let r = hr("outcome"), o = c.outcomes.at(-1);
    for (const x of c.outcomes){ if (r < x.p){ o = x; break; } r -= x.p; }
    if (o.effects) applyEffects(o.effects);
    text = (text ? text + " " : "") + o.text; if (o.later) later = o.later;
  }
  if (later) S.pending.push({ at: S.month + later.months, text: later.text, effects: later.effects });
  logEv("event", { id: ev.id, choice: c.label });
  story(`${ev.title} → 「${c.label}」。${text}`);
  show(`<div class="kicker">${monthLabel(S.month)} ・ 結果</div><h1>${esc(c.label)}</h1><p>${esc(text)}</p>
    ${later ? `<p class="muted" style="font-size:12.5px">この判断は、後から効いてくるかもしれない。</p>` : ""}
    <div class="row"><button class="btn primary" id="okBtn">営業に戻る</button></div>`, () => { $("okBtn").onclick = resume; });
  saveGame();
  if (TEST) autoClick();
}

/* ---------- バリュエーション：DCF・類似取引比較・清算価値 → 中央値（清算価値が下限） ---------- */
const CP = D.comps, LQ = D.liquidation;
const pctile = (arr, q) => { const a = [...arr].sort((x, y) => x - y), i = (a.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i); return a[lo] + (a[hi] - a[lo]) * (i - lo); };
function ltm(){ const r = S.recs.filter((x) => x.open).slice(-12); return { sales: r.reduce((a, x) => a + x.rev, 0), ebitda: r.reduce((a, x) => a + x.net + x.interest, 0), months: r.length }; }
function valuation(dd){
  const dep = deposits(), months = S.openedAt == null ? 0 : S.month - S.openedAt;
  // DCF と感応度
  const d = dcfParts(), sens = [];
  for (const dr of [-V.sensR, 0, V.sensR]){ const row = []; for (const dg of [-V.sensG, 0, V.sensG]) row.push(dcfParts(d.r + dr, clamp(d.g + dg, -0.1, 0.2)).ev + dep); sens.push(row); }
  const flat = sens.flat(), dcf = { point: d.ev + dep, lo: Math.min(...flat), hi: Math.max(...flat), d, sens };
  // 類似取引比較
  const L12 = ltm(), seats = (S.tables + (S.branch ? S.branch.tables : 0)) * 9 + (S.fc ? S.fc.count * 18 : 0);
  const m = { ebitda: CP.deals.map((x) => x.ev / x.ebitda), sales: CP.deals.map((x) => x.ev / x.sales), seat: CP.deals.map((x) => x.ev / (x.tables * 9)) };
  const A = CP.adjust, mgr = d.mgr;
  const adj = clamp(1 + (S.ind.trust - 50) / A.trust + (S.mix.regular - 0.4) * A.regular + (mgr ? 0 : A.noManager), A.min, A.max);
  const distress = L12.ebitda <= 0 ? A.distress : 1;
  const implied = (q) => {
    const v = [];
    if (L12.ebitda > 0) v.push(pctile(m.ebitda, q) * L12.ebitda);
    if (L12.sales > 0) v.push(pctile(m.sales, q) * L12.sales * distress);
    v.push(pctile(m.seat, q) * seats * distress * (L12.months >= 6 ? 1 : 0.5));
    return Math.max(0, pctile(v, 0.5) * adj) + dep;
  };
  const comps = { point: implied(0.5), lo: implied(0.25), hi: implied(0.75), adj, distress, L12, seats, mult: { ebitda: pctile(m.ebitda, 0.5), sales: pctile(m.sales, 0.5), seat: pctile(m.seat, 0.5) } };
  // 清算価値（帳簿の純資産と、急いで売る清算価値）
  const fitBook = (S.fitout + (S.branch ? S.branch.fitout : 0)) * Math.max(0, 1 - months / LQ.fitoutLifeMonths);
  const tabBook = (S.tablesValue + (S.branch ? S.branch.tablesValue : 0)) * Math.max(0, 1 - months / LQ.tableLifeMonths);
  const area = S.area + (S.branch ? (S.branch.tables * L.tsuboPerTable + L.commonTsubo) : 0), restore = area * LQ.restorePerTsubo;
  const book = dep + fitBook + tabBook, liquid = Math.max(0, dep - restore + (S.tablesValue + (S.branch ? S.branch.tablesValue : 0)) * LQ.tableSale + fitBook * LQ.fitoutSale);
  const liq = { point: liquid, lo: liquid, hi: Math.max(liquid, book), book, liquid, dep, fitBook, tabBook, restore };
  // 買収前調査
  let use = { dcf: dcf.point, comps: comps.point }, note = "";
  if (dd && dd.kind === "shell"){ use = null; note = V.shellMessage; }
  else if (dd && dd.kind === "cut"){ use = { dcf: dcf.point * dd.cut, comps: comps.point * dd.cut }; note = `グレーな運営（${dd.name}）が見つかり、DCFと類似取引比較を${Math.round(dd.cut * 100)}%に減額した。`; }
  const median = use ? pctile([use.dcf, use.comps, liq.point], 0.5) : liq.point;
  const adopted = Math.max(median, liq.point);
  return { dcf, comps, liq, use, median, adopted, floor: adopted > median, note, dd };
}
function footballField(v){
  const items = [["DCF", v.dcf.lo, v.dcf.hi, v.use ? v.use.dcf : null], ["類似取引比較", v.comps.lo, v.comps.hi, v.use ? v.use.comps : null], ["清算価値", v.liq.lo, v.liq.hi, v.liq.point]];
  const max = Math.max(1, ...items.map((x) => x[2]), v.adopted) * 1.08, w = 680, left = 120, right = w - 20, X = (x) => left + x / max * (right - left);
  const h = 40 + items.length * 40 + 30;
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((q) => max * q);
  return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="フットボールフィールド" style="width:100%;height:auto;font-family:var(--font)">
    ${ticks.map((t) => `<line x1="${X(t)}" x2="${X(t)}" y1="20" y2="${h - 26}" stroke="var(--soft)"/><text x="${X(t)}" y="${h - 10}" font-size="10" text-anchor="middle" fill="var(--muted)">${Math.round(t).toLocaleString("ja-JP")}</text>`).join("")}
    ${items.map(([n, lo, hi, pt], i) => { const y = 34 + i * 40; return `<text x="${left - 8}" y="${y + 5}" font-size="12" text-anchor="end" fill="var(--ink)">${n}</text>
      <rect x="${X(lo)}" y="${y - 9}" width="${Math.max(3, X(hi) - X(lo))}" height="18" rx="3" fill="var(--gray)" opacity="${v.use || n === "清算価値" ? 0.55 : 0.15}"><title>${n}：${yen(lo)}〜${yen(hi)}</title></rect>
      ${pt != null ? `<line x1="${X(pt)}" x2="${X(pt)}" y1="${y - 12}" y2="${y + 12}" stroke="var(--ink)" stroke-width="2"/>` : `<text x="${X(lo) + 6}" y="${y + 4}" font-size="10" fill="var(--danger)">不採用</text>`}`; }).join("")}
    <line x1="${X(v.adopted)}" x2="${X(v.adopted)}" y1="16" y2="${h - 26}" stroke="var(--good)" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="${Math.min(X(v.adopted) + 5, right - 90)}" y="14" font-size="11" font-weight="700" fill="var(--good)">採用 ${yen(v.adopted)}</text>
  </svg><p class="muted" style="font-size:11.5px">灰色の帯が各方法の幅（DCF：割引率±${pct(V.sensR)}・成長率±${pct(V.sensG, 0)}、類似取引比較：倍率の下位25%〜上位25%、清算価値：清算〜帳簿）。黒い線が各方法の値、緑の点線が採用額。万円。</p>`;
}
function valuationReport(v, opts = {}){
  const d = v.dcf.d, c = v.comps, q = v.liq, ri = ["−" + pct(V.sensR), "基準", "+" + pct(V.sensR)], gi = ["−" + pct(V.sensG, 0), "基準", "+" + pct(V.sensG, 0)];
  const why = v.use ? (v.floor ? `3つの中央値（${yen(v.median)}）が清算価値を下回ったため、清算価値を採用した（たたんだ方が得なら、それより安くは売らない）。` : `DCF・類似取引比較・清算価値の中央値を採用した。`) : v.note;

function ddCheck(){
  // 黒（換金・深夜営業・無許可）と、グレーを別々に判定する
  const black = S.riskMonths.filter((x) => x.tier === "black");
  const bEarly = black.filter((x) => x.t < R.ddStart).length, bLate = black.filter((x) => x.t >= R.ddStart).length;
  const pBlack = 1 - Math.pow(1 - R.ddEarlyQ, bEarly) * Math.pow(1 - R.ddLateQ, bLate);
  if (black.length && hr("dd") < pBlack) return { kind: "shell", late: bLate, p: pBlack, months: black.length };
  let worst = null;
  for (const st of STYLES.filter((s) => s.tier === "gray")){
    const ms = S.riskMonths.filter((x) => x.id === st.id); if (!ms.length) continue;
    const e = ms.filter((x) => x.t < R.ddStart).length, l = ms.length - e;
    const p = 1 - Math.pow(1 - st.dd.q, e) * Math.pow(1 - st.dd.lateQ, l);
    if (hr("dd", st.id.length) < p && (!worst || st.dd.cut < worst.cut)) worst = { kind: "cut", cut: st.dd.cut, name: st.name, p, months: ms.length };
  }
  return worst || { kind: "none" };
}
function proposal(){
  const dd = ddCheck();

/* ---------- 詰まりの判定：集客不足／席不足／人手不足／定着不足 ---------- */
const CHOKE = {
  seat: { name: "席不足", why: (p) => `席が足りず、1日${Math.round(p.lostSeat)}人を逃している。増卓か、営業時間を延ばすか、値上げで客を絞るか。` },
  staff: { name: "人手不足", why: (p) => `スタッフに余裕がなく、客をさばききれていない（来た客の${Math.round((1 - p.svc) * 100)}%）。教育か、採用か、営業時間を短くするか。` },
  demand: { name: "集客不足", why: (p) => `満席率${Math.round(p.occ * 100)}%で席が余っている。広告か、値下げか、減卓で固定費を下げるか。` },
  retain: { name: "定着不足", why: () => `初心者は来るが常連に育っていない（常連${Math.round(S.mix.regular * 100)}%）。居心地を上げる設備や教育か、接客の方針を見直すか。` },
};
function judgeChoke(p){
  const c = [];
  if (p.lostSeat > p.demand * 0.1) c.push("seat");
  if (p.svc < 0.95) c.push("staff");
  const age = S.openedAt == null ? 0 : S.month - S.openedAt;
  if (p.occ < 0.45 && age >= 6) c.push("demand");
  S.regHist = (S.regHist || []).concat(S.mix.regular).slice(-7);
  if (S.mix.newbie > 0.4 && S.regHist.length >= 7 && S.mix.regular <= S.regHist[0] + 0.01) c.push("retain");
  S.choke = c;
  for (const k of c) S.chokeCount[k] = (S.chokeCount[k] || 0) + 1;
  S.lostGuests = (S.lostGuests || 0) + (p.lostSeat || 0) * O.days;
  const box = $("flowChoke");
  if (box) box.innerHTML = c.length ? `今月の詰まり：${c.map((k) => `<b>${CHOKE[k].name}</b>`).join("・")}<br><span class="muted">${esc(CHOKE[c[0]].why(p))}</span>` : `<span class="okc">今月は大きな詰まりなし</span>`;
}
/* ---------- 結果：設計の振り返り（設計 → 起きたこと → 結果） ---------- */
function causalChains(kind){
  const open = S.recs.filter((r) => r.open), out = [], cc = S.chokeCount || {};
  const avgOcc = open.length ? open.reduce((a, r) => a + r.occ, 0) / open.length : 0;
  if (kind === "bankrupt" && S.openedAt != null && S.month - S.openedAt <= O.rampMonths)
    out.push([`初期投資 ${yen(S.invest)}（開業時の手元資金 ${yen(S.startCash)}）`, `客が育つ前の${S.month - S.openedAt}か月で赤字が続いた`, "資金が尽きた"]);
  if ((cc.seat || 0) >= 6) out.push([`${S.cfg.tables}卓でスタート`, `${cc.seat}か月、席が足りなかった（逃した客 のべ約${Math.round(S.lostGuests).toLocaleString("ja-JP")}人）`, `売上の取りこぼし 約${yen(S.lostGuests * S.loc.spend * S.price)}`]);
  if ((cc.demand || 0) >= 6) out.push([`${S.cfg.tables}卓・${S.loc.name}（坪${S.loc.tsuboRent}万円）`, `${cc.demand}か月、席が余った（平均満席率${Math.round(avgOcc * 100)}%）`, "空いた卓の家賃と人件費が重くなった"]);
  if ((cc.staff || 0) >= 6) out.push([`採用「${S.hiring.name}」・営業${hoursLen()}時間`, `${cc.staff}か月、人手が足りず客をさばけなかった`, "売上の取りこぼしと、トラブルの増加"]);
  if ((cc.retain || 0) >= 6) out.push([`初心者が多い客層（常連${Math.round(S.mixStart.regular * 100)}%で開業）`, `${cc.retain}か月、初心者が常連に育たなかった`, "客数が安定せず、店の値段の成長率も伸びなかった"]);
  const dReg = S.mix.regular - S.mixStart.regular;
  if (dReg > 0.2) out.push([S.fac.includes("lesson") ? "初心者講習スペース・居心地を重視" : "居心地を重視した運営", `常連が${Math.round(S.mixStart.regular * 100)}% → ${Math.round(S.mix.regular * 100)}%に育った`, "客数が安定し、店の値段の成長率が上がった"]);
  if (S.price < 0.95 && (cc.staff || 0) >= 3) out.push([`料金を安く（×${S.price.toFixed(2)}）`, "客は増えたが、スタッフが疲れた", "単価の低さに、接客の負担が見合わなかった"]);
  if (S.style.tier !== "clean") out.push([`営業スタイル「${S.style.name}」`, S.orders ? `${R.labels.order}を${S.orders}回受けた` : "一時的に売上は上がった", S.dd && S.dd.kind !== "none" ? "売るときの調査で見つかり、値段が下がった" : "リスクを抱えたまま営業した"]);
  return out.slice(0, 4);
}
function causalHTML(kind){
  const c = causalChains(kind);
  if (!c.length) return `<p class="muted">大きな因果は見つからなかった。</p>`;
  return `<div style="display:grid;gap:8px">${c.map(([a, b, r]) => `<div style="border:1.5px solid var(--soft);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.6"><span class="muted">設計</span> ${esc(a)}<br><span class="muted">→ 起きたこと</span> ${esc(b)}<br><span class="muted">→ 結果</span> <b>${esc(r)}</b></div>`).join("")}</div><p class="muted" style="font-size:12px">正解は示さない。次の店で、どこを変えて試すか。</p>`;
}
/* ---------- 店のタイプ診断（名前は架空） ---------- */
function shopType(){
  const f = (id) => S.fac.includes(id), m = S.mix, tier = S.style.tier, tb = S.tables;
  const sc = {
    thrill: (tier === "black" ? 4 : tier === "gray" ? 2.5 : 0) + (f("vip") ? 1.5 : 0) + (S.price > 1.15 ? 0.5 : 0) + S.orders * 0.5,
    lounge: (f("bar") ? 2 : 0) + (S.open >= 17 ? 1 : 0) + (S.close >= 24 ? 0.5 : 0) + m.regular,
    arena: m.tourney * 4 + (f("stream") ? 1 : 0) + (f("tournament") ? 1 : 0) + (S.ind.trust > 60 ? 0.5 : 0),
    first: (f("lesson") ? 2 : 0) + Math.max(0, m.regular - S.mixStart.regular) * 4 + (S.ind.comfort > 60 ? 0.5 : 0),
    hall: (tb >= 8 ? 2.5 : tb >= 7 ? 1 : 0) + (S.price < 0.95 ? 1 : 0),
    town: 1.2 + (tb <= 5 ? 1 : 0),
  };
  const id = Object.entries(sc).sort((a, b) => b[1] - a[1])[0][0];
  return byId(TYPES.list, id);
}

  const seats = tables * 9, turns = turnsFor(S.open, S.close, S.policy), hoursF = bandWeight(S.open, S.close) / BASE_W;
  const share = S.recs.length ? S.recs.at(-1).share : S.share;

  const staff = loc.staffPerTable * S.hiring.staffMult * tables * hoursLen() / O.baseHours;
  const wait = S.cfg.unlicensed ? 0 : D.license.waitMonths;

    const rampF = Math.min(1, O.rampStart + (1 - O.rampStart) * (t - wait) / O.rampMonths);
    const occ = Math.min(loc.occCap, loc.demand * share * rampF * dm * hoursF / (seats * turns));

  box.innerHTML = `先月比 <b class="${dNet >= 0 ? "up" : "dn"}">${dNet >= 0 ? "+" : "−"}${Math.round(Math.abs(dNet))}万円</b>${parts.length ? "：" + parts.map(fmt).join("・") : ""}${uc.length ? `<br><span class="muted">きっかけ：${uc.join("・")}</span>` : ""}`;
  if (Math.abs(dNet) >= Math.max(30, Math.abs(a.net) * 0.25) && parts.length){
    const top = parts[0];
    note(`先月より${dNet >= 0 ? "+" : "−"}${Math.round(Math.abs(dNet))}万円。主に${top[0]}${top[1] >= 0 ? "が効いた" : "が響いた"}${uc.length ? `（${uc[0]}）` : ""}`, dNet >= 0 ? "good" : "bad");
  }
}

const SS = D.staffSystem;
function makeStaff(hiringId, locObj){
  const h = SS.hiring[hiringId] || SS.hiring.exp, lo = h.skill[0], hi = h.skill[1];
  const r = (a, b) => a + Math.floor(rand() * (b - a + 1));
  const skill = r(lo, hi), teach = r(Math.max(1, lo - 1), hi), host = r(Math.max(1, lo - 1), hi);
  const base = locObj.staffPerTable / SS.perTable;
  return { id: Math.floor(rand() * 1e9).toString(36), name: SS.names[Math.floor(rand() * SS.names.length)], skill, teach, host,
    wage: Math.round(base * h.wage * (0.95 + 0.025 * (skill + host - 6)) * 10) / 10, morale: 60, months: 0, manager: false, growth: h.growth };
}
function staffNeed(){ return S.tables * SS.perTable * hoursLen() / O.baseHours; }
function staffStats(){
  const st = S.staffList || [], n = st.length || 1, avg = (k) => st.reduce((a, x) => a + x[k], 0) / n;
  return { count: st.length, need: staffNeed(), skill: avg("skill"), teach: avg("teach"), host: avg("host"), morale: avg("morale"), wage: st.reduce((a, x) => a + x.wage, 0), manager: st.find((x) => x.manager) };
}
function staffMonthly(){
  const st = S.staffList; if (!st) return;
  st.forEach((x, i) => {
    x.months++;
    x.morale = clamp(x.morale + ((58 + (S.ind.slack - 50) * 0.5 + (x.manager ? 15 : 0)) - x.morale) * 0.15, 0, 100);
    if (hr(`grow${i}`) < x.growth){ const k = ["skill", "teach", "host"][Math.floor(hr(`growk${i}`) * 3)]; if (x[k] < 5){ x[k]++; } }
  });
  // 退職：士気が低いほど辞めやすい。育ったエースは「退職相談」の事件になる
  for (const [i, x] of [...st].entries()){
    const q = SS.quitBase + Math.max(0, 35 - x.morale) / 300;
    if (hr(`quit${i}`) < q){
      if (x.skill >= 4 && x.months >= 12 && !x.manager){ enqueue(() => quitTalk(x)); break; }
      S.staffList = S.staffList.filter((y) => y !== x); note(`スタッフの${x.name}さんが辞めた`, "bad"); story(`スタッフの${x.name}さんが辞めた（勤続${x.months}か月）。`); logEv("quit", {});

}

const EXB = D.expansion.branch, EXF = D.expansion.fc;

function branchWhyNot(){
  if (S.month < EXB.minMonth) return `開業から${EXB.minMonth}か月後から`;
  if (!healthyNow()) return "健全営業で、直近6か月が黒字であること";
  return "";
}
function fcWhyNot(){
  if (!S.branch || S.branch.openedAt == null) return "2号店が営業していること";
  if (S.month < EXF.minMonth) return `開業から${EXF.minMonth}か月後から`;
  if (S.ind.trust < EXF.trust) return `信頼${EXF.trust}以上（いま${Math.round(S.ind.trust)}）`;
  if (S.ind.fame < EXF.fame) return `知名度${EXF.fame}以上（いま${Math.round(S.ind.fame)}）`;

function wireGauge(cfg, onChange){
  const g = $("gauge"), span = O.closeMax - O.openMin;
  const x = (h) => ((h - O.openMin) / span * 100) + "%";
  const place = () => {
    g.querySelectorAll(".band").forEach((b) => { const f = Math.max(+b.dataset.from, O.openMin), t = Math.min(+b.dataset.to, O.closeMax); b.style.left = x(f); b.style.width = `calc(${x(t)} - ${x(f)})`; });
    g.querySelectorAll(".tick").forEach((t) => t.style.left = x(+t.dataset.t));
    g.querySelector(".legal").style.left = x(O.legalClose);
    const rg = g.querySelector(".range"); rg.style.left = x(cfg.open); rg.style.width = `calc(${x(cfg.close)} - ${x(cfg.open)})`;
    rg.style.borderColor = cfg.close > O.legalClose ? "var(--danger)" : "var(--good)";
    g.querySelector('[data-h="open"]').style.left = x(cfg.open); g.querySelector('[data-h="close"]').style.left = x(cfg.close);
    const lo = g.querySelector('[data-l="open"]'), lc = g.querySelector('[data-l="close"]');
    lo.style.left = x(cfg.open); lo.textContent = hhLong(cfg.open); lc.style.left = x(cfg.close); lc.textContent = hhLong(cfg.close);
  };
  const set = (which, h) => {
    if (which === "open") cfg.open = clamp(h, O.openMin, cfg.close - 4); else cfg.close = clamp(h, cfg.open + 4, O.closeMax);
    place(); onChange();
  };
  g.querySelectorAll(".h").forEach((hd) => {
    hd.onpointerdown = (e) => { hd.setPointerCapture(e.pointerId); hd.style.cursor = "grabbing"; };
    hd.onpointermove = (e) => { if (!hd.hasPointerCapture(e.pointerId)) return; const r = g.getBoundingClientRect(); set(hd.dataset.h, Math.round(O.openMin + clamp((e.clientX - r.left) / r.width, 0, 1) * span)); };
    hd.onpointerup = (e) => { hd.releasePointerCapture(e.pointerId); hd.style.cursor = ""; };
    hd.onkeydown = (e) => { const d = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1 }[e.key]; if (d){ e.preventDefault(); set(hd.dataset.h, cfg[hd.dataset.h] + d); } };
  });
  place();
}

function canBorrow(){
  if (S.month < F.unlockMonths) return { ok: false, why: `開業から${F.unlockMonths}か月たっていない` };
  if (riskSources().length) return { ok: false, why: "健全営業ではない（黒・グレーの営業中）" };
  if (S.riskMonths.some((x) => x.t >= S.month - F.unlockMonths)) return { ok: false, why: `直近${F.unlockMonths}か月に黒・グレーの営業がある` };
  if (S.rumor > 0) return { ok: false, why: `${R.labels.order}の風評が残っている` };
  if (S.ops.slice(-6).reduce((a, b) => a + b, 0) <= 0) return { ok: false, why: "直近6か月のキャッシュフローがマイナス" };
  const limit = Math.max(0, S.ops.slice(-12).reduce((a, b) => a + b, 0) * F.limitMultiple);
  return { ok: limit > S.debt, why: "上限まで借りている", limit };
}

window.__shop = { openBranch: (locId, t) => { const loc = byId(D.locations, locId), b = build(loc, t), cost = b.invest + D.license.fee; if (branchWhyNot() || S.branch || S.cash < cost) return false; S.cash -= cost; S.branch = { loc, tables: t, share: Math.max(0.3, 1 + hgauss(`branch:${loc.id}`) * loc.demandSd), openedAt: null, wait: EXB.waitMonths, rent: b.rent, deposit: b.deposit, fitout: b.fitout, tablesValue: b.tablesCost }; logEv("branch", {}); return true; },
  fcOn: () => { if (!S.fc) S.fc = { recruiting: false, count: 0 }; S.fc.recruiting = true; }, state: () => S, cfg: CFG, start: (cfg) => startGame({ ...CFG, ...cfg }) };

if (document.fonts && document.fonts.ready) document.fonts.ready.then(readColors);

})();
